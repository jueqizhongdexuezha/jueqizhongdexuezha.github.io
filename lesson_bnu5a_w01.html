<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="format-detection" content="telephone=no">
<title>课文点读</title>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--text:#1D1D1F;--sub:#8E8E93;
  --line:#E5E5EA;--blue:#007AFF;--fill:#F2F2F7;
  --shadow:0 .5px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:0 0 calc(78px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;}

header{padding:28px 0 6px;}
.kicker{font-size:12px;letter-spacing:.04em;color:var(--sub);font-weight:500;}
h1{margin:6px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:700;}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;
  border-radius:999px;background:var(--card);border:.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;
  transition:transform .12s ease,background .18s ease,color .18s ease,border-color .18s ease;
}
.chip:active{transform:scale(.96);}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.chip .v{color:var(--sub);font-weight:500;}
.chip.sel{background:var(--text);color:#fff;border-color:var(--text);}
.chip.sel .v{color:rgba(255,255,255,.6);}

/* 顶栏：单词库入口 + 音色 chip 同一行（chip 多时自动折到下一行，不隐藏） */
.topbar{margin:16px 0 0;padding-bottom:12px;border-bottom:.5px solid var(--line);gap:7px;align-items:center;}
.topbar #vopen{flex:none;height:30px;padding:0 11px;font-size:12.5px;background:var(--card);border:.5px solid var(--line);box-shadow:var(--shadow);}
.topbar #vopen .cnt{color:var(--blue);font-variant-numeric:tabular-nums;}
.topbar .chip{flex:none;height:30px;padding:0 10px 0 8px;font-size:12px;gap:5px;}
.topbar .chip .v{font-size:11px;}
.topbar .chip.trying{box-shadow:0 0 0 3px rgba(59,110,246,.15);}
.topbar .chip.trying .dot{animation:spin 1s linear infinite;}
.topbar .chip.on{background:rgba(59,110,246,.09);border-color:rgba(59,110,246,.32);}
@keyframes spin{0%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}100%{transform:scale(1);opacity:1}}

/* 分段控件 */
.seg3{display:inline-flex;background:#E9E9EE;border-radius:10px;padding:2px;gap:2px;}
.seg3 button{
  border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;
  color:#3A3A3C;padding:7px 15px;border-radius:8px;cursor:pointer;transition:all .18s ease;
}
.seg3 button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.10);}

.weeksel{margin:10px 0 4px;}

/* 按部分读（置顶，可横向滑动）——与词库入口分区，互不混淆 */
.grouprow{
  position:sticky;top:0;z-index:30;
  margin:14px -16px 0;padding:8px 16px;
  background:var(--bg);
  border-bottom:.5px solid var(--line);
  box-shadow:0 6px 10px -10px rgba(0,0,0,.22);
  flex-wrap:nowrap;align-items:center;
}
.gcap{flex:none;font-size:12px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:5px;}
.gcap b{color:var(--ink);font-weight:600;font-size:12.5px;}
.groupsel{
  margin:0;padding:0;background:none;border:0;box-shadow:none;
  flex:1 1 auto;min-width:0;
  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.groupsel::-webkit-scrollbar{display:none;}
.groupsel .chip{flex:none;height:30px;padding:0 12px;font-size:12.5px;font-variant-numeric:tabular-nums;}
.groupsel .chip .g{font-weight:600;}

/* 句子卡 */
section[data-wid]{margin-top:22px;}
.list{display:flex;flex-direction:column;gap:12px;}
.card{
  position:relative;background:var(--card);border-radius:20px;
  box-shadow:var(--shadow);padding:16px 16px 12px;overflow:hidden;
  transition:box-shadow .2s ease;
}
.card.band{padding-left:21px;}
.card.band::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:var(--c);border-radius:0 3px 3px 0;
}
.card.playing{box-shadow:0 0 0 2px var(--c),0 6px 20px rgba(0,0,0,.07);}
.meta{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.badge{
  font-size:11px;font-weight:700;letter-spacing:.03em;padding:2.5px 9px;
  border-radius:999px;color:var(--c);background:var(--c-soft);
}
.num{font-size:11px;color:#C7C7CC;font-variant-numeric:tabular-nums;font-weight:600;}

.en{margin:0;font-size:19px;line-height:1.62;letter-spacing:-.01em;font-weight:500;}
.zh{margin:7px 0 0;font-size:13px;line-height:1.5;color:var(--sub);}
/* 意群块：浅底胶囊把句内结构显出来；块内词照旧点查义，块内空白/标点点击=读该块 */
.seg{
  border-radius:7px;padding:1px 3px;margin:0 2px;cursor:pointer;
  background:rgba(120,130,150,.07);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  transition:background .16s ease,color .16s ease;
}
.seg:active{background:rgba(120,130,150,.16);}
.seg.on{background:var(--c-soft,#EAF0FF);color:var(--c,#007AFF);box-shadow:inset 0 0 0 1px rgba(0,122,255,.18);}
/* 段前朗读钮：小而淡，位于块左侧、不压字 */
.segplay{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;margin:0 1px 0 0;padding:0;border:none;border-radius:50%;
  background:transparent;color:#C7C7CC;font-size:8px;line-height:1;
  vertical-align:middle;cursor:pointer;font-family:inherit;
  transition:transform .12s ease,background .16s ease,color .16s ease;
}
.segplay:active{transform:scale(.9);}
.segplay.on{background:var(--c,#007AFF);color:#fff;}
.pipe{display:none;}

.acts{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:34px;padding:0 14px;border-radius:999px;border:none;
  background:var(--fill);color:var(--text);font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;
  transition:transform .12s ease,background .18s ease,color .18s ease;
}
.btn:active{transform:scale(.95);}
.btn.play{background:var(--c,var(--blue));color:#fff;padding:0 16px;}
.btn.rep.on{background:var(--c,var(--blue));color:#fff;animation:breathe 2.2s ease-in-out infinite;}
.btn.rep.on .ico{animation:spin 1.6s linear infinite;}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 transparent;}50%{box-shadow:0 0 0 5px var(--c-soft,rgba(0,122,255,.12));}}
.btn.gram{margin-left:auto;color:var(--sub);background:transparent;padding:0 8px;}
.btn.gram .cv{transition:transform .22s ease;font-size:10px;display:inline-block;}
.btn.gram.open .cv{transform:rotate(180deg);}
.ico{font-size:14px;line-height:1;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 语法：默认完全隐藏 */
.gbox{display:none;}
.gbox.show{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.ginner{
  margin-top:12px;padding:13px 14px;border-radius:14px;background:#F7F7FA;
  font-size:13.5px;line-height:1.62;
}
.gpattern{font-weight:700;color:var(--c,var(--blue));margin-bottom:8px;font-size:13.5px;}
.gpoints{margin:0;padding-left:17px;color:#3A3A3C;}
.gpoints li{margin:6px 0;}
.gpoints li::marker{color:#C7C7CC;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#fff;color:var(--sub);border:.5px solid var(--line);}

/* 底部栏 */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;}
.bar .btn{flex:none;height:36px;padding:0 12px;}
.bar .all{flex:1;background:var(--text);color:#fff;}
.rate{font-variant-numeric:tabular-nums;min-width:62px;}
.empty{padding:40px 0;text-align:center;color:var(--sub);font-size:14px;}

/* 可点词：单击查义，长按 0.45 秒直接入库；已入库的词淡灰底 + ＋ 角标 */
.en i.w{font-style:normal;border-bottom:1px dotted rgba(0,122,255,.40);cursor:pointer;padding:0 1px;position:relative;-webkit-tap-highlight-color:transparent;}
.en i.w:active{background:rgba(0,122,255,.14);border-radius:4px;}
.en i.w.inlib{background:rgba(120,130,150,.15);border-bottom-color:transparent;border-radius:4px;color:#6C6C70;}
.en i.w.inlib::after{content:'＋';position:absolute;top:-7px;right:-4px;font-size:8px;line-height:1;color:#9A9AA0;transform:rotate(45deg);}
.en i.w.bump{animation:bump .32s ease;}
@keyframes bump{0%{transform:scale(1);}45%{transform:scale(1.22);background:rgba(0,122,255,.20);}100%{transform:scale(1);}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:80;
  padding:9px 16px;border-radius:999px;background:rgba(24,24,27,.90);color:#fff;font-size:13px;line-height:1.2;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;max-width:78vw;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
/* 词卡 */
#wmask{position:fixed;inset:0;background:rgba(0,0,0,.26);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;}
#wmask.show{opacity:1;pointer-events:auto;}
#wcard{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(14px + env(safe-area-inset-bottom));transform:translateY(103%);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 30px rgba(0,0,0,.14);}
#wcard.show{transform:translateY(0);}
#wcard .hwrow{display:flex;align-items:center;gap:9px;}
#wcard .hw{font-size:26px;font-weight:600;}
#wcard .wplus{flex:none;width:26px;height:26px;border-radius:50%;background:#F2F2F4;color:#B4B4BA;
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;
  transition:background .16s ease,color .16s ease,transform .12s ease;}
#wcard .wplus:active{transform:scale(.9);}
#wcard .wplus.on{background:#EAF7EE;color:#34A853;font-size:13px;}
#wcard .base{font-size:13px;color:var(--sub);margin-top:4px;min-height:16px;}
#wcard .gl{font-size:17px;margin-top:10px;line-height:1.5;}
#wcard .sen{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.55;}
#wcard .wb{margin-top:16px;display:flex;gap:8px;}
#wcard .wb .btn{flex:1;height:44px;font-size:15px;}
#wcard .wb .add{background:var(--text);color:#fff;}
#wcard .wb .add.on{background:#eef3ff;color:#3B6EF6;}
#wcard .wb .say{flex:none;width:76px;background:#eef3ff;color:#3B6EF6;}
#wcard .wb .cls{flex:none;width:82px;}
/* 词库面板 */
#vsheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);}
#vsheet.show{transform:translateX(0);}
#vsheet .vhead,#wsheet .vhead{display:flex;align-items:center;gap:10px;padding:14px 16px calc(10px + env(safe-area-inset-top));border-bottom:.5px solid var(--line);background:#fff;}
#vsheet .vt,#wsheet .vt{flex:1;text-align:center;font-size:16px;font-weight:600;}
#vsheet .vfmt,#wsheet .vfmt{display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:13px;color:var(--sub);background:#fff;border-bottom:.5px solid var(--line);flex-wrap:wrap;}
#vsheet .vfmt label,#wsheet .vfmt label{display:flex;align-items:center;gap:4px;}
#vlist,#wlist{flex:1;overflow-y:auto;padding:8px 16px 120px;-webkit-overflow-scrolling:touch;}
.vrow{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.vrow .vm{flex:1;min-width:0;}
.vrow .vw{font-size:17px;font-weight:600;}
.vrow .vb{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px;}
.vrow .vz{font-size:14px;margin-top:3px;line-height:1.45;}
.vrow .vn{font-size:11.5px;color:#9A9AA0;margin-top:2px;line-height:1.4;}
.vrow .vs{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.45;}
.vrow .vsay{flex:none;height:30px;padding:0 11px;border:none;border-radius:999px;background:#eef3ff;color:#3B6EF6;font-size:13px;line-height:1;}
.vrow .vsay:active{background:#dfe8ff;}
.vrow .del{flex:none;width:30px;height:30px;border:none;background:#f4f4f6;border-radius:50%;color:#8e8e93;font-size:17px;line-height:1;}
#vsheet .vfoot,#wsheet .vfoot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-top:.5px solid var(--line);}
#vsheet .vfoot .btn,#wsheet .vfoot .btn{width:100%;height:46px;font-size:16px;background:var(--text);color:#fff;}
#vta{display:none;margin:0 16px 10px;width:calc(100% - 32px);height:96px;font-size:12px;line-height:1.5;border:.5px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;}
#vta.show{display:block;}
#vtip{font-size:12px;color:var(--sub);text-align:center;padding-bottom:8px;}
#vsheet .vfoot,#wsheet .vfoot{display:flex;gap:10px;}
#vsheet .vfoot .btn,#wsheet .vfoot .btn{flex:1;}
#vsheet .vfoot #vquiz,#wsheet .vfoot #vquiz{background:#eef3ff;color:#3B6EF6;}
/* 本课词表面板 */
#wsheet{position:fixed;inset:0;z-index:96;background:var(--bg);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);}
#wsheet.show{transform:translateY(0);}
#vsheet .vfmt #wopen{height:28px;padding:0 12px;border:none;border-radius:999px;background:#eef3ff;color:#3B6EF6;font-size:13px;line-height:1;flex:none;}
#wlist .vadd{flex:none;min-width:34px;height:30px;border:none;border-radius:999px;background:#eef3ff;color:#3B6EF6;font-size:15px;line-height:1;}
#wlist .vadd.on{background:#e8f6ec;color:#2E9E52;}
#wlist .vadd:active{transform:scale(.94);}
#wsheet .whint{font-size:12px;color:var(--sub);}
#wsheet .wgrp{font-size:12px;color:var(--sub);padding:6px 2px 4px;}
/* 复习闪卡 */
#qsheet{position:fixed;inset:0;z-index:90;background:linear-gradient(165deg,#f7f9ff 0%,#eef3ff 100%);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
#qsheet.show{transform:translateY(0);}
#qtop{display:flex;align-items:center;gap:10px;padding:14px 16px calc(8px + env(safe-area-inset-top));}
#qprog{flex:1;text-align:center;font-size:13px;color:var(--sub);}
#qbar{height:4px;background:rgba(20,40,80,.08);margin:0 20px;border-radius:2px;overflow:hidden;}
#qbar>i{display:block;height:100%;width:0;background:#3B6EF6;transition:width .25s;}
#qcard{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 20px 6px;overflow-y:auto;}
#qbox{width:100%;max-width:430px;min-height:230px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(30,50,90,.13);padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#qbox.tap{cursor:pointer;transition:transform .15s;}
#qbox.tap:active{transform:scale(.985);}
#qword{font-size:33px;font-weight:700;line-height:1.22;word-break:break-word;}
#qword.zh{font-size:23px;font-weight:600;line-height:1.45;}
#qhint{font-size:12px;color:#9A9AA0;margin-top:16px;}
#qans{display:none;margin-top:16px;padding-top:16px;border-top:.5px solid var(--line);width:100%;}
#qans.show{display:block;animation:qin .22s ease;}
@keyframes qin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
#qz{font-size:20px;line-height:1.5;}
#qn{font-size:12.5px;color:#9A9AA0;margin-top:8px;line-height:1.45;}
#qsay{flex:none;height:32px;padding:0 14px;border:none;border-radius:999px;background:#eef3ff;color:#3B6EF6;font-size:13px;}
/* 拼写问法：看中文写英文 */
#qspell{display:none;width:100%;margin-top:16px;padding-top:16px;border-top:.5px solid var(--line);}
#qspell.show{display:block;animation:qin .2s ease;}
#qspell input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;text-align:center;
  font-size:20px;font-family:inherit;color:var(--fg);outline:none;background:#fff;}
#qspell input:focus{border-color:#3B6EF6;box-shadow:0 0 0 3px rgba(59,110,246,.12);}
#qspell input:disabled{background:#FAFAFC;color:#86868B;}
#qres{font-size:13.5px;margin-top:10px;min-height:20px;font-weight:600;line-height:1.45;}
#qres.ok{color:#2AA34A;}
#qres.no{color:#E0362A;}
#qfoot{padding:10px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;}
#qfoot .btn{flex:1;height:52px;font-size:16px;border-radius:15px;}
#qno{background:#fff;color:#E4572E;border:1px solid #f2d4c9;}
#qyes{background:#34A853;color:#fff;border:none;}
#qyes:disabled,#qno:disabled{opacity:.45;}
#qsum{width:100%;max-width:430px;text-align:center;padding:8px 4px;}
#qsum .big{font-size:40px;font-weight:700;margin-bottom:6px;}
#qsum .line{font-size:14px;color:var(--sub);line-height:1.6;}
#qsum .wlist{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
#qsum .wlist span{background:#fff2ee;color:#C2410C;border-radius:999px;padding:4px 11px;font-size:13px;}
#qsum .abtn{margin-top:20px;display:flex;gap:10px;}
#qsum .abtn .btn{flex:1;height:46px;border-radius:13px;}
#qsum .abtn .again{background:#eef3ff;color:#3B6EF6;}
#qsum .abtn .back{background:var(--text);color:#fff;}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </header>
  <div class="row topbar" id="topbar"><button class="btn" id="vopen">单词库 <span id="vcnt">0</span></button></div>
  <div class="row grouprow" id="grouprow"><span class="gcap">▶ 按部分<b>读</b></span><div class="row groupsel" id="groupbar"></div></div>
  <div class="row weeksel" id="weekbar"></div>
  <div id="weeks"></div>
</div>

<div class="bar">
  <div class="in">
    <button class="btn" id="prev">上一句</button>
    <button class="btn all" id="all">连播</button>
    <button class="btn" id="next">下一句</button>
    <button class="btn rate" id="rate">1.0×</button>
  </div>
</div>


<div id="wmask"></div>
<div id="wcard">
  <div class="hwrow"><div class="hw" id="whw"></div><span class="wplus" id="wplus" title="加入词库">＋</span></div>
  <div class="base" id="wbase"></div>
  <div class="gl" id="wgl"></div>
  <div class="sen" id="wsen"></div>
  <div class="wb">
    <button class="btn say" id="wsay">发音</button>
    <button class="btn add" id="wadd">加入词库</button>
    <button class="btn cls" id="wcls">关闭</button>
  </div>
</div>
<div id="toast"></div>

<div id="vsheet">
  <div class="vhead">
    <button class="btn" id="vclose">返回</button>
    <div class="vt">单词库 <span id="vcnt2">0</span></div>
    <button class="btn" id="vclear">清空</button>
  </div>

}
function groupList(){
  const g=filterGids(),out=[];

}
function renderGroupBar(){

      if(window.pageYOffset>top) window.scrollTo({top:top,behavior:'smooth'});

/* ---------- 单词库 ---------- */
/* 词库按册隔离：仁爱九上沿用旧键，其他册各用 vocab_<代号>，避免两本书单词混在一起 */
const BID=(WEEKS[0]&&WEEKS[0].book)||'renai9a';
const VKEY=(BID==='renai9a')?'renai_vocab_v1':('vocab_'+BID);
let VB=[];
try{VB=JSON.parse(localStorage.getItem(VKEY)||'[]');if(!Array.isArray(VB))VB=[];}catch(e){VB=[];}
function vSave(){try{localStorage.setItem(VKEY,JSON.stringify(VB));}catch(e){}}
function vHas(w){return VB.some(x=>x.w===w);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* ---------- 单词发音：优先在线词典音源，失败回退系统语音 ---------- */
let dictA=null;
function ttsWord(t){
  try{
    if(!window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=.85;
    const vs=(window.speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
    const pref=vs.find(v=>/Aria|Zira|Samantha|Google US English|female/i.test(v.name))||vs[0];
    if(pref) u.voice=pref;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakWord(w){
  const t=String(w==null?'':w).trim();
  if(!t) return;
  try{S.audio.pause();}catch(e){}
  let fell=false;
  const fb=()=>{ if(fell) return; fell=true; ttsWord(t); };
  try{
    if(!dictA){dictA=new Audio();dictA.preload='auto';}
    dictA.onerror=fb;
    dictA.src='https://dict.youdao.com/dictvoice?type=1&audio='+encodeURIComponent(t);
    const p=dictA.play();
    if(p&&p.catch) p.catch(fb);
  }catch(e){fb();}
}
/* 释义 + 课文说明：基础义（课文中是……，表示……） */
function zWithBook(z,note){
  const s=String(z==null?'':z), n=String(note==null?'':note);
  return n?(esc(s)+'（'+esc(n)+'）'):esc(s);
}
/* 轻提示 */
let toastT=null;
function toast(msg){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg;
  el.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),1500);
}
/* 已入库的词在句子里打淡灰底 + ＋ 角标 */

/* 长按词直接入库（不弹卡）：词库只留单词 + 语境义，不存原句 */
let wordHoldMark=0;                 /* 长按入库后的一小段时间内，吞掉随后的 click，避免误弹词卡 */
function quickAdd(gid,k,raw,el){

}
function vRender(){
  const n=VB.length;
  const c1=document.getElementById('vcnt'); if(c1)c1.textContent=n;

/* ---------- 本课词表：把当前课文（或当前选中的那一课）的生词一次列入，一键入库 ---------- */
let WLIST=[];
function weekWordList(){
  const seen={}, out=[];
  ALL.forEach((rec,i)=>{
    if(!rec||!rec.sn) return;
    if(S.filter!=='all' && (!rec.w||rec.w.id!==S.filter)) return;
    const gl=rec.sn.gloss||{};
    Object.keys(gl).forEach(k=>{
      const g=gl[k];
      if(!g||!g[0]) return;
      const key=String(g[0]).toLowerCase();
      if(seen[key]) return;
      seen[key]=1;
      out.push({w:g[0],z:g[1],note:(g[2]||''),week:(rec.w&&rec.w.label)||''});
    });
  });
  return out;
}
function vAddWord(it){
  if(!it) return false;
  if(vHas(it.w)) return false;
  VB.unshift({w:it.w,note:it.note||'',z:it.z||'',t:Date.now(),book:(S.filter!=='all'?S.filter:(BID||''))});
  return true;
}
function wRender(){
  WLIST=weekWordList();
  const cnt=document.getElementById('wcnt'); if(cnt) cnt.textContent=WLIST.length;
  const sc=document.getElementById('wscope');
  if(sc){
    if(S.filter==='all') sc.textContent='全部课文';
    else{const wk=WEEKS.find(x=>x.id===S.filter); sc.textContent=(wk?wk.label:'本课');}
  }
  const L=document.getElementById('wlist'); if(!L) return;
  if(!WLIST.length){L.innerHTML='<p class="empty">这篇课文还没有可收集的词。</p>';return;}
  L.innerHTML=WLIST.map((x,i)=>{
    const has=vHas(x.w);
    return '<div class="vrow"><div class="vm"><div class="vw">'+esc(x.w)+'</div>'+
      '<div class="vz">'+zWithBook(x.z,x.note)+'</div>'+
      (S.filter==='all'&&x.week?'<div class="vn">'+esc(x.week)+'</div>':'')+
      '</div><button class="vadd'+(has?' on':'')+'" data-i="'+i+'" aria-label="加入词库">'+(has?'\u2713':'\uff0b')+'</button></div>';
  }).join('');
  L.querySelectorAll('.vadd').forEach(b=>{
    b.onclick=function(){
      const it=WLIST[+b.getAttribute('data-i')];
      if(!it) return;
      if(!vAddWord(it)){toast(it.w+' 已在词库');return;}
      vSave(); vRender();
      b.textContent='\u2713'; b.classList.add('on');
      toast('已加入词库 \u00b7 '+it.w);
    };
  });
}
function wOpen(){

  document.getElementById('wsheet').classList.add('show');
}
function wClose(){

}
function wAddAll(){

  if(!n){toast('这些词都已在词库');return;}

let CURW=null;

function vLine(x,f){

  if(f==='comma')return x.w+','+z.replace(/,/g,'，');
  return x.w+'\t'+z;
}
function vCopy(){

}
/* ---------- 词库复习（闪卡） ----------
   规则：认识即出队；不认识转回队尾，本轮最多再出现一次；答完给统计，可只复习错词。
   两种问法：看英文说中文（默认）/ 看中文想英文。 */
let QDIR='w2z';
let Q=null;
let QBOX_HTML='';
/* 存成 txt：手机里落地一份，方便再导进别的工具 */
function vDownload(){
  if(!VB.length){toast('词库还是空的');return;}
  const txt=VB.map(function(x){return (x.w||'')+'\t'+(x.z||'');}).join('\r\n');
  const d=new Date();
  const pad=function(n){return ('0'+n).slice(-2);};
  const name='单词库_'+BID+'_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.txt';
  try{
    const blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('已存成 '+name);
  }catch(e){toast('这个浏览器不支持下载，请用「复制全部」');}
}
function qRestoreCard(){
  const card=document.getElementById('qcard');
  if(card&&QBOX_HTML) card.innerHTML=QBOX_HTML;
  const f=document.getElementById('qfoot'); if(f) f.style.display='';
}
function qStart(pool){
  const src=(pool&&pool.length?pool:VB).map(x=>({w:x.w,z:x.z||'',n:x.note||'',retry:false}));
  if(!src.length){toast('词库还是空的');return;}
  for(let i=src.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=src[i];src[i]=src[j];src[j]=t;}
  qRestoreCard();
  Q={queue:src,total:src.length,known:0,miss:0,wrong:[],cur:null,flip:false,hits:0,tries:0};
  const sh=document.getElementById('qsheet'); if(sh) sh.classList.add('show');
  qNext();
}
function qNext(){
  if(!Q) return;
  if(!Q.queue.length){qSum();return;}
  Q.cur=Q.queue[0]; Q.flip=false;
  const wd=document.getElementById('qword');
  if(!wd){qRestoreCard();return;}
  const DIRTXT={w2z:'看英→中',z2w:'看中→英',spell:'拼写'};
  const db=document.getElementById('qdir'); if(db) db.textContent='问法：'+(DIRTXT[QDIR]||'看英→中');
  const sp=document.getElementById('qspell');
  const ft=document.getElementById('qfoot');
  if(QDIR==='spell'){
    wd.textContent=Q.cur.z||Q.cur.w; wd.classList.add('zh');
    if(sp) sp.classList.add('show');
    if(ft) ft.style.display='none';
    const inp=document.getElementById('qinput');
    if(inp){inp.disabled=false;inp.value='';setTimeout(function(){try{inp.focus();}catch(e){}},80);}
    const rs=document.getElementById('qres'); if(rs){rs.textContent='';rs.className='';}
  }else{
    if(sp) sp.classList.remove('show');
    if(ft) ft.style.display='';
    if(QDIR==='z2w'){wd.textContent=Q.cur.z||Q.cur.w;wd.classList.add('zh');}
    else{wd.textContent=Q.cur.w;wd.classList.remove('zh');}
  }
  const hint=document.getElementById('qhint');
  hint.style.display='';
  hint.textContent=(QDIR==='z2w')?'这是释义，想一下英文':(QDIR==='spell'?'看中文，写出英文':'点卡片看答案');
  const ans=document.getElementById('qans'); if(ans) ans.classList.remove('show');
  const pg=document.getElementById('qprog'); if(pg) pg.textContent='已记住 '+Q.known+' / '+Q.total;
  const fl=document.getElementById('qfill'); if(fl) fl.style.width=Math.round(Q.known/Q.total*100)+'%';
  const sy=document.getElementById('qsay'); if(sy) sy.style.visibility=(QDIR==='w2z')?'visible':'hidden';
}
/* 拼写判定：忽略大小写与标点，只要字母一致就算对 */
function qSpellCheck(){
  if(!Q||!Q.cur||QDIR!=='spell') return;
  const inp=document.getElementById('qinput'), rs=document.getElementById('qres');
  if(!inp||!rs||inp.disabled) return;
  const raw=inp.value.trim(); if(!raw) return;
  const norm=function(s){return String(s||'').toLowerCase().replace(/[^a-z']/g,'');};
  const ok=norm(raw)===norm(Q.cur.w);
  Q.tries++; if(ok) Q.hits++;
  rs.className=ok?'ok':'no';
  rs.textContent=ok?'✓ 正确':'✗ 正确答案：'+Q.cur.w;
  inp.disabled=true;
  const it=Q.queue.shift();
  if(ok){Q.known++;}
  else{
    Q.miss++;
    if(!Q.wrong.some(function(x){return x.w===it.w;})) Q.wrong.push(it);
    if(!it.retry){it.retry=true;Q.queue.push(it);}
  }
  Q.cur=null;
  setTimeout(qNext, ok?420:1000);
}
function qFlip(){
  if(!Q||!Q.cur||Q.flip) return;
  if(QDIR==='spell') return;
  const z=document.getElementById('qz'),n=document.getElementById('qn'),ans=document.getElementById('qans'),hint=document.getElementById('qhint');
  if(!z||!ans) return;
  if(QDIR==='z2w'){z.textContent=Q.cur.w;n.textContent=Q.cur.n||'';if(hint)hint.style.display='none';speakWord(Q.cur.w);}
  else{z.textContent=Q.cur.z||'（这条还没有释义）';n.textContent=Q.cur.n||'';if(hint)hint.style.display='none';}
  ans.classList.add('show');
  Q.flip=true;
}
function qJudge(ok){
  if(!Q||!Q.cur) return;
  Q.tries++; if(ok) Q.hits++;
  const it=Q.queue.shift();
  if(ok){Q.known++;}
  else{
    Q.miss++;
    if(!Q.wrong.some(x=>x.w===it.w)) Q.wrong.push(it);
    if(!it.retry){it.retry=true;Q.queue.push(it);}
  }
  Q.cur=null; qNext();
}
function qSum(){
  const card=document.getElementById('qcard'); if(!card) return;
  const k=Q.known,t=Q.total,wrong=Q.wrong;
  const rate=Q.tries?Math.round(Q.hits/Q.tries*100):100;
  const f=document.getElementById('qfoot'); if(f) f.style.display='none';
  card.innerHTML='<div id="qsum"><div class="big">'+k+' / '+t+'</div>'+
    '<div class="line">判定正确率 '+rate+'%（共判定 '+Q.tries+' 次）</div>'+
    '<div class="line">'+(wrong.length?('这一轮有 '+wrong.length+' 个词还生，再看一遍就记住了'):'一轮全过，这批词已经认识')+'</div>'+
    (wrong.length?'<div class="wlist">'+wrong.map(x=>'<span>'+esc(x.w)+'</span>').join('')+'</div>':'')+
    '<div class="abtn">'+(wrong.length?'<button class="btn again" id="qagain">只练错词</button>':'')+
    '<button class="btn back" id="qback">回到词库</button></div></div>';
  const pg=document.getElementById('qprog'); if(pg) pg.textContent='完成';
  const fl=document.getElementById('qfill'); if(fl) fl.style.width='100%';
  const ag=document.getElementById('qagain');
  if(ag) ag.onclick=function(){qStart(wrong.map(x=>({w:x.w,z:x.z,n:x.n})));};
  const bk=document.getElementById('qback'); if(bk) bk.onclick=qClose;
}
function qClose(){
  const sh=document.getElementById('qsheet'); if(sh) sh.classList.remove('show');
  Q=null; qRestoreCard(); vRender();
}
document.addEventListener('click',function(e){
  const t=e.target; if(!t||!t.closest) return;
  if(t.closest('#qsay')){ if(Q&&Q.cur) speakWord(Q.cur.w); return; }
  if(t.closest('#qyes')){ qJudge(true); return; }
  if(t.closest('#qno')){ qJudge(false); return; }
  if(t.closest('#qexit')){ qClose(); return; }
  if(t.closest('#qdir')){
    QDIR=(QDIR==='w2z')?'z2w':((QDIR==='z2w')?'spell':'w2z');
    if(Q&&Q.cur) qNext(); else toast('已切换问法');
    return;
  }
  if(t.closest('#qbox')){ if(Q&&Q.cur&&!Q.flip) qFlip(); }
},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='qinput'){ e.preventDefault(); qSpellCheck(); }
});
document.addEventListener('DOMContentLoaded',function(){
  const wm=document.getElementById('wmask');
  if(wm)wm.onclick=hideWord;
  const wc=document.getElementById('wcls'); if(wc)wc.onclick=hideWord;
  const ws=document.getElementById('wsay');
  if(ws)ws.onclick=function(e){if(e)e.stopPropagation();if(CURW)speakWord(CURW.w);};
  const wa=document.getElementById('wadd');
  const addCur=function(){
    if(!CURW)return;
    if(vHas(CURW.w)){hideWord();return;}
    VB.unshift({w:CURW.w,note:(CURW.note||''),z:CURW.z,t:Date.now(),book:CURW.book||''});
    vSave(); vRender();
    const pl=document.getElementById('wplus');
    if(pl){pl.textContent='✓';pl.classList.add('on');}
    if(wa){wa.textContent='已加入';wa.classList.add('on');}
    toast('已加入词库 · '+CURW.w);
    setTimeout(hideWord,520);
  };
  if(wa)wa.onclick=addCur;
  const wp=document.getElementById('wplus');
  if(wp)wp.onclick=addCur;
  const vo=document.getElementById('vopen');
  if(vo)vo.onclick=function(){vRender();document.getElementById('vsheet').classList.add('show');};
  const vc=document.getElementById('vclose');
  if(vc)vc.onclick=function(){document.getElementById('vsheet').classList.remove('show');};
  const vcl=document.getElementById('vclear');
  if(vcl)vcl.onclick=function(){
    if(!VB.length)return;
    if(confirm('确定清空 '+VB.length+' 个单词吗？清空后无法恢复。')){VB=[];vSave();vRender();document.getElementById('vta').classList.remove('show');document.getElementById('vtip').textContent='';}
  };
  const cp=document.getElementById('vcopy'); if(cp)cp.onclick=vCopy;
  const dl=document.getElementById('vdl'); if(dl)dl.onclick=vDownload;
  const qc=document.getElementById('qcard'); if(qc)QBOX_HTML=qc.innerHTML;
  const vq=document.getElementById('vquiz'); if(vq)vq.onclick=function(){qStart();};
  const wo=document.getElementById('wopen'); if(wo)wo.onclick=wOpen;
  const wcl=document.getElementById('wclose'); if(wcl)wcl.onclick=wClose;
  const wbk=document.getElementById('wback'); if(wbk)wbk.onclick=wClose;
  const wal=document.getElementById('walladd'); if(wal)wal.onclick=wAddAll;
  vRender();
});

/* ---------- 渲染句子 ---------- */
const listBox=document.getElementById('weeks');

WEEKS.forEach((w,wi)=>{
  const sec=document.createElement('section');
  sec.dataset.wid=w.id;

  const list=document.createElement('div');
  list.className='list';
  sec.appendChild(list);

  w.sentences.forEach((sn,si0)=>{
    const gid=ALL.length;
    ALL.push({gid,w,sn,dom:null});

    const isD=(w.mode==='dialogue'||w.mode==='mixed');
    const sp=sn.spk?(spkById[sn.spk]||null):null;
    const card=document.createElement('article');
    card.className='card'+(sp?' band':'');
    if(isD&&sp){card.style.setProperty('--c',sp.color);card.style.setProperty('--c-soft',soft(sp.color));}
    else{card.style.setProperty('--c','#007AFF');card.style.setProperty('--c-soft','rgba(0,122,255,.10)');}
    card.dataset.gid=gid;
    ALL[gid].dom=card;

    const tokify=t=>t.replace(/[A-Za-z][A-Za-z'\u2019\-]*/g,m=>{
      const k=m.toLowerCase().replace(/\u2019/g,"'");
      return (sn.gloss&&sn.gloss[k])?'<i class="w" data-w="'+k+'" data-lib="'+String((sn.gloss[k]&&sn.gloss[k][0])||k).replace(/"/g,'&quot;')+'">'+m+'</i>':m;
    });
    let enHtml;
    if(sn.segs&&sn.segs.length){
      enHtml=sn.segs.map((g,i)=>
        '<button class="segplay" data-si="'+i+'" aria-label="读这一段" title="读这一段">▶</button>'+
        '<span class="seg" data-gid="'+gid+'" data-si="'+i+'">'+tokify(g.text)+'</span>'
      ).join(' ');
    }else{ enHtml=tokify(sn.en); }

    card.innerHTML=
      (isD&&sp?'<div class="meta"><span class="badge">'+sp.name+'</span><span class="num">'+
        String(sn.idx).padStart(2,'0')+'</span></div>':'')+
      '<p class="en">'+enHtml+'</p>'+
      (sn.zh?'<p class="zh">'+sn.zh+'</p>':'')+
      '<div class="acts">'+
        '<button class="btn play"><span class="ico">▶</span>整句</button>'+
        '<button class="btn rep"><span class="ico">↻</span><span class="t">复读</span></button>'+
        (sn.gram?'<button class="btn gram">语法 <span class="cv">▼</span></button>':'')+
      '</div>'+
      (sn.gram?'<div class="gbox"><div class="ginner">'+
        '<div class="gpattern">'+sn.gram.pattern+'</div>'+
        (sn.gram.points&&sn.gram.points.length?'<ul class="gpoints">'+sn.gram.points.map(p=>'<li>'+p+'</li>').join('')+'</ul>':'')+
        (sn.gram.tags&&sn.gram.tags.length?'<div class="tags">'+sn.gram.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>':'')+
      '</div></div>':'');

    list.appendChild(card);

    card.querySelector('.btn.play').onclick=e=>{e.stopPropagation();playWhole(gid);};
    card.querySelector('.btn.rep').onclick=e=>{e.stopPropagation();toggleRepeat(gid);};
    const gb=card.querySelector('.btn.gram');
    if(gb){
      gb.onclick=e=>{
        e.stopPropagation();
        const g=card.querySelector('.gbox');
        const o=g.classList.toggle('show');
        gb.classList.toggle('open',o);
      };
    }
    const enDelegate=card.querySelector('.en');
    if(enDelegate){
      let wT=null,wHeld=false;
      /* 长按单词 0.45 秒 = 直接入库；单击 = 查义 */
      enDelegate.addEventListener('pointerdown',e=>{
        const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
        if(!tw) return;
        wHeld=false;
        wT=setTimeout(()=>{wHeld=true;quickAdd(gid,tw.getAttribute('data-w'),tw.textContent,tw);},450);
      });
      ['pointerup','pointercancel','pointerleave'].forEach(t=>{
        enDelegate.addEventListener(t,()=>{
          if(wT){clearTimeout(wT);wT=null;}
          if(wHeld) setTimeout(()=>{wHeld=false;},420);
        });
      });
      enDelegate.addEventListener('click',e=>{
        const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
        if(wHeld){e.stopPropagation();return;}       /* 长按已入库：吞掉这次 click，不弹词卡 */
        if(tw){
          e.stopPropagation();
          if(!(S.curGid===gid&&!S.audio.paused)) playWhole(gid);  /* 整条直读：点任一单词即朗读整句 */
          showWord(gid,tw.getAttribute('data-w'),tw.textContent);
        }
      });
    }
    card.querySelectorAll('.segplay').forEach(el=>{
      el.onclick=e=>{
        e.stopPropagation();
        const s=+el.dataset.si;
        card.querySelectorAll('.segplay').forEach(x=>x.classList.remove('on'));
        el.classList.add('on');
        playSeg(gid,s);
      };
    });
    card.querySelectorAll('.seg').forEach(el=>{
      const si=+el.dataset.si;
      let holdT=null, held=false;
      el.addEventListener('pointerdown',e=>{
        held=false;
        const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
        if(tw) return;                              /* 落在单词上：只做查词，不启用长按 */
        holdT=setTimeout(()=>{held=true;playSeg(gid,si);},450);
      });
      ['pointerup','pointercancel','pointerleave'].forEach(t=>{
        el.addEventListener(t,()=>{if(holdT){clearTimeout(holdT);holdT=null;}});
      });
      el.addEventListener('click',e=>{
        const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
        if(tw){
          e.stopPropagation();
          if(Date.now()<wordHoldMark) return;          /* 刚长按入库：不弹词卡 */
          if(!(S.curGid===gid&&!S.audio.paused)) playWhole(gid);  /* 整条直读：点任一单词即朗读整句 */
          showWord(gid,tw.getAttribute('data-w'),tw.textContent);
          return;
        }
        if(held){held=false;e.stopPropagation();return;}   /* 长按已读，吞掉这次 click */
        e.stopPropagation();playSeg(gid,si);               /* 块内空白/标点：读这一段 */
      });
    });
  });

  listBox.appendChild(sec);
});

/* ---------- 筛选 ---------- */
function applyFilter(){
  const gl=groupList();
  const sel=(S.group>=0&&gl[S.group])?new Set(gl[S.group]):null;
  document.querySelectorAll('#weeks section').forEach(sec=>{
    const on=(S.filter==='all'||sec.dataset.wid===S.filter);
    let shown=0;
    sec.querySelectorAll('.card').forEach(c=>{
      const vis=on&&(!sel||sel.has(+c.dataset.gid));
      c.style.display=vis?'':'none';
      if(vis) shown++;
    });
    sec.style.display=(on&&shown)?'':'none';
  });
}
function visibleGids(){
  const out=[];
  document.querySelectorAll('#weeks section').forEach(sec=>{
    if(sec.style.display==='none') return;
    sec.querySelectorAll('.card').forEach(c=>{
      if(c.style.display!=='none') out.push(+c.dataset.gid);
    });
  });
  return out;
}

/* ---------- 播放核心 ---------- */
function voiceFor(rec){
  const sp=rec.sn.spk?(spkById[rec.sn.spk]||null):null;
  if(sp) return S.voiceOf[sp.id]||sp.voice||'f';
  if(!rec.sn.spk){
    return S.passageVoice==='rand'?(Math.random()<.5?'f':'m'):(S.passageVoice||'f');
  }
  return 'f';
}
function fileOf(rec,si,v){
  const g=(si>=0&&rec.sn.segs)?rec.sn.segs[si]:null;
  var p=(g&&g.file)?rec.w.audio+g.file+'_'+v+'.mp3':rec.w.audio+rec.sn.whole+'_'+v+'.mp3';
  return (typeof AUDIO!=='undefined'&&AUDIO[p])?AUDIO[p]:p;
}
function markPlaying(gid){
  ALL.forEach(r=>r.dom.classList.toggle('playing',r.gid===gid));
}
function resetRepeat(){
  S.repLeft=0;S.repCard=-1;S.repPrefix='复读 ';
  document.querySelectorAll('.btn.rep').forEach(b=>{
    b.classList.remove('on');
    const t=b.querySelector('.t'); if(t) t.textContent='复读';
  });
}
function setRepText(gid,txt){
  const b=ALL[gid].dom.querySelector('.btn.rep');
  if(b&&b.classList.contains('on')) b.querySelector('.t').textContent=txt;
}

function start(gid,si,repeats){
  const rec=ALL[gid];
  if(!rec) return;
  const v=voiceFor(rec);
  S.seq++; const token=S.seq;
  S.curGid=gid;
  S.repLeft=repeats;
  S.chain=[si];   /* 整句一律播整句音频；块读只播该块 */
  S.ci=0;
  S.audio.src=fileOf(rec,S.chain[0],v);
  S.audio.playbackRate=S.rate;
  markPlaying(gid);
  S.audio.play().catch(()=>{});

  const playAt=(idx)=>{
    S.ci=idx;
    S.audio.src=fileOf(rec,S.chain[idx],v);
    S.audio.playbackRate=S.rate;
    S.audio.play().catch(()=>{});
  };

  S.audio.onended=()=>{
    if(S.seq!==token) return;
    if(S.ci<S.chain.length-1){ playAt(S.ci+1); return; }
    if(S.repLeft>1){
      S.repLeft--;
      setRepText(gid,S.repPrefix+(repeats-S.repLeft+1)+'/'+repeats);
      playAt(0);
      return;
    }
    const wasRepeat=S.repCard===gid;
    resetRepeat();
    markPlaying(-1);
    if(S.allMode){
      const vis=visibleGids();
      const at=vis.indexOf(gid);
      if(at>=0&&at<vis.length-1){
        setTimeout(()=>{ if(S.allMode) start(vis[at+1],-1,0); },320);
        return;
      }
      S.allMode=false;
      document.getElementById('all').textContent='连播';
    }
  };
}

function playWhole(gid){
  if(S.curGid===gid&&!S.audio.paused){S.seq++;S.audio.pause();resetRepeat();markPlaying(-1);return;}
  resetRepeat();
  S.segGid=-1;S.segSi=-1;
  ALL[gid].dom.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));
  ALL[gid].dom.querySelectorAll('.segplay').forEach(x=>x.classList.remove('on'));
  start(gid,-1,0);
}
function playSeg(gid,si){
  resetRepeat();
  S.segGid=gid;S.segSi=si;
  const rec=ALL[gid];
  if(rec){
    rec.dom.querySelectorAll('.seg').forEach(x=>x.classList.toggle('on',+x.dataset.si===si));
    rec.dom.querySelectorAll('.segplay').forEach(x=>x.classList.toggle('on',+x.dataset.si===si));
  }
  start(gid,si,0);
}
function toggleRepeat(gid){
  const btn=ALL[gid].dom.querySelector('.btn.rep');
  if(btn.classList.contains('on')){S.seq++;S.audio.pause();resetRepeat();markPlaying(-1);return;}
  resetRepeat();
  const rec=ALL[gid];
  const hasSeg=!!(rec.sn.segs&&rec.sn.segs.length&&S.segGid===gid&&S.segSi>=0);
  btn.classList.add('on');
  S.repPrefix=hasSeg?'复读本段 ':'复读 ';
  btn.querySelector('.t').textContent=S.repPrefix+'1/'+DATA.repeatDefault;
  S.repCard=gid;
  start(gid,hasSeg?S.segSi:-1,DATA.repeatDefault);
  S.repCard=gid;
}
function stopAll(){
  S.seq++;S.audio.pause();resetRepeat();markPlaying(-1);
  S.allMode=false;
  document.getElementById('all').textContent='连播';
}

/* ---------- 底部栏 ---------- */
document.getElementById('prev').onclick=()=>{
  const vis=visibleGids(); if(!vis.length) return;
  const at=vis.indexOf(S.curGid);
  const t=vis[at<=0?0:at-1];
  stopAll(); start(t,-1,0);
};
document.getElementById('next').onclick=()=>{
  const vis=visibleGids(); if(!vis.length) return;
  const at=vis.indexOf(S.curGid);
  const t=vis[(at<0||at>=vis.length-1)?vis.length-1:at+1];
  stopAll(); start(t,-1,0);
};
document.getElementById('all').onclick=e=>{
  if(S.allMode){stopAll();return;}
  const vis=visibleGids(); if(!vis.length) return;
  stopAll();
  S.allMode=true;
  e.currentTarget.textContent='停止';
  start(vis[0],-1,0);
};
document.getElementById('rate').onclick=e=>{
  const o=[1.0,0.9,0.75];
  S.rate=o[(o.indexOf(S.rate)+1)%o.length];
  e.currentTarget.textContent=S.rate.toFixed(2).replace(/0$/,'')+'×';
  S.audio.playbackRate=S.rate;
};

/* ---------- 启动 ---------- */
renderVoiceBar();
renderWeekBar();
renderGroupBar();
applyFilter();
</script>
