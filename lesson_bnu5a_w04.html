<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="format-detection" content="telephone=no">
<title>课文点读</title>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--text:#1D1D1F;--sub:#8E8E93;
  --line:#E5E5EA;--blue:#007AFF;--fill:#F2F2F7;
  --shadow:0 .5px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:0 0 calc(78px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;}

header{padding:28px 0 6px;}
.kicker{font-size:12px;letter-spacing:.04em;color:var(--sub);font-weight:500;}
h1{margin:6px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:700;}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;
  border-radius:999px;background:var(--card);border:.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;
  transition:transform .12s ease,background .18s ease,color .18s ease,border-color .18s ease;
}
.chip:active{transform:scale(.96);}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.chip .v{color:var(--sub);font-weight:500;}
.chip.sel{background:var(--text);color:#fff;border-color:var(--text);}
.chip.sel .v{color:rgba(255,255,255,.6);}

/* 顶栏：单词库入口 + 音色 chip 同一行（chip 多时自动折到下一行，不隐藏） */
.topbar{margin:16px 0 0;padding-bottom:12px;border-bottom:.5px solid var(--line);gap:8px;align-items:center;}
.topbar #vopen{flex:none;background:var(--card);border:.5px solid var(--line);box-shadow:var(--shadow);}
.topbar #vopen .cnt{color:var(--blue);font-variant-numeric:tabular-nums;}
.topbar .chip{flex:none;height:32px;padding:0 11px 0 9px;font-size:12.5px;gap:6px;}
.topbar .chip.trying{box-shadow:0 0 0 3px rgba(59,110,246,.15);}
.topbar .chip.trying .dot{animation:spin 1s linear infinite;}
@keyframes spin{0%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}100%{transform:scale(1);opacity:1}}

/* 分段控件 */
.seg3{display:inline-flex;background:#E9E9EE;border-radius:10px;padding:2px;gap:2px;}
.seg3 button{
  border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;
  color:#3A3A3C;padding:7px 15px;border-radius:8px;cursor:pointer;transition:all .18s ease;
}
.seg3 button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.10);}

.weeksel{margin:10px 0 4px;}

/* 按部分读（置顶，可横向滑动）——与词库入口分区，互不混淆 */
.grouprow{
  position:sticky;top:0;z-index:30;
  margin:14px -16px 0;padding:8px 16px;
  background:var(--bg);
  border-bottom:.5px solid var(--line);
  box-shadow:0 6px 10px -10px rgba(0,0,0,.22);
  flex-wrap:nowrap;align-items:center;
}
.gcap{flex:none;font-size:12px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:5px;}
.gcap b{color:var(--ink);font-weight:600;font-size:12.5px;}
.groupsel{
  margin:0;padding:0;background:none;border:0;box-shadow:none;
  flex:1 1 auto;min-width:0;
  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.groupsel::-webkit-scrollbar{display:none;}
.groupsel .chip{flex:none;height:30px;padding:0 12px;font-size:12.5px;font-variant-numeric:tabular-nums;}
.groupsel .chip .g{font-weight:600;}

/* 句子卡 */
section[data-wid]{margin-top:22px;}
.list{display:flex;flex-direction:column;gap:12px;}
.card{
  position:relative;background:var(--card);border-radius:20px;
  box-shadow:var(--shadow);padding:16px 16px 12px;overflow:hidden;
  transition:box-shadow .2s ease;
}
.card.band{padding-left:21px;}
.card.band::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:var(--c);border-radius:0 3px 3px 0;
}
.card.playing{box-shadow:0 0 0 2px var(--c),0 6px 20px rgba(0,0,0,.07);}
.meta{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.badge{
  font-size:11px;font-weight:700;letter-spacing:.03em;padding:2.5px 9px;
  border-radius:999px;color:var(--c);background:var(--c-soft);
}
.num{font-size:11px;color:#C7C7CC;font-variant-numeric:tabular-nums;font-weight:600;}

.en{margin:0;font-size:19px;line-height:1.62;letter-spacing:-.01em;font-weight:500;}
.zh{margin:7px 0 0;font-size:13px;line-height:1.5;color:var(--sub);}
/* 意群块：浅底胶囊把句内结构显出来；块内词照旧点查义，块内空白/标点点击=读该块 */
.seg{
  border-radius:7px;padding:1px 3px;margin:0 2px;cursor:pointer;
  background:rgba(120,130,150,.07);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  transition:background .16s ease,color .16s ease;
}
.seg:active{background:rgba(120,130,150,.16);}
.seg.on{background:var(--c-soft,#EAF0FF);color:var(--c,#007AFF);box-shadow:inset 0 0 0 1px rgba(0,122,255,.18);}
/* 段前朗读钮：小而淡，位于块左侧、不压字 */
.segplay{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;margin:0 1px 0 0;padding:0;border:none;border-radius:50%;
  background:transparent;color:#C7C7CC;font-size:8px;line-height:1;
  vertical-align:middle;cursor:pointer;font-family:inherit;
  transition:transform .12s ease,background .16s ease,color .16s ease;
}
.segplay:active{transform:scale(.9);}
.segplay.on{background:var(--c,#007AFF);color:#fff;}
.pipe{display:none;}

.acts{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:34px;padding:0 14px;border-radius:999px;border:none;
  background:var(--fill);color:var(--text);font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;
  transition:transform .12s ease,background .18s ease,color .18s ease;
}
.btn:active{transform:scale(.95);}
.btn.play{background:var(--c,var(--blue));color:#fff;padding:0 16px;}
.btn.rep.on{background:var(--c,var(--blue));color:#fff;animation:breathe 2.2s ease-in-out infinite;}
.btn.rep.on .ico{animation:spin 1.6s linear infinite;}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 transparent;}50%{box-shadow:0 0 0 5px var(--c-soft,rgba(0,122,255,.12));}}
.btn.gram{margin-left:auto;color:var(--sub);background:transparent;padding:0 8px;}
.btn.gram .cv{transition:transform .22s ease;font-size:10px;display:inline-block;}
.btn.gram.open .cv{transform:rotate(180deg);}
.ico{font-size:14px;line-height:1;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 语法：默认完全隐藏 */
.gbox{display:none;}
.gbox.show{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.ginner{
  margin-top:12px;padding:13px 14px;border-radius:14px;background:#F7F7FA;
  font-size:13.5px;line-height:1.62;
}
.gpattern{font-weight:700;color:var(--c,var(--blue));margin-bottom:8px;font-size:13.5px;}
.gpoints{margin:0;padding-left:17px;color:#3A3A3C;}
.gpoints li{margin:6px 0;}
.gpoints li::marker{color:#C7C7CC;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#fff;color:var(--sub);border:.5px solid var(--line);}

/* 底部栏 */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;}
.bar .btn{flex:none;height:36px;padding:0 12px;}
.bar .all{flex:1;background:var(--text);color:#fff;}
.rate{font-variant-numeric:tabular-nums;min-width:62px;}
.empty{padding:40px 0;text-align:center;color:var(--sub);font-size:14px;}

/* 可点词 */
.en i.w{font-style:normal;border-bottom:1px dotted rgba(0,122,255,.40);cursor:pointer;padding:0 1px;-webkit-tap-highlight-color:transparent;}
.en i.w:active{background:rgba(0,122,255,.14);border-radius:4px;}
/* 词卡 */
#wmask{position:fixed;inset:0;background:rgba(0,0,0,.26);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;}
#wmask.show{opacity:1;pointer-events:auto;}
#wcard{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(14px + env(safe-area-inset-bottom));transform:translateY(103%);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 30px rgba(0,0,0,.14);}
#wcard.show{transform:translateY(0);}
#wcard .hw{font-size:26px;font-weight:600;}
#wcard .base{font-size:13px;color:var(--sub);margin-top:4px;min-height:16px;}
#wcard .gl{font-size:17px;margin-top:10px;line-height:1.5;}
#wcard .sen{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.55;}
#wcard .wb{margin-top:16px;display:flex;gap:8px;}
#wcard .wb .btn{flex:1;height:44px;font-size:15px;}
#wcard .wb .add{background:var(--text);color:#fff;}
#wcard .wb .add.on{background:#eef3ff;color:#3B6EF6;}
#wcard .wb .say{flex:none;width:76px;background:#eef3ff;color:#3B6EF6;}
#wcard .wb .cls{flex:none;width:82px;}
/* 词库面板 */
#vsheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);}
#vsheet.show{transform:translateX(0);}
#vsheet .vhead{display:flex;align-items:center;gap:10px;padding:14px 16px calc(10px + env(safe-area-inset-top));border-bottom:.5px solid var(--line);background:#fff;}
#vsheet .vt{flex:1;text-align:center;font-size:16px;font-weight:600;}
#vsheet .vfmt{display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:13px;color:var(--sub);background:#fff;border-bottom:.5px solid var(--line);flex-wrap:wrap;}
#vsheet .vfmt label{display:flex;align-items:center;gap:4px;}
#vlist{flex:1;overflow-y:auto;padding:8px 16px 120px;-webkit-overflow-scrolling:touch;}
.vrow{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.vrow .vm{flex:1;min-width:0;}
.vrow .vw{font-size:17px;font-weight:600;}
.vrow .vb{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px;}
.vrow .vz{font-size:14px;margin-top:3px;}
.vrow .vs{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.45;}
.vrow .vsay{flex:none;height:30px;padding:0 11px;border:none;border-radius:999px;background:#eef3ff;color:#3B6EF6;font-size:13px;line-height:1;}
.vrow .vsay:active{background:#dfe8ff;}
.vrow .del{flex:none;width:30px;height:30px;border:none;background:#f4f4f6;border-radius:50%;color:#8e8e93;font-size:17px;line-height:1;}
#vsheet .vfoot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-top:.5px solid var(--line);}
#vsheet .vfoot .btn{width:100%;height:46px;font-size:16px;background:var(--text);color:#fff;}
#vta{display:none;margin:0 16px 10px;width:calc(100% - 32px);height:96px;font-size:12px;line-height:1.5;border:.5px solid var(--line);border-radius:10px;padding:8px;font-family:inherit;}
#vta.show{display:block;}
#vtip{font-size:12px;color:var(--sub);text-align:center;padding-bottom:8px;}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </header>
  <div class="row topbar" id="topbar"><button class="btn" id="vopen">单词库 <span id="vcnt">0</span></button></div>
  <div class="row grouprow" id="grouprow"><span class="gcap">▶ 按部分<b>读</b></span><div class="row groupsel" id="groupbar"></div></div>
  <div class="row weeksel" id="weekbar"></div>
  <div id="weeks"></div>
</div>

<div class="bar">
  <div class="in">
    <button class="btn" id="prev">上一句</button>
    <button class="btn all" id="all">连播</button>
    <button class="btn" id="next">下一句</button>
    <button class="btn rate" id="rate">1.0×</button>
  </div>
</div>


<div id="wmask"></div>
<div id="wcard">
  <div class="hw" id="whw"></div>
  <div class="base" id="wbase"></div>
  <div class="gl" id="wgl"></div>
  <div class="sen" id="wsen"></div>
  <div class="wb">
    <button class="btn say" id="wsay">发音</button>
    <button class="btn add" id="wadd">加入词库</button>
    <button class="btn cls" id="wcls">关闭</button>
  </div>
</div>

<div id="vsheet">
  <div class="vhead">
    <button class="btn" id="vclose">返回</button>
    <div class="vt">单词库 <span id="vcnt2">0</span></div>
    <button class="btn" id="vclear">清空</button>
  </div>
  <div class="vfmt">
    <span>导出格式</span>
    <label><input type="radio" name="vfmt" value="tab" checked>制表符</label>
    <label><input type="radio" name="vfmt" value="comma">逗号</label>
    <label><input type="radio" name="vfmt" value="sen">带原句</label>
  </div>
  <div id="vlist"></div>
  <textarea id="vta" readonly></textarea>
  <div id="vtip"></div>
  <div class="vfoot"><button class="btn" id="vcopy">复制全部</button></div>
</div>

const WEEKS = DATA.weeks;

/* ---------- 全局状态 ---------- */
const S = {
  voiceOf:{},          // 对话类：角色 -> 'f'/'m'（全局复用）
  passageVoice:'f',    // 文章类：'f'/'m'/'rand'
  rate:1.0,
  audio:new Audio(),
  seq:0,
  curGid:-1,
  curCard:null,
  repLeft:0,
  repCard:-1,
  repPrefix:'复读 ',
  segGid:-1,           // 当前选中的意群块（用于"复读本段"）
  segSi:-1,
  allMode:false,
  filter:'all',
  group:0
};
S.audio.preload='auto';

const ALL=[];            // 扁平句表
const spkById={};
WEEKS.forEach(w=>{
  (w.speakers||[]).forEach(sp=>{
    spkById[sp.id]=sp;
    if(!(sp.id in S.voiceOf)) S.voiceOf[sp.id]=sp.voice;
  });
});

/* ---------- 头部 ---------- */
document.getElementById('kicker').textContent=DATA.kicker;
document.getElementById('title').textContent=DATA.title;

function soft(hex){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',0.13)';
}

/* ---------- 音色设置条 ---------- */
/* 音色设置条：与「单词库」合并成一行；统一用 chip 呈现
   - 多角色课：每个角色一颗 chip，点一下切 女/男 并立即试听
   - 单角色课（整课旁白）：拆成「女声 / 男声」两颗 chip，点哪颗听哪颗 */
const MALE_COLOR='#FF9500';
function previewSp(spId,v){
  const rec=ALL.find(r=>r.sn.spk===spId);
  if(!rec) return;
  stopAll();
  S.seq++;
  const chip=document.querySelector('#topbar .chip[data-sp="'+spId+'"]');
  if(chip) chip.classList.add('trying');
  S.audio.onended=()=>{ if(chip) chip.classList.remove('trying'); };
  S.audio.src=fileOf(rec,-1,v);
  S.audio.playbackRate=S.rate;
  S.audio.play().catch(()=>{ if(chip) chip.classList.remove('trying'); });
}
function renderVoiceBar(){
  const bar=document.getElementById('topbar');
  Array.prototype.slice.call(bar.querySelectorAll('.chip')).forEach(x=>x.remove());
  const sps=[];
  WEEKS.forEach(w=>(w.speakers||[]).forEach(sp=>{ if(!sps.some(x=>x.id===sp.id)) sps.push(sp); }));
  if(!sps.length) return;

  const mkChip=(sp,v,label,sel)=>{
    const b=document.createElement('button');
    b.className='chip'+(sel?' sel':'');
    b.dataset.sp=sp.id;
    b.innerHTML='<span class="dot" style="background:'+(v==='m'?MALE_COLOR:sp.color)+'"></span>'+
                '<span>'+sp.name+'</span><span class="v">'+label+'</span>';
    b.onclick=()=>{
      S.voiceOf[sp.id]=v||(S.voiceOf[sp.id]==='f'?'m':'f');
      renderVoiceBar();
      previewSp(sp.id,S.voiceOf[sp.id]);
    };
    return b;
  };

  if(sps.length<=1){
    const sp=sps[0];
    const cur=S.voiceOf[sp.id]||sp.voice||'f';
    bar.appendChild(mkChip(sp,'f','女声',cur==='f'));
    bar.appendChild(mkChip(sp,'m','男声',cur==='m'));
  }else{
    sps.forEach(sp=>{
      const cur=S.voiceOf[sp.id]||sp.voice||'f';
      bar.appendChild(mkChip(sp,'',cur==='f'?'女声':'男声',false));
    });
  }
}

/* ---------- 周筛选 ---------- */
function renderWeekBar(){
  const box=document.getElementById('weekbar');
  box.innerHTML='';
  if(WEEKS.length<2) return;
  const mk=(id,txt)=>{
    const b=document.createElement('button');
    b.className='chip'+(S.filter===id?' sel':'');
    b.innerHTML='<span>'+txt+'</span>';
    b.onclick=()=>{S.filter=id;S.group=0;renderWeekBar();renderGroupBar();applyFilter();stopAll();};
    return b;
  };
  box.appendChild(mk('all','全部'));
  WEEKS.forEach(w=>box.appendChild(mk(w.id,w.label)));
}

/* ---------- 分组：每 6 句一组 ---------- */
const PER=6;
function filterGids(){
  return ALL.filter(x=>S.filter==='all'||x.w.id===S.filter).map(x=>x.gid);
}
function groupList(){
  const g=filterGids(),out=[];
  for(let i=0;i<g.length;i+=PER) out.push(g.slice(i,i+PER));
  return out;
}
function renderGroupBar(){
  const box=document.getElementById('groupbar');
  box.innerHTML='';
  const gl=groupList();
  if(gl.length<=1){box.style.display='none';return;}
  box.style.display='';
  const mk=(idx,txt)=>{
    const b=document.createElement('button');
    b.className='chip'+(S.group===idx?' sel':'');
    b.innerHTML='<span>'+txt+'</span>';
    b.onclick=()=>{S.group=idx;renderGroupBar();applyFilter();stopAll();
      const top=document.getElementById('grouprow').getBoundingClientRect().top+window.pageYOffset-8;
      if(window.pageYOffset>top) window.scrollTo({top:top,behavior:'smooth'});
      /* 按部分读：只读这一部分的句子，读完即停 */
      if(idx<0) return;
      const g=groupList()[idx];
      if(!g||!g.length) return;
      S.allMode=true;
      document.getElementById('all').textContent='停止';
      start(g[0],-1,0);
    };
    return b;
  };
  box.appendChild(mk(-1,'全部'));
  gl.forEach((g,i)=>{
    box.appendChild(mk(i,(g[0]+1)+'-'+(g[g.length-1]+1)));
  });
  const sel=box.querySelector('.chip.sel');
  if(sel) box.scrollLeft=Math.max(0,sel.offsetLeft-box.clientWidth/2+sel.offsetWidth/2);
}


/* ---------- 单词库 ---------- */
/* 词库按册隔离：仁爱九上沿用旧键，其他册各用 vocab_<代号>，避免两本书单词混在一起 */
const BID=(WEEKS[0]&&WEEKS[0].book)||'renai9a';
const VKEY=(BID==='renai9a')?'renai_vocab_v1':('vocab_'+BID);
let VB=[];
try{VB=JSON.parse(localStorage.getItem(VKEY)||'[]');if(!Array.isArray(VB))VB=[];}catch(e){VB=[];}
function vSave(){try{localStorage.setItem(VKEY,JSON.stringify(VB));}catch(e){}}
function vHas(w){return VB.some(x=>x.w===w);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* ---------- 单词发音：优先在线词典音源，失败回退系统语音 ---------- */
let dictA=null;
function ttsWord(t){
  try{
    if(!window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=.85;
    const vs=(window.speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
    const pref=vs.find(v=>/Aria|Zira|Samantha|Google US English|female/i.test(v.name))||vs[0];
    if(pref) u.voice=pref;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakWord(w){
  const t=String(w==null?'':w).trim();
  if(!t) return;
  try{S.audio.pause();}catch(e){}
  let fell=false;
  const fb=()=>{ if(fell) return; fell=true; ttsWord(t); };
  try{
    if(!dictA){dictA=new Audio();dictA.preload='auto';}
    dictA.onerror=fb;
    dictA.src='https://dict.youdao.com/dictvoice?type=1&audio='+encodeURIComponent(t);
    const p=dictA.play();
    if(p&&p.catch) p.catch(fb);
  }catch(e){fb();}
}
/* 释义 + 课文说明：基础义（课文中是……，表示……） */
function zWithBook(z,note){
  const s=String(z==null?'':z), n=String(note==null?'':note);
  return n?(esc(s)+'（'+esc(n)+'）'):esc(s);
}
function vRender(){
  const n=VB.length;
  const c1=document.getElementById('vcnt'); if(c1)c1.textContent=n;
  const c2=document.getElementById('vcnt2'); if(c2)c2.textContent=n;
  const L=document.getElementById('vlist'); if(!L)return;
  if(!n){L.innerHTML='<p class="empty">还没有收集单词。<br>在句子里点一下单词，再点「加入词库」。</p>';return;}
  L.innerHTML=VB.map((x,i)=>
    '<div class="vrow"><div class="vm">'+
      '<div class="vw">'+esc(x.w)+'</div>'+
      '<div class="vz">'+zWithBook(x.z,x.note)+'</div>'+
      (x.s?'<div class="vs">'+esc(x.s)+'</div>':'')+
    '</div><button class="vsay" data-i="'+i+'" aria-label="朗读单词">发音</button>'+
    '<button class="del" data-i="'+i+'" aria-label="删除">×</button></div>').join('');
  L.querySelectorAll('.vsay').forEach(b=>{
    b.onclick=function(){const it=VB[+b.getAttribute('data-i')];if(it)speakWord(it.w);};
  });
  L.querySelectorAll('.del').forEach(b=>{
    b.onclick=()=>{VB.splice(+b.getAttribute('data-i'),1);vSave();vRender();};
  });
}
let CURW=null;
function showWord(gid,k,raw){
  const rec=ALL[gid]; if(!rec)return;
  const sn=rec.sn, g=(sn.gloss||{})[k];
  if(!g)return;
  CURW={w:g[0],note:(g[2]||''),z:g[1],s:sn.en,t:Date.now(),book:(rec.w&&rec.w.id)||''};
  document.getElementById('whw').textContent=raw;
  document.getElementById('wbase').textContent=(g[0].toLowerCase()!==k.toLowerCase())?('原形：'+g[0]):'';
  document.getElementById('wgl').innerHTML=zWithBook(g[1],g[2]);
  document.getElementById('wsen').textContent=sn.en;
  const btn=document.getElementById('wadd');
  if(vHas(CURW.w)){btn.textContent='已在词库';btn.classList.add('on');}
  else{btn.textContent='加入词库';btn.classList.remove('on');}
  document.getElementById('wmask').classList.add('show');
  document.getElementById('wcard').classList.add('show');
}
function hideWord(){
  document.getElementById('wmask').classList.remove('show');
  document.getElementById('wcard').classList.remove('show');
}
function vLine(x,f){
  if(f==='comma')return x.w+','+String(x.z||'').replace(/,/g,'，');
  if(f==='sen')return x.w+'\t'+(x.z||'')+'\t'+(x.s||'');
  return x.w+'\t'+(x.z||'');
}
function vCopy(){
  if(!VB.length){document.getElementById('vtip').textContent='词库还是空的';return;}
  const el=document.querySelector('input[name=vfmt]:checked');
  const f=el?el.value:'tab';
  const txt=VB.map(x=>vLine(x,f)).join('\n');
  const ta=document.getElementById('vta');
  ta.value=txt; ta.classList.add('show');
  let ok=false;
  try{ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(()=>{});ok=true;}
  document.getElementById('vtip').textContent=ok?'已复制 '+VB.length+' 个单词，可直接粘贴到背单词软件':'已生成文本，请长按下方文本框全选复制';
}
document.addEventListener('DOMContentLoaded',function(){
  const wm=document.getElementById('wmask');
  if(wm)wm.onclick=hideWord;
  const wc=document.getElementById('wcls'); if(wc)wc.onclick=hideWord;
  const ws=document.getElementById('wsay');
  if(ws)ws.onclick=function(e){if(e)e.stopPropagation();if(CURW)speakWord(CURW.w);};
  const wa=document.getElementById('wadd');
  if(wa)wa.onclick=function(){
    if(!CURW)return;
    if(vHas(CURW.w)){hideWord();return;}
    VB.unshift(CURW); vSave(); vRender();
    wa.textContent='已加入'; wa.classList.add('on');
    setTimeout(hideWord,520);
  };
  const vo=document.getElementById('vopen');
  if(vo)vo.onclick=function(){vRender();document.getElementById('vsheet').classList.add('show');};
  const vc=document.getElementById('vclose');
  if(vc)vc.onclick=function(){document.getElementById('vsheet').classList.remove('show');};
  const vcl=document.getElementById('vclear');
  if(vcl)vcl.onclick=function(){
    if(!VB.length)return;
    if(confirm('确定清空 '+VB.length+' 个单词吗？清空后无法恢复。')){VB=[];vSave();vRender();document.getElementById('vta').classList.remove('show');document.getElementById('vtip').textContent='';}
  };
  const cp=document.getElementById('vcopy'); if(cp)cp.onclick=vCopy;
  vRender();
});

/* ---------- 渲染句子 ---------- */
const listBox=document.getElementById('weeks');

WEEKS.forEach((w,wi)=>{
  const sec=document.createElement('section');
  sec.dataset.wid=w.id;

  const list=document.createElement('div');
  list.className='list';
  sec.appendChild(list);

  w.sentences.forEach((sn,si0)=>{
    const gid=ALL.length;
    ALL.push({gid,w,sn,dom:null});

    const isD=(w.mode==='dialogue'||w.mode==='mixed');
    const sp=sn.spk?(spkById[sn.spk]||null):null;
    const card=document.createElement('article');
    card.className='card'+(sp?' band':'');
    if(isD&&sp){card.style.setProperty('--c',sp.color);card.style.setProperty('--c-soft',soft(sp.color));}
    else{card.style.setProperty('--c','#007AFF');card.style.setProperty('--c-soft','rgba(0,122,255,.10)');}
    card.dataset.gid=gid;
    ALL[gid].dom=card;

    const tokify=t=>t.replace(/[A-Za-z][A-Za-z'\u2019\-]*/g,m=>{
      const k=m.toLowerCase().replace(/\u2019/g,"'");
      return (sn.gloss&&sn.gloss[k])?'<i class="w" data-w="'+k+'">'+m+'</i>':m;
    });
    let enHtml;
    if(sn.segs&&sn.segs.length){
      enHtml=sn.segs.map((g,i)=>
        '<button class="segplay" data-si="'+i+'" aria-label="读这一段" title="读这一段">▶</button>'+
        '<span class="seg" data-gid="'+gid+'" data-si="'+i+'">'+tokify(g.text)+'</span>'
      ).join(' ');
    }else{ enHtml=tokify(sn.en); }

    card.innerHTML=
      (isD&&sp?'<div class="meta"><span class="badge">'+sp.name+'</span><span class="num">'+
        String(sn.idx).padStart(2,'0')+'</span></div>':'')+
      '<p class="en">'+enHtml+'</p>'+
      (sn.zh?'<p class="zh">'+sn.zh+'</p>':'')+
      '<div class="acts">'+
        '<button class="btn play"><span class="ico">▶</span>整句</button>'+
        '<button class="btn rep"><span class="ico">↻</span><span class="t">复读</span></button>'+
        (sn.gram?'<button class="btn gram">语法 <span class="cv">▼</span></button>':'')+
      '</div>'+
      (sn.gram?'<div class="gbox"><div class="ginner">'+
        '<div class="gpattern">'+sn.gram.pattern+'</div>'+
        (sn.gram.points&&sn.gram.points.length?'<ul class="gpoints">'+sn.gram.points.map(p=>'<li>'+p+'</li>').join('')+'</ul>':'')+
        (sn.gram.tags&&sn.gram.tags.length?'<div class="tags">'+sn.gram.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>':'')+
      '</div></div>':'');

    list.appendChild(card);

    card.querySelector('.btn.play').onclick=e=>{e.stopPropagation();playWhole(gid);};
    card.querySelector('.btn.rep').onclick=e=>{e.stopPropagation();toggleRepeat(gid);};
    const gb=card.querySelector('.btn.gram');
    if(gb){
      gb.onclick=e=>{
        e.stopPropagation();
        const g=card.querySelector('.gbox');
        const o=g.classList.toggle('show');
        gb.classList.toggle('open',o);
      };
    }
    const enDelegate=card.querySelector('.en');
    if(enDelegate)enDelegate.addEventListener('click',e=>{
      const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
      if(tw){e.stopPropagation();showWord(gid,tw.getAttribute('data-w'),tw.textContent);}
    });
    card.querySelectorAll('.segplay').forEach(el=>{
      el.onclick=e=>{
        e.stopPropagation();
        const s=+el.dataset.si;
        card.querySelectorAll('.segplay').forEach(x=>x.classList.remove('on'));
        el.classList.add('on');
        playSeg(gid,s);
      };
    });
    card.querySelectorAll('.seg').forEach(el=>{
      const si=+el.dataset.si;
      let holdT=null, held=false;
      el.addEventListener('pointerdown',e=>{
        held=false;
        const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
        if(tw) return;                              /* 落在单词上：只做查词，不启用长按 */
        holdT=setTimeout(()=>{held=true;playSeg(gid,si);},450);
      });
      ['pointerup','pointercancel','pointerleave'].forEach(t=>{
        el.addEventListener(t,()=>{if(holdT){clearTimeout(holdT);holdT=null;}});
      });
      el.addEventListener('click',e=>{
        const tw=e.target&&e.target.closest?e.target.closest('.w'):null;
        if(tw){e.stopPropagation();showWord(gid,tw.getAttribute('data-w'),tw.textContent);return;}
        if(held){held=false;e.stopPropagation();return;}   /* 长按已读，吞掉这次 click */
        e.stopPropagation();playSeg(gid,si);               /* 块内空白/标点：读这一段 */
      });
    });
  });

  listBox.appendChild(sec);
});

/* ---------- 筛选 ---------- */
function applyFilter(){
  const gl=groupList();
  const sel=(S.group>=0&&gl[S.group])?new Set(gl[S.group]):null;
  document.querySelectorAll('#weeks section').forEach(sec=>{
    const on=(S.filter==='all'||sec.dataset.wid===S.filter);
    let shown=0;
    sec.querySelectorAll('.card').forEach(c=>{
      const vis=on&&(!sel||sel.has(+c.dataset.gid));
      c.style.display=vis?'':'none';
      if(vis) shown++;
    });
    sec.style.display=(on&&shown)?'':'none';
  });
}
function visibleGids(){
  const out=[];
  document.querySelectorAll('#weeks section').forEach(sec=>{
    if(sec.style.display==='none') return;
    sec.querySelectorAll('.card').forEach(c=>{
      if(c.style.display!=='none') out.push(+c.dataset.gid);
    });
  });
  return out;
}

/* ---------- 播放核心 ---------- */
function voiceFor(rec){
  const sp=rec.sn.spk?(spkById[rec.sn.spk]||null):null;
  if(sp) return S.voiceOf[sp.id]||sp.voice||'f';
  if(!rec.sn.spk){
    return S.passageVoice==='rand'?(Math.random()<.5?'f':'m'):(S.passageVoice||'f');
  }
  return 'f';
}
function fileOf(rec,si,v){
  const g=(si>=0&&rec.sn.segs)?rec.sn.segs[si]:null;
  var p=(g&&g.file)?rec.w.audio+g.file+'_'+v+'.mp3':rec.w.audio+rec.sn.whole+'_'+v+'.mp3';
  return (typeof AUDIO!=='undefined'&&AUDIO[p])?AUDIO[p]:p;
}
function markPlaying(gid){
  ALL.forEach(r=>r.dom.classList.toggle('playing',r.gid===gid));
}
function resetRepeat(){
  S.repLeft=0;S.repCard=-1;S.repPrefix='复读 ';
  document.querySelectorAll('.btn.rep').forEach(b=>{
    b.classList.remove('on');
    const t=b.querySelector('.t'); if(t) t.textContent='复读';
  });
}
function setRepText(gid,txt){
  const b=ALL[gid].dom.querySelector('.btn.rep');
  if(b&&b.classList.contains('on')) b.querySelector('.t').textContent=txt;
}

function start(gid,si,repeats){
  const rec=ALL[gid];
  if(!rec) return;
  const v=voiceFor(rec);
  S.seq++; const token=S.seq;
  S.curGid=gid;
  S.repLeft=repeats;
  S.chain=[si];   /* 整句一律播整句音频；块读只播该块 */
  S.ci=0;
  S.audio.src=fileOf(rec,S.chain[0],v);
  S.audio.playbackRate=S.rate;
  markPlaying(gid);
  S.audio.play().catch(()=>{});

  const playAt=(idx)=>{
    S.ci=idx;
    S.audio.src=fileOf(rec,S.chain[idx],v);
    S.audio.playbackRate=S.rate;
    S.audio.play().catch(()=>{});
  };

  S.audio.onended=()=>{
    if(S.seq!==token) return;
    if(S.ci<S.chain.length-1){ playAt(S.ci+1); return; }
    if(S.repLeft>1){
      S.repLeft--;
      setRepText(gid,S.repPrefix+(repeats-S.repLeft+1)+'/'+repeats);
      playAt(0);
      return;
    }
    const wasRepeat=S.repCard===gid;
    resetRepeat();
    markPlaying(-1);
    if(S.allMode){
      const vis=visibleGids();
      const at=vis.indexOf(gid);
      if(at>=0&&at<vis.length-1){
        setTimeout(()=>{ if(S.allMode) start(vis[at+1],-1,0); },320);
        return;
      }
      S.allMode=false;
      document.getElementById('all').textContent='连播';
    }
  };
}

function playWhole(gid){
  if(S.curGid===gid&&!S.audio.paused){S.seq++;S.audio.pause();resetRepeat();markPlaying(-1);return;}
  resetRepeat();
  S.segGid=-1;S.segSi=-1;
  ALL[gid].dom.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));
  ALL[gid].dom.querySelectorAll('.segplay').forEach(x=>x.classList.remove('on'));
  start(gid,-1,0);
}
function playSeg(gid,si){
  resetRepeat();
  S.segGid=gid;S.segSi=si;
  const rec=ALL[gid];
  if(rec){
    rec.dom.querySelectorAll('.seg').forEach(x=>x.classList.toggle('on',+x.dataset.si===si));
    rec.dom.querySelectorAll('.segplay').forEach(x=>x.classList.toggle('on',+x.dataset.si===si));
  }
  start(gid,si,0);
}
function toggleRepeat(gid){
  const btn=ALL[gid].dom.querySelector('.btn.rep');
  if(btn.classList.contains('on')){S.seq++;S.audio.pause();resetRepeat();markPlaying(-1);return;}
  resetRepeat();
  const rec=ALL[gid];
  const hasSeg=!!(rec.sn.segs&&rec.sn.segs.length&&S.segGid===gid&&S.segSi>=0);
  btn.classList.add('on');
  S.repPrefix=hasSeg?'复读本段 ':'复读 ';
  btn.querySelector('.t').textContent=S.repPrefix+'1/'+DATA.repeatDefault;
  S.repCard=gid;
  start(gid,hasSeg?S.segSi:-1,DATA.repeatDefault);
  S.repCard=gid;
}
function stopAll(){
  S.seq++;S.audio.pause();resetRepeat();markPlaying(-1);
  S.allMode=false;
  document.getElementById('all').textContent='连播';
}

/* ---------- 底部栏 ---------- */
document.getElementById('prev').onclick=()=>{
  const vis=visibleGids(); if(!vis.length) return;
  const at=vis.indexOf(S.curGid);
  const t=vis[at<=0?0:at-1];
  stopAll(); start(t,-1,0);
};
document.getElementById('next').onclick=()=>{
  const vis=visibleGids(); if(!vis.length) return;
  const at=vis.indexOf(S.curGid);
  const t=vis[(at<0||at>=vis.length-1)?vis.length-1:at+1];
  stopAll(); start(t,-1,0);
};
document.getElementById('all').onclick=e=>{
  if(S.allMode){stopAll();return;}
  const vis=visibleGids(); if(!vis.length) return;
  stopAll();
  S.allMode=true;
  e.currentTarget.textContent='停止';
  start(vis[0],-1,0);
};
document.getElementById('rate').onclick=e=>{
  const o=[1.0,0.9,0.75];
  S.rate=o[(o.indexOf(S.rate)+1)%o.length];
  e.currentTarget.textContent=S.rate.toFixed(2).replace(/0$/,'')+'×';
  S.audio.playbackRate=S.rate;
};

/* ---------- 启动 ---------- */
renderVoiceBar();
renderWeekBar();
renderGroupBar();
applyFilter();
</script>
