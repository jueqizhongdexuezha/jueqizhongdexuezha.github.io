<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>背单词 · 混排四选一测试版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#f4f5f7;color:#1b1e22;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
overflow-x:hidden;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#f4f5f7}
/* 手机地址栏收放不跳：支持 dvh 的浏览器用真实可视高度，不支持则沿用上面的 100vh */
#app{min-height:100dvh}
#bar{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;background:rgba(244,245,247,.94);
  border-bottom:1px solid #e6e9ed;
}
/* 刘海/状态栏不吃掉标题：补充顶部安全区 */
#bar{padding-top:calc(14px + env(safe-area-inset-top))}
#wordIndex{font-size:14px;font-weight:700;color:#41474e;letter-spacing:.4px}
.tools{display:flex;gap:8px}
.tools button{
  position:relative;
  font-size:12px;color:#5c636c;background:#fff;border:1px solid #dfe3e8;
  border-radius:9px;padding:9px 12px;min-height:38px;font-family:inherit;
}
#stage{flex:1;padding:4px 18px 44px;display:flex;flex-direction:column}
/* 全面屏底部横条不吃掉按钮：补充安全区留白 */
#stage{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.kicker{font-size:12.5px;color:#8b929b;letter-spacing:.6px;margin:16px 0 2px}
.sentence{
  font-size:23px;line-height:1.72;font-weight:600;color:#14171a;
  padding:14px 0 6px;word-break:break-word;
}
.sentence b{color:#0b57d0;font-weight:800;border-bottom:3px solid #cfdcf7;padding-bottom:1px}
.headline{
  font-size:26px;line-height:1.5;font-weight:800;letter-spacing:1.4px;
  color:#14171a;padding:20px 0 14px;
}
.ask{font-size:15px;color:#5c636c;line-height:1.68;margin:16px 0 10px}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:4px}
button.choice{
  display:block;width:100%;text-align:left;
  font-family:inherit;font-size:17px;line-height:1.55;color:#1b1e22;
  background:#fff;border:1.5px solid #e3e6ea;border-radius:15px;
  padding:16px 18px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
button.choice:active{background:#f2f4f7}
button.choice:disabled{opacity:.55}
button.choice.good{border-color:#2f7d4f;background:#f2f9f4;opacity:1}
button.choice.info{border-color:#3c6ea5;background:#f3f7fc;opacity:1}
.feedback{font-size:17.5px;font-weight:700;color:#14171a;margin:22px 0 0}
.anscard{
  margin-top:11px;background:#fff;border:1.5px solid #e3e6ea;border-radius:15px;
  padding:16px 18px;
}
.anscard .mean{font-size:16px;line-height:1.7;color:#1b1e22}
.anscard .mean b{color:#0b57d0;font-weight:800}
button.primary{
  display:block;width:100%;margin-top:26px;
  font-family:inherit;font-size:17px;font-weight:700;color:#fff;
  background:#14171a;border:0;border-radius:15px;padding:17px 18px;cursor:pointer;
}
button.primary:active{background:#000}
.helperbox{
  margin-top:8px;border:1.5px dashed #d3d8de;background:#fbfcfd;border-radius:15px;
  padding:22px 18px;font-size:15px;line-height:1.7;color:#7b828b;text-align:center;
}
#poolLine{
  padding:0 18px 10px;background:rgba(244,245,247,.94);
  font-size:12.5px;color:#7b828b;letter-spacing:.3px;
  border-bottom:1px solid #e6e9ed;
}
.tools button.on{color:#fff;background:#14171a;border-color:#14171a;font-weight:700}
.helperline{
  margin-top:12px;background:#f3f7fc;border:1.5px solid #dbe6f5;border-radius:15px;
  padding:13px 16px;
}
.helperline .hl-tag{font-size:11.5px;font-weight:700;color:#3c6ea5;letter-spacing:1px;margin-bottom:5px}
.helperline .hl-text{font-size:15px;line-height:1.72;color:#1b1e22}
.helperline .hl-text b{color:#0b57d0;font-weight:800}
.statrow{display:flex;gap:9px;margin:14px 0 4px}
.statrow .stat{
  flex:1;background:#fff;border:1.5px solid #e3e6ea;border-radius:14px;
  padding:13px 8px;text-align:center;
}
.statrow .stat .num{font-size:21px;font-weight:800;color:#14171a;line-height:1.3}
.statrow .stat .lab{font-size:12px;color:#7b828b;margin-top:3px}
.poolrow{
  display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e9ecf0;
  border-radius:13px;padding:11px 14px;margin-top:9px;
}
.poolrow .pw{font-size:16px;font-weight:700;color:#14171a;min-width:88px}
.poolrow .pm{flex:1;font-size:13px;color:#7b828b;line-height:1.5}
.poolrow .ps{font-size:12px;color:#3c6ea5;background:#f3f7fc;border-radius:8px;padding:3px 8px}
.poolrow .ps.relearn{color:#a2552f;background:#fdf3ec}
.poolrow .ps.upgrading{color:#7d6a1f;background:#fbf7e8}
.wlText{
  width:100%;height:150px;resize:vertical;
  font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;
  color:#2a2f35;background:#fff;border:1.5px solid #e3e6ea;border-radius:13px;
  padding:12px 14px;
}
.rowline{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.rowline button{
  flex:1;min-width:104px;font-family:inherit;font-size:13.5px;color:#41474e;background:#fff;
  border:1.5px solid #dfe3e8;border-radius:12px;padding:11px 10px;
}
.rowline button.main{color:#fff;background:#14171a;border-color:#14171a;font-weight:700}
.wordrow, .poolwordrow{
  display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #e9ecf0;
  border-radius:13px;padding:11px 13px;margin-top:9px;
}
.wordrow .ww, .poolwordrow .ww{font-size:16px;font-weight:700;color:#14171a}
.wordrow .wm, .poolwordrow .wm{flex:1;font-size:12.5px;color:#7b828b;line-height:1.5;word-break:break-word}
.wordrow .seg{display:flex;gap:6px}
.wordrow .seg button{
  font-family:inherit;font-size:12.5px;color:#5c636c;background:#f7f8fa;
  border:1px solid #dfe3e8;border-radius:9px;padding:9px 11px;min-height:36px;
  touch-action:manipulation;
}
.wordrow .seg button.pick{color:#fff;background:#3c6ea5;border-color:#3c6ea5;font-weight:700}
.wordrow .ps, .poolwordrow .ps{font-size:11.5px;color:#3c6ea5;background:#f3f7fc;border-radius:8px;padding:2px 7px;margin-right:6px}
.wordrow .ps.relearn, .poolwordrow .ps.relearn{color:#a2552f;background:#fdf3ec}
.wordrow .ps.upgrading, .poolwordrow .ps.upgrading{color:#7d6a1f;background:#fbf7e8}
#ioPanel{
  border-top:1px solid #e6e9ed;background:#fff;padding:14px 18px 22px;
}
#ioText{
  width:100%;height:132px;resize:vertical;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;
  color:#2a2f35;background:#f7f8fa;border:1px solid #e3e6ea;border-radius:11px;
  padding:10px 12px;
}
#ioPanel .row{display:flex;gap:9px;margin-top:10px}
#ioPanel .row button{
  flex:1;font-family:inherit;font-size:13px;color:#41474e;background:#fff;
  border:1px solid #dfe3e8;border-radius:11px;padding:11px 8px;
}
#ioPanel .row button.main{color:#fff;background:#14171a;border-color:#14171a;font-weight:700}
#ioTip{font-size:12.5px;color:#7b828b;line-height:1.6;margin-top:9px;min-height:16px}
.tools button.on{position:relative;padding-right:16px}
.badge{
  position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;line-height:18px;
  border-radius:9px;background:#c0392b;color:#fff;font-size:11px;font-weight:800;
  text-align:center;padding:0 4px;
}
.kicker2{font-size:12px;color:#9aa1a9;letter-spacing:.4px;margin:2px 0 0}
.wordbig{font-size:34px;font-weight:800;letter-spacing:.5px;color:#14171a;padding:18px 0 2px;word-break:break-all}
.wordpos{font-size:13px;color:#8b929b;margin-bottom:6px}
.meaningbox{
  margin-top:14px;background:#f3f7fc;border:1.5px solid #dbe6f5;border-radius:15px;
  padding:18px;font-size:20px;line-height:1.6;font-weight:700;color:#1b1e22;
}
button.bait{
  display:inline-block;margin-top:14px;font-family:inherit;font-size:13px;font-weight:700;
  color:#8a5a00;background:#fff8e6;border:1.5px dashed #e8c56a;border-radius:11px;
  padding:9px 13px;cursor:pointer;
}
button.bait:active{background:#fdf1d6}
.baitbox{
  margin-top:9px;background:#fffdf5;border:1.5px solid #f0e2b8;border-radius:13px;
  padding:12px 15px;
}
.baitbox .baitword{font-size:16px;font-weight:800;color:#14171a}
.baitbox .baitmeta{font-size:12.5px;color:#8a5a00;margin-top:4px}
.notebox{margin-top:14px;border-top:1px solid #eef0f3;padding-top:12px}
.noterow{margin-top:10px}
.noterow .ntext{font-size:14.5px;font-weight:700;color:#41474e}
.noterow .nwhy{font-size:13.5px;line-height:1.66;color:#5c636c;margin-top:2px}
.noterow .nspan{font-size:12.5px;line-height:1.6;color:#3c6ea5;margin-top:2px}
.submean{font-size:13.5px;line-height:1.7;color:#5c636c;margin-top:10px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:26px}
.dots .dot{width:7px;height:7px;border-radius:50%;background:#dadee3}
.dots .dot.on{background:#14171a}


/* ---------- 方法入口：每屏一键看记法 ---------- */
.methodbtn { margin: 8px 0 2px; padding: 7px 12px; border-radius: 10px; border: 1px dashed #b9c6d4; background: #fff; color: #35485c; font-size: 13px; }
.methodbox { border: 1px solid #dfe6ee; border-radius: 12px; padding: 10px 12px; background: #fbfcfe; margin: 6px 0 10px; }
.methodbox .mline { font-size: 13px; line-height: 1.75; color: #2f3a46; }
.methodbox .mline + .mline { margin-top: 6px; }
.methodbox .mline b { color: #2b6cb0; }
.methodbox .drilljump { margin-top: 8px; padding: 6px 10px; border-radius: 10px; border: 1px solid #cbd8e6; background: #fff; color: #2b4a68; font-size: 12px; }
/* ---------- 锚点：句子里真正承载这个词的那一段 ---------- */
.sentence b.anchor { background: #ffe9a8; border-bottom: 2px solid #e0ac2b; padding: 0 2px; border-radius: 4px; color: #1f3550; }
.exline { margin-top: 8px; font-size: 13px; color: #33414f; line-height: 1.75; }
.exline b.anchor { background: #eaf4ff; border-bottom: 2px solid #7fb0dd; padding: 0 2px; border-radius: 4px; }
/* ---------- 直背通道 ---------- */
.drillrow { display: flex; align-items: center; gap: 10px; padding: 12px 0 4px; }
.drillhint { font-size: 12px; color: #7b8a99; }
.drillstep { font-size: 12px; color: #7b8a99; }
.drillmean { border: 1px solid #dfe6ee; border-radius: 12px; padding: 12px; background: #fbfcfe; font-size: 15px; line-height: 1.7; color: #22303d; }
.drillmean.hold { color: #7b8a99; }
.drillbtn { margin-left: auto; padding: 4px 10px; border-radius: 8px; border: 1px solid #cfd9e3; background: #fff; color: #35485c; font-size: 12px; }
/* ---------- 已确认功能清单 ---------- */
.flist { border-top: 1px dashed #dfe6ee; margin-top: 14px; padding-top: 10px; }
.flist .frow { font-size: 12px; color: #5b6a79; line-height: 1.8; }
/* 直背 5 模式切换条 / 清单可点条目 / 记法提示行 */
.dmodebar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.dmode{padding:8px 12px;border:1px solid #d8dde8;background:#fbfcfe;border-radius:10px;font-size:14px;color:#2b3448;cursor:pointer}
.dmode.on{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
.dmodehint{font-size:13px;color:#5b6577;margin-bottom:10px;line-height:1.7}
.drillstem{font-size:20px;line-height:1.6;margin:8px 0}
.dopts{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
.dopt{text-align:left;padding:12px;border:1px solid #d8dde8;background:#fff;border-radius:10px;font-size:15px;cursor:pointer}
.dopt.on{border-color:#1f6feb;background:#eef4ff;font-weight:600}
.drillreveal{margin:10px 0;padding:10px 12px;background:#f4f7fd;border-left:3px solid #1f6feb;border-radius:8px;font-size:14px;line-height:1.7}
.drillinput{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8dde8;border-radius:10px;font-size:16px;letter-spacing:2px}
.fbody{margin:6px 0 12px;padding:10px 12px;background:#f7f9fd;border-radius:10px}
.fat,.fhow{font-size:13px;color:#4a5468;line-height:1.7;margin:2px 0}
.fopen{width:100%;text-align:left;padding:10px 12px;border:1px solid #e2e7f0;background:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.fgo{margin-top:8px;padding:8px 14px;border:1px solid #1f6feb;background:#1f6feb;color:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.mhint{font-size:13px;color:#1f6feb;margin:6px 0 2px;line-height:1.6}
.methodbtn.on{background:#eef4ff;border-color:#1f6feb;color:#1f6feb;font-weight:600}
/* 选词页：一屏一屏勾词，行里都是人话 */
.picklist{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.pickrow{display:flex;align-items:flex-start;gap:10px;width:100%;box-sizing:border-box;text-align:left;padding:10px 12px;border:1px solid #e2e7f0;background:#fff;border-radius:10px;cursor:pointer}
.pickrow.on{border-color:#1f6feb;background:#eef4ff}
.pickbox{width:18px;height:18px;flex:0 0 18px;border:1px solid #b9c2d4;border-radius:5px;text-align:center;font-size:13px;line-height:18px;color:#fff;margin-top:2px}
.pickrow.on .pickbox{background:#1f6feb;border-color:#1f6feb}
.pickword{font-size:16px;font-weight:700;color:#14171a}
.pickmean{font-size:13px;color:#4a5468;line-height:1.6;margin-top:2px}
.picksec{font-size:13px;color:#4a5468;margin:14px 0 2px}
.picksum{font-size:14px;color:#14171a;margin:10px 0 2px;line-height:1.7}
.pickhint{font-size:13px;color:#4a5468;line-height:1.7;margin:6px 0}
.pickline{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pickbtn{padding:9px 14px;border:1px solid #d8dde8;background:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.pickbtn.on{border-color:#1f6feb;background:#eef4ff;color:#1f6feb;font-weight:600}
.quipline{font-size:17px;font-weight:700;color:#0b57d0;margin:6px 0 0;line-height:1.6}
.foldbtn{display:block;margin:12px 0 0;padding:6px 12px;font-size:13.5px;color:#5f6368;background:#fff;border:1px solid #dadce0;border-radius:999px;cursor:pointer}
.foldbtn.on{color:#0b57d0;border-color:#c6dafc;background:#f1f6ff}
.pickmid{flex:1 1 auto;min-width:0}
.pickkind{font-size:12px;color:#8a93a6;margin-top:2px}
.picktag{flex:0 0 auto;font-size:12px;padding:2px 8px;border-radius:999px;background:#f0f2f7;color:#4a5468;margin-top:2px}
.picktag.tag-可用{background:#e8f4ec;color:#1a6b3c}
.picktag.tag-待确认{background:#fdf3e3;color:#8a5a00}
.picktag.tag-需回炉{background:#fdeceb;color:#a3282a}
.picknote{font-size:12px;color:#8a93a6;line-height:1.6;margin:2px 0 0}
button[disabled]{opacity:.5;cursor:default}
.foldbtn{margin-top:10px;padding:8px 12px;border:1px solid #e2e7f0;background:#fff;border-radius:10px;font-size:13px;color:#4a5468;cursor:pointer}
.foldwrap{margin-top:8px}
/* 第二段：答偏那一屏三块（差在哪 / 挂个旧词 / 一句情绪价值）、放大的意思行、别的选项折起来 */
.meanbig{font-size:21px;font-weight:700;color:#2b3346;line-height:1.5;margin:6px 0 4px}
.whybox2{margin-top:12px;border-left:3px solid #e8c26a;background:#fffdf6;border-radius:0 12px 12px 0;padding:10px 12px}
.wlab{font-size:13px;font-weight:700;color:#8a6a1f;margin-bottom:4px}
.wtxt{font-size:14px;color:#414a5c;line-height:1.7}
.wspan{font-size:13px;color:#6b7a90;line-height:1.6;margin-top:4px}
.oldbox{margin-top:10px;border-left:3px solid #9fc0e8;background:#f7fbff;border-radius:0 12px 12px 0;padding:10px 12px}
.oldlab{font-size:13px;font-weight:700;color:#2f6ea8;margin-bottom:4px}
.oldtxt{font-size:14px;color:#414a5c;line-height:1.7}
.kindly{margin-top:12px;font-size:15px;color:#3d4757;line-height:1.7}
.hitline{font-size:16px;font-weight:700;color:#2b3346;line-height:1.6;margin:4px 0 2px}
.othersbtn{margin-top:10px;padding:8px 12px;border:1px dashed #d8dfec;background:#fff;border-radius:10px;font-size:13px;color:#5a6478;cursor:pointer}
.corelist{margin-top:12px}
.corerow{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid #eceff5;border-radius:10px;margin-top:6px;background:#fff}
.coreword{font-size:15px;font-weight:700;color:#2b3346}
.corestate{font-size:13px;color:#5a6478;line-height:1.6}
#backupRow{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
#backupRow[hidden]{display:none}
#btnFeatureBack{font-size:13px;font-weight:700;color:#3c6ea5;background:#eef3fa;border:1px solid #cddcf0;border-radius:10px;padding:6px 10px;cursor:pointer;margin-right:6px}
#btnFeatureBack[hidden]{display:none}

/* ---------- 手机端兜底：窄屏字号收一档、按钮热区够手指 ---------- */
@media (max-width:360px){
  #stage{padding-left:14px;padding-right:14px}
  .sentence{font-size:20px;line-height:1.66}
  .meanbig{font-size:19px}
  .meaningbox{font-size:18px;padding:15px}
  .wordbig{font-size:28px}
  .drillstem{font-size:18px}
  .feedback{font-size:16px}
  button.choice{font-size:16.5px;padding:15px 16px}
  button.primary{font-size:16.5px;padding:16px}
}
/* 藏起来的按钮不占地方：「一次弄完」按需要露头 */
button[hidden]{display:none!important}
/* 手机上点一下就点一下，不留悬停残影 */
@media (hover:none){
  button.choice:hover{background:#fff}
  button.primary:hover{background:#14171a}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="wordIndex">第 1/10 局 · 屏 1/5</span>
    <span class="tools">
      <button id="btnFeatureBack" hidden>← 回功能清单</button>
      <button id="btnHome">帮手区</button>
    </span>
  </div>
  <div id="poolLine">旧词池 · 今天要带回</div>
  <div id="stage"></div>
  <div id="backupRow" hidden>
    <button id="btnBackup">备份进度</button>
    <button id="btnRestore">从备份接着做</button>
  </div>
  <div id="ioPanel" hidden>
    <textarea id="ioText" placeholder="备份出来的那一段会出现在这里；要把进度接回来，就把那一段粘进框里"></textarea>
    <div class="row">
      <button id="ioCopy">复制这一段</button>
      <button id="ioDoImport" class="main">读入这段备份</button>
      <button id="ioClear">清空进度</button>
      <button id="ioClose">收起</button>
    </div>
    <div id="ioTip"></div>
  </div>
</div>
<script>
(function(){
"use strict";

/*PURE-START*/
var STORAGE_KEY = "vocab_proto_single_v1";
var DATA = {

/* ---------- 流程：50 屏 / 10 局，每局 5 屏（一局一次换气） ---------- */
var ROUND_SIZE = 5;
var SCREENS = ["PICK", "Q", "ROUND", "HELPER", "HOME", "WORDS", "DRILL"];

/* 静态 50 屏是底子；上传词表后新排的题接在后面（tail），整份流程 = 底子 + 后来接上的 */
function baseFlow(state){ return (state && state.data && state.data.flow) || []; }
function tailOf(state){
  var p = (state && state.progress) || {};
  return Array.isArray(p.tail) ? p.tail : [];
}
function tailFromOf(state){
  var p = (state && state.progress) || {};
  var v = p.tailFrom;
  return (typeof v === "number" && v >= 0 && v <= 100000) ? v : null;
}

function flowList(state){
  /* 一局一局打：这一局自己那份 5 屏流程（选词出来的）优先，打完再回选词页 */
  var sess = sessOf(state);
  if(sess){ return sess.flow; }
  var base = baseFlow(state);
  var tail = tailOf(state);
  var out;
  if(!tail.length){
    out = base;
  } else {
    var from = tailFromOf(state);
    if(from == null || from > base.length) from = base.length;
    out = base.slice(0, from).concat(tail);
  }
  for(var i = 0; i < out.length; i++){ if(out[i] && out[i].seq !== i + 1) out[i].seq = i + 1; }
  return out;
}

/* 第几局由位置直接推出来：后面接上的屏插在中间，局号也不会错位 */
function roundAtIndex(i){
  var n = (typeof i === "number" && i >= 0) ? i : 0;
  return Math.floor(n / ROUND_SIZE) + 1;
}

/* 屏上的 seq 从 1 起算，位置从 0 起算，这里统一换算 */
function roundOfSeq(s){
  var n = Number(s);
  if(!(n >= 1)) n = 1;
  return roundAtIndex(n - 1);
}

function roundCount(state){
  var len = flowList(state).length;
  return len ? roundAtIndex(len - 1) : 0;
}

/* 当前屏（0 基下标对 flow 数组） */
function screenAt(state){
  var f = flowList(state), i = state.progress.seq || 0;
  if(i < 0) i = 0;
  if(i > f.length - 1) i = f.length - 1;
  return f[i] || null;
}

function screenAtSeq(state, seq){
  var f = flowList(state);
  return f[seq] || null;
}

function roundItems(state, roundNo){
  return flowList(state).filter(function(x){ return roundOfSeq(x.seq) === roundNo; });
}

function screenNoInRound(item){
  return item ? (((Number(item.seq) || 1) - 1) % ROUND_SIZE) + 1 : 0;
}

function wordQuizOf(data, wid){
  var list = (data && data.word_quiz) || [];
  for(var i = 0; i < list.length; i++){ if(list[i].word_id === wid) return list[i]; }
  return null;
}

function wordOf(data, wid){
  var list = (data && data.words) || [];
  for(var i = 0; i < list.length; i++){ if(list[i].id === wid) return list[i]; }
  return null;
}

function sentenceOf(data, sid){
  var list = (data && data.sentences) || [];
  for(var i = 0; i < list.length; i++){ if(list[i].id === sid) return list[i]; }
  return null;
}

/* 一屏的题面：句子 / 单词 / 汉语反查 三种形式，题面统一带 choices+correct+notes */
function faceAt(state, item){
  if(!item) return null;
  /* 上传词表出的题：没有句子，题面和四个选项按词表当场搭出来 */
  if(item.kind === "pool"){
    var pe = poolFind(state, item.pool_word);
    if(!pe) return null;
    var pq = buildPoolQuiz(state, pe, poolQuizBatchOf(state, item));
    if(!pq) return null;
    var pk = (item.form === "zh") ? pq.form_zh : pq.form_word;
    return { form: item.form, quiz: pq, word: null, pool: pe,
             choices: pk.choices, correct: pk.correct_index, notes: pk.notes };
  }
  var w = wordOf(state.data, item.word_id);
  if(item.form === "sentence"){
    var s = sentenceOf(state.data, item.sentence_id);
    var op = optionIn(state.data, item.sentence_id);
    if(!s || !op) return null;
    /* D3：句子题过一道旧词当干扰项，其它形式一律原样返回 */
    return d3FaceOf(state, item, { form: "sentence", sentence: s, option: op, word: w,
             choices: op.choices, correct: op.correct_index, notes: op.notes });
  }
  var q = wordQuizOf(state.data, item.word_id);
  if(!q) return null;
  if(item.form === "word"){
    return { form: "word", quiz: q, word: w,
             choices: q.form_word.choices, correct: q.form_word.correct_index, notes: q.form_word.notes };
  }
  return { form: "zh", quiz: q, word: w,
           choices: q.form_zh.choices, correct: q.form_zh.correct_index, notes: q.form_zh.notes };
}

/* ================= D3：旧词进四选一的错项 =================
   只在渲染时算出来的题面上换一条文本和它的错因，DATA / progress / 三态一律不碰
   v2 口径：① 换上去的旧词必须在这句英文里真出现过（含词形变化），不许从池子里乱补；
            ② 选项文本用清理过的释义，不搬池子里的语法注；③ 没有合格旧词就不换，不硬凑 */
var D3_REASON = { relearn: "relearn 态", none: "句中无可用旧词", thin: "清理后释义不足两字" };

/* 两段汉语之间最长的连续相同汉字：用来挡「两个选项读起来都像」的争议题 */
function d3HanziRun(a, b){
  var x = String(a == null ? "" : a).replace(/[^\u4e00-\u9fff]/g, "");
  var y = String(b == null ? "" : b).replace(/[^\u4e00-\u9fff]/g, "");
  var best = 0, i, j, k;
  for(i = 0; i < x.length; i++){
    for(j = 0; j < y.length; j++){
      k = 0;
      while(i + k < x.length && j + k < y.length && x.charAt(i + k) === y.charAt(j + k)) k++;
      if(k > best) best = k;
    }
  }
  return best;
}

function d3HanziCount(s){
  return String(s == null ? "" : s).replace(/[^\u4e00-\u9fff]/g, "").length;
}

/* 定序用：同一个 mid 配同一个旧词，每次算出来的数一样 */
function d3Hash(s){
  var t = String(s == null ? "" : s), h = 0;
  for(var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 1000003;
  return h;
}

/* 词形归一：去掉 s / es / ed / ing / ly / d 这类尾巴，双写的辅音还原一位
   starts→start、insists→insist、heard→hear、hearing→hear、running→run、doubted→doubt */
function d3Stem(w){
  var s = String(w == null ? "" : w).toLowerCase().replace(/[^a-z']/g, "");
  var sufs = ["s", "es", "ed", "ing", "ly", "d"], i, suf;
  for(i = 0; i < sufs.length; i++){
    suf = sufs[i];
    if(s.length - suf.length >= 3 && s.slice(s.length - suf.length) === suf){
      s = s.slice(0, s.length - suf.length);
      break;
    }
  }
  if(s.length >= 4 && s.charAt(s.length - 1) === s.charAt(s.length - 2)) s = s.slice(0, s.length - 1);
  return s;
}

/* 这个旧词在这句英文里真的出现过吗：整词相同，或者只是词形变了（insists / heard 这类）
   这是 v2 的硬前提：句中没出现过的词，一律不许拿来当干扰项 */
function d3InSentence(text, word){
  var w = String(word == null ? "" : word).toLowerCase().replace(/[^a-z']/g, "");
  if(!w) return false;
  var toks = String(text == null ? "" : text).toLowerCase().match(/[a-z']+/g) || [];
  var sw = d3Stem(w), i;
  for(i = 0; i < toks.length; i++){
    if(toks[i] === w) return true;
    if(sw && d3Stem(toks[i]) === sw) return true;
  }
  return false;
}

/* 池子里的释义带语法注，先清理成「像选项」的中文；清不干净就返回空串（这题不换）
   1 去括号内容 → 2 去英文原词与「的过去式」一类说明 → 3 去省略号
   → 4 按分号/逗号切段，逐段清理，跳过语法注段，取第一个「纯中文且不少于两字」的段
   → 5 一段都凑不出两字就返回空串，交给闸门记下「清理后释义不足两字」 */
function d3CleanMeaning(raw){
  var s = String(raw == null ? "" : raw);
  s = s.replace(/（[^（）]*）/g, "").replace(/\([^()]*\)/g, "");
  s = s.replace(/[A-Za-z][A-Za-z'\-\.]*/g, "");
  s = s.replace(/的(过去式|过去分词|现在分词|第三人称单数|复数|单数|一般现在时|一般过去时|比较级|最高级|名词|动词|形容词|副词|原形)/g, "");
  s = s.replace(/加\s*-?\s*(ing|ed|es|s|d)/gi, "");
  s = s.replace(/…|\.{2,}/g, "");
  var GRAM = /动词|原形|过去式|过去分词|现在分词|第三人称|单数|复数|名词|形容词|副词|时态|一般现在|加/;
  var segs = s.split(/[；;，,／\/、|]+/), i, t, pick = "";
  for(i = 0; i < segs.length; i++){
    t = String(segs[i]).replace(/^[\s。:：·\-—_]+/, "").replace(/[\s。:：·\-—_]+$/, "").replace(/\s+/g, "");
    if(!t) continue;
    if(GRAM.test(t)) continue;
    if(/[A-Za-z（）()…]/.test(t)) continue;
    if(d3HanziCount(t) >= 2){ pick = t; break; }
  }
  return pick;
}

/* 这句在 helpers 里本来就挂着的旧词（按句号认，不按新词认） */
function d3HelperOldWord(data, sid){
  var list = (data && data.helpers) || [];
  for(var i = 0; i < list.length; i++){
    if(list[i] && list[i].sentence_id === sid && String(list[i].old_word || "").trim()) return String(list[i].old_word);
  }
  return "";
}

/* 槽位：从不是答案的那三格里挑一格，同 mid + 同旧词固定落同一格 */
function d3SlotOf(mid, oldWord, correct, len){
  var idx = [], i, n = (typeof len === "number" && len > 0) ? len : 4;
  for(i = 0; i < n; i++){ if(i !== correct) idx.push(i); }
  if(!idx.length) return -1;
  var h = d3Hash(String(mid == null ? "" : mid) + "|" + String(oldWord == null ? "" : oldWord).toLowerCase());
  return idx[h % idx.length];
}

/* 候选旧词：先看 helpers 挂的那个，再补池子里「本句真出现过」的其它词；同一个词只出现一次
   v1 那种「从池子里挑个不在句中的词补位」的做法在 v2 里已经删掉 */
function d3Candidates(state, item){
  var out = [], seen = {}, i, w;
  var s = sentenceOf(state.data, item.sentence_id);
  var text = s ? String(s.text || "") : "";
  var hw = d3HelperOldWord(state.data, item.sentence_id);
  if(hw){ seen[hw.toLowerCase()] = 1; out.push({ word: hw, from: "helper" }); }
  var list = [], all = poolItems(state);
  for(i = 0; i < all.length; i++){
    w = String(all[i].word == null ? "" : all[i].word);
    if(!w.trim()) continue;
    if(seen[w.toLowerCase()]) continue;
    if(!d3InSentence(text, w)) continue;
    list.push(all[i]);
  }
  list.sort(function(a, b){
    var ha = d3Hash(String(item.mid == null ? "" : item.mid) + "|" + String(a.word == null ? "" : a.word).toLowerCase());
    var hb = d3Hash(String(item.mid == null ? "" : item.mid) + "|" + String(b.word == null ? "" : b.word).toLowerCase());
    if(ha !== hb) return ha - hb;
    return String(a.word) < String(b.word) ? -1 : (String(a.word) > String(b.word) ? 1 : 0);
  });
  for(i = 0; i < list.length; i++){
    w = String(list[i].word == null ? "" : list[i].word);
    if(seen[w.toLowerCase()]) continue;
    seen[w.toLowerCase()] = 1;
    out.push({ word: w, from: "pool" });
  }
  return out;
}

/* 硬闸门：过了返回 { code: "", detail: "" }；没过返回原因码（只允许 D3_REASON 里那三种）+ 明细
   明细只写给人看，原因码给断言用，避免出现「原因不明」 */
function d3Gate(state, oldWord, newWord, face, slot){
  var e = poolFind(state, oldWord);
  if(!e) return { code: D3_REASON.none, detail: "旧词不在旧词池里" };
  if(e.state === "relearn") return { code: D3_REASON.relearn, detail: "旧词在回炉队列" };
  var text = (face && face.sentence) ? String(face.sentence.text || "") : "";
  if(!d3InSentence(text, oldWord)) return { code: D3_REASON.none, detail: "这句英文里没有「" + oldWord + "」" };
  var meaning = d3CleanMeaning(e.meaning);
  if(!meaning) return { code: D3_REASON.thin, detail: "清理后释义不足两个汉字（原：" + String(e.meaning == null ? "" : e.meaning) + "）" };
  if(String(oldWord).toLowerCase() === String(newWord).toLowerCase()) return { code: D3_REASON.none, detail: "旧词就是这个新词" };
  var i;
  for(i = 0; i < face.choices.length; i++){
    if(i === slot) continue;
    if(String(face.choices[i] == null ? "" : face.choices[i]).trim() === meaning) return { code: D3_REASON.none, detail: "与已有选项重复" };
  }
  var run = d3HanziRun(meaning, face.choices[face.correct]);
  if(run >= 3) return { code: D3_REASON.none, detail: "与答案项有 " + run + " 个连续汉字相同" };
  var notes = face.notes || [];
  if(!notes[slot]) return { code: D3_REASON.none, detail: "该位置原本没有错因" };
  return { code: "", detail: "" };
}

/* 兼容口子：只看原因码（空串=全过） */
function d3GateReason(state, oldWord, newWord, face, slot){
  return d3Gate(state, oldWord, newWord, face, slot).code;
}

/* 真换：只改被选中的那一格文本和它的错因，其余三格一字不动 */
function d3Rebuild(face, oldWord, slot, newWord, entry, tried, trials){
  var meaning = d3CleanMeaning(entry.meaning);
  var choices = face.choices.slice();
  var notes = (face.notes || []).slice();
  choices[slot] = meaning;
  notes[slot] = { span: String(oldWord),
                  why_wrong: "这是你学过的「" + oldWord + "」的意思（" + meaning + "）。选了它，等于把这句里的 " + newWord + " 当成 " + oldWord + " 了。",
                  misread_type: "把新词当成旧词", old_word: String(oldWord), old_word_meaning: meaning };
  return { form: face.form, sentence: face.sentence, option: face.option, word: face.word,
           choices: choices, correct: face.correct, notes: notes,
           d3: { replaced: true, old_word: String(oldWord), slot: slot, reason: "", detail: "",
                 meaning: meaning, tried: tried || 1, trials: trials || [] } };
}

/* 唯一入口：句子题才改，词题 / 汉语反查题 / 上传词表的题一律原样返回 */
function d3FaceOf(state, item, face){
  if(!face || face.form !== "sentence" || !item || item.form !== "sentence" || item.kind === "pool") return face;
  if(!state || !state.data) return face;
  var w = wordOf(state.data, item.word_id);
  var newWord = w ? String(w.spelling || "") : "";
  var cands = d3Candidates(state, item), i, slot, g, e, tried = 0, trials = [];
  var helperCode = "", helperDetail = "", anyThin = "", anyNone = "";
  for(i = 0; i < cands.length; i++){
    slot = d3SlotOf(item.mid, cands[i].word, face.correct, face.choices ? face.choices.length : 4);
    if(slot < 0) break;
    g = d3Gate(state, cands[i].word, newWord, face, slot);
    e = poolFind(state, cands[i].word);
    tried += 1;
    trials.push({ word: String(cands[i].word), from: cands[i].from, slot: slot, code: g.code, detail: g.detail });
    if(cands[i].from === "helper" && !helperCode){ helperCode = g.code; helperDetail = g.detail; }
    if(g.code === D3_REASON.thin && !anyThin) anyThin = g.detail;
    if(g.code === D3_REASON.none && !anyNone) anyNone = g.detail;
    if(g.code) continue;
    return d3Rebuild(face, cands[i].word, slot, newWord, e, tried, trials);
  }
  var code = helperCode || anyThin || anyNone || D3_REASON.none;
  var detail = helperDetail || anyThin || anyNone || "这句英文里没有可用的旧词";
  face.d3 = { replaced: false, old_word: "", slot: -1, reason: code, detail: detail,
              meaning: "", tried: tried, trials: trials };
  return face;
}

/* 给校验脚本用：30 句逐句交代「换了 / 没换 + 原因码 + 卡在哪条闸门」 */
function d3Audit(state){
  var ops = (state.data && state.data.options) || [];
  var out = [], i;
  for(i = 0; i < ops.length; i++){
    var op = ops[i];
    var s = sentenceOf(state.data, op.sentence_id);
    if(!s) continue;
    var item = { mid: "S" + op.sentence_id, form: "sentence", kind: "core",
                 sentence_id: op.sentence_id, word_id: s.word_id, seq: -1 };
    var face = faceAt(state, item);
    var d = (face && face.d3) || { replaced: false, old_word: "", slot: -1, reason: "句中无可用旧词", detail: "题面取不到", trials: [] };
    var e = d.replaced ? poolFind(state, d.old_word) : null;
    out.push({ sentence_id: op.sentence_id, word_id: s.word_id, sentence_text: String(s.text || ""),
               new_word: (wordOf(state.data, s.word_id) || {}).spelling || "",
               replaced: !!d.replaced, old_word: d.old_word || "", slot: typeof d.slot === "number" ? d.slot : -1,
               reason: d.reason || "", detail: d.detail || "",
               choice_text: d.replaced ? String(face.choices[d.slot]) : "",
               meaning_raw: e ? String(e.meaning == null ? "" : e.meaning) : "",
               tried: d.tried || 0, trials: d.trials || [],
               choices: face ? face.choices.slice() : [], correct: face ? face.correct : -1,
               notes: face && face.notes ? face.notes : [] });
  }
  return out;
}

function answersMap(state){
  if(!state.progress.answers || typeof state.progress.answers !== "object") state.progress.answers = {};
  return state.progress.answers;
}

function answerOf(state, mid){ return answersMap(state)[String(mid)] || null; }

function isDone(state, item){ return item ? !!answerOf(state, item.mid) : false; }

function roundDone(state, roundNo){
  var items = roundItems(state, roundNo);
  if(!items.length) return false;
  return items.every(function(x){ return !!answerOf(state, x.mid); });
}

function allDone(state){
  var f = flowList(state);
  if(!f.length) return false;
  return f.every(function(x){ return !!answerOf(state, x.mid); });
}

/* 后加的题：上传词表排进来的（kind=pool）、答偏重走的那几屏（带 redo），只看还没做过的 */
function laterAdded(state){
  var f = flowList(state), out = [], i, it;
  for(i = 0; i < f.length; i++){
    it = f[i];
    if(!it) continue;
    if(it.kind !== "pool" && typeof it.redo !== "number") continue;
    if(answerOf(state, it.mid)) continue;
    out.push(i);
  }
  return out;
}

function barText(state){
  var sc = state.progress.screen;
  if(sc === "PICK") return "选词";
  if(sc === "HELPER") return "全部走完了";
  if(sc === "HOME") return "帮手区";
  if(sc === "WORDS") return "词表";
  if(sc === "DRILL"){
    var dd = state.progress.drill;
    return (dd && dd.word) ? ("直背 · " + String(dd.word)) : "直背";
  }
  var it = screenAt(state);
  if(!it) return "全部走完了";
  var ss = sessOf(state);
  if(ss){
    var at = (typeof state.progress.seq === "number") ? state.progress.seq : 0;
    return "第 " + ss.roundNo + "/" + ss.totalRounds + " 局 · 屏 " + (at + 1) + "/" + ss.flow.length;
  }
  return "第 " + roundOfSeq(it.seq) + "/" + roundCount(state) + " 局 · 屏 " + screenNoInRound(it) + "/" + ROUND_SIZE;
}

/* 一屏答完点「下一屏」：满 5 屏进本局小结，最后一局之后进收尾屏 */
function nextPointer(state){
  var f = flowList(state), i = state.progress.seq || 0;
  var it = f[i];
  var sess = sessOf(state);
  /* 一局 5 屏：这一局的第 5 屏走完就进本局小结，再由小结决定下一局 */
  if(sess){
    if(it && i < f.length - 1) return { seq: i + 1, screen: "Q", round: sess.roundNo };
    /* 一次弄完：这一局满了直接接下一局，不弹小结 */
    if(sess.mode === "all" && sess.roundNo < sess.totalRounds){
      var builtNext = advanceSessionRound(state);
      if(builtNext && builtNext.flow.length) return { seq: 0, screen: "Q", round: state.progress.session.roundNo };
    }
    return { seq: i, screen: "ROUND", round: sess.roundNo };
  }
  if(!it) return { seq: i, screen: "HELPER", round: roundCount(state) };
  if((i + 1) % ROUND_SIZE === 0) return { seq: i, screen: "ROUND", round: roundAtIndex(i) };
  if(i + 1 > f.length - 1) return { seq: i, screen: "HELPER", round: roundAtIndex(i) };
  return { seq: i + 1, screen: "Q", round: roundAtIndex(i) };
}

/* 本局小结屏点「接着下一局」 */
function afterRoundPointer(state){
  var f = flowList(state), i = state.progress.seq || 0;
  var sess = sessOf(state);
  if(sess){
    /* 还有下一局：换下一批 5 个词，回到这一局的第 1 屏 */
    if(sess.roundNo < sess.totalRounds) return { seq: 0, screen: "Q", round: sess.roundNo + 1 };
    return { seq: i, screen: "PICK", round: sess.roundNo };
  }
  if(i + 1 > f.length - 1) return { seq: i, screen: "HELPER", round: roundCount(state) };
  return { seq: i + 1, screen: "Q", round: roundAtIndex(i + 1) };
}


function stateRecord(state, wid){
  var arr = (state && state.data && state.data.states) || [];
  for(var i = 0; i < arr.length; i++){ if(arr[i].word_id === wid) return arr[i]; }
  return null;
}

/* 防猜：用时不到 3 秒且选的就是该项，才算快答猜中；界面不给学生任何提示 */
function isGuess(ms, correct){ return !!correct && ms < 3000; }

function nextLabel(state){
  var f = flowList(state), i = state.progress.seq || 0;
  if(sessOf(state)) return (i + 1 > f.length - 1) ? "看这一局小结" : "下一屏";
  if((i + 1) % ROUND_SIZE === 0) return "看这一局小结";
  if(i + 1 > f.length - 1) return "看收尾屏";
  return "下一屏";
}

function juggleText(state){
  var it = screenAt(state);
  if(!it) return "";
  var ss = sessOf(state);
  if(ss){
    var at = (typeof state.progress.seq === "number") ? state.progress.seq : 0;
    return "第 " + ss.roundNo + "/" + ss.totalRounds + " 局 · 屏 " + (at + 1) + "/" + ss.flow.length;
  }
  return "第 " + roundOfSeq(it.seq) + " 局 · 屏 " + screenNoInRound(it) + "/" + ROUND_SIZE;
}


/* ---------- 旧词池：三态 + 1/3/7/15 天复习间隔（只服务帮手区，不进出题流程） ---------- */
var POOL_INTERVALS = [1, 3, 7, 15];
var POOL_STATES = ["mastered", "upgrading", "relearn"];
var POOL_STATE_TEXT = { mastered: "可用", upgrading: "待确认", relearn: "需回炉" };
/* 初始分批：按 1/3/7/15 四档把未来 16 天铺满（今天 / 1~3 天 / 4~7 天 / 8~15 天），
   档内再按天细分，保证任何一天打开都有一批可带回的旧词，不会把词全堆到明天 */
var SPREAD_DAYS = 16;
var STAGE_EDGE = [0, 3, 7, 15];

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function dayKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function todayKey(){ return dayKey(new Date()); }
function addDaysKey(key, n){
  var p = String(key).split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + n);
  return dayKey(d);
}

/* 第 index 个入池的词排到哪天：0~15 天轮转，今天这一档排在最前，后面按 1/3/7/15 四档铺开 */
function staggerOffset(index){ return index % SPREAD_DAYS; }

/* 到期日落在第几天 → 归到 1/3/7/15 四档里的哪一档（第 0 档今天，1 档 1~3 天，2 档 4~7 天，3 档 8~15 天） */
function stageForOffset(off){
  var o = Number(off) || 0;
  if(o < 0) o = 0;
  if(o >= SPREAD_DAYS) o = SPREAD_DAYS - 1;
  for(var s = 0; s < STAGE_EDGE.length; s++){ if(o <= STAGE_EDGE[s]) return s; }
  return STAGE_EDGE.length - 1;
}

function poolEntry(word, meaning, poolState, dueKey, stage){
  return {
    word: String(word || ""),
    meaning: String(meaning || ""),
    state: POOL_STATES.indexOf(poolState) >= 0 ? poolState : "upgrading",
    stage: typeof stage === "number" ? stage : 0,
    next_due: String(dueKey || todayKey()),
    await_confirm: "",
    right: 0,
    miss: 0,
    consecutive_wrong: 0,
    consecutive_right: 0,
    level: 0,
    from: "import"
  };
}

/* 预置旧词池：按天铺满未来 16 天，今天必定有词，往后每天都有到期的一批 */
function seedPool(){
  var t = todayKey();
  return (DATA.old_words || []).map(function(o, i){
    var off = staggerOffset(i);
    var e = poolEntry(o.word, o.meaning, i % 6 === 0 ? "relearn" : "mastered",
                      addDaysKey(t, off), stageForOffset(off));
    e.from = "seed";
    return e;
  });
}

function poolItems(state){
  if(!state || !state.pool || !Array.isArray(state.pool.items)) return [];
  return state.pool.items;
}

function poolFind(state, word){
  var w = String(word || "").toLowerCase();
  var list = poolItems(state);
  for(var i = 0; i < list.length; i++){
    if(String(list[i].word).toLowerCase() === w) return list[i];
  }
  return null;
}

function poolAdd(state, word, meaning, poolState, dueKey, stage){
  var w = String(word || "").trim();
  if(!w) return null;
  var ex = poolFind(state, w);
  if(ex){
    if(meaning && !ex.meaning) ex.meaning = String(meaning);
    return ex;
  }
  if(!state.pool || !Array.isArray(state.pool.items)) state.pool = { items: [] };
  var e = poolEntry(w, meaning, poolState, dueKey, stage);
  state.pool.items.push(e);
  return e;
}

/* 正常候选：到期的、且不在回炉队列里的词 */
function poolDueList(state, today){
  var t = today || todayKey();
  return poolItems(state).filter(function(e){
    return e.state !== "relearn" && String(e.next_due) <= t;
  });
}

/* 回炉队列：先过一遍回炉，才谈得上回到正常候选 */
function poolRelearnList(state){
  return poolItems(state).filter(function(e){ return e.state === "relearn"; });
}

/* 缺释义的词单独记账：补上释义才排题 */
function poolMissingMeaning(state){
  return poolItems(state).filter(function(e){ return !String(e.meaning || "").trim(); });
}

function poolStateCount(state){
  var out = { mastered: 0, upgrading: 0, relearn: 0 };
  poolItems(state).forEach(function(e){
    if(out[e.state] == null) out[e.state] = 0;
    out[e.state] += 1;
  });
  return out;
}

function poolStats(state, today){
  return { total: poolItems(state).length, due: poolDueList(state, today).length,
           relearn: poolRelearnList(state).length, missing: poolMissingMeaning(state).length };
}

/* 今天要带回的旧词里，本句用得上的那一个；没有就返回 null */
function baitFor(state, sentenceId, today){
  var h = helperFor(state.data, sentenceId);
  if(!h || h.kind === "none") return null;
  var e = poolFind(state, h.old_word);
  if(!e) return null;
  var t = today || todayKey();
  /* 需回炉的词不许直接进正常候选 */
  if(e.state === "relearn") return null;
  if(String(e.next_due) > t) return null;
  return { help: h, entry: e };
}

function normalizePool(state){
  if(!state || typeof state !== "object") return state;
  if(!state.pool || typeof state.pool !== "object" || !Array.isArray(state.pool.items)){
    state.pool = { items: seedPool() };
  }
  state.pool.items = state.pool.items.filter(function(e){ return e && e.word; });
  state.pool.items.forEach(function(e){
    if(POOL_STATES.indexOf(e.state) < 0) e.state = "upgrading";
    if(typeof e.stage !== "number" || e.stage < 0 || e.stage > 3) e.stage = 0;
    if(typeof e.right !== "number") e.right = 0;
    if(typeof e.miss !== "number") e.miss = 0;
    if(typeof e.meaning !== "string") e.meaning = "";
    if(typeof e.await_confirm !== "string") e.await_confirm = "";
    if(!e.next_due) e.next_due = addDaysKey(todayKey(), POOL_INTERVALS[e.stage]);
    if(typeof e.from !== "string") e.from = "import";
  });
  return state;
}

/* 打开时兜底：正常分批下每天都有词，这里只防外部导入的脏数据把今天排空 */
function ensureDailyPool(state){
  normalizePool(state);
  var t = todayKey();
  if(poolDueList(state, t).length) return state;
  var list = poolItems(state);
  /* 优先挑不在回炉队列里的词兜底；实在没有，才动回炉里的词 */
  var pool = list.filter(function(e){ return e.state !== "relearn"; });
  if(!pool.length) pool = list;
  var best = null;
  for(var i = 0; i < pool.length; i++){
    if(!best || String(pool[i].next_due) < String(best.next_due)) best = pool[i];
  }
  /* 被强行拉到今天的词，档位一起回到今天这一档，免得「第 4 档却今天做」的错配 */
  if(best){ best.next_due = t; best.stage = 0; best.state = "mastered"; best.await_confirm = ""; }
  return state;
}

/* 帮手点被用到的那句答下来之后推进旧词三态 */
function applyHelperOutcome(state, word, correct, today){
  var e = poolFind(state, word);
  if(!e) return null;
  var t = today || todayKey();
  if(correct){
    e.right = (e.right || 0) + 1;
    var confirmed = (e.state === "upgrading") && String(e.await_confirm || "") !== "" && String(e.await_confirm) < t;
    if(e.state === "mastered"){
      e.stage = Math.min(3, (e.stage || 0) + 1);
      e.next_due = addDaysKey(t, POOL_INTERVALS[e.stage]);
    } else if(confirmed){
      /* 隔天还认得，才算可用 */
      e.state = "mastered";
      e.await_confirm = "";
      e.stage = Math.min(3, (e.stage || 0) + 1);
      e.next_due = addDaysKey(t, POOL_INTERVALS[e.stage]);
    } else {
      /* 当天认得只记一笔「待确认」，明天再看一眼，不当场升可用 */
      e.state = "upgrading";
      e.await_confirm = t;
      e.next_due = addDaysKey(t, 1);
    }
  } else {
    e.miss = (e.miss || 0) + 1;
    e.await_confirm = "";
    e.stage = 0;
    e.state = "relearn";
    e.next_due = addDaysKey(t, POOL_INTERVALS[0]);
  }
  return e;
}

/* ---------- 帮手点：只读 helpers 表，找不到就返回 null（不凑提示） ---------- */
function helperFor(data, sentenceId){
  var list = (data && data.helpers) || [];
  for(var i = 0; i < list.length; i++){
    if(list[i].sentence_id === sentenceId) return list[i];
  }
  return null;
}

/* 最长连续公共字母块（不分大小写），用于校验「共享连续 >=3 字母块」是否真的成立 */
function commonChunk(a, b){
  var x = String(a || "").toLowerCase(), y = String(b || "").toLowerCase(), best = "";
  for(var i = 0; i < x.length; i++){
    for(var L = best.length + 1; i + L <= x.length; L++){
      var piece = x.substr(i, L);
      if(y.indexOf(piece) >= 0) best = piece;
      else break;
    }
  }
  return best;
}

/* ---------- 词表解析：一行一词，兼容逗号/空格/制表符，释义留着备用，去重去空 ---------- */
var CJK_RE = /[\u3400-\u9fff]/;

function parseWordList(text){
  var out = [], seen = {};

  function push(w, meaning){
    var word = String(w || "").trim();
    if(!/^[A-Za-z][A-Za-z'\-]*$/.test(word)) return;
    var k = word.toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    out.push({ word: word, meaning: String(meaning || "").trim() });
  }

  function take(seg){
    var s = String(seg || "").trim();
    if(!s) return;
    var m = s.match(/^([A-Za-z][A-Za-z'\-]*)\s*([\s\S]*)$/);
    if(!m) return;
    var w = m[1], rest = m[2].trim();
    if(!rest){ push(w, ""); return; }
    var lead = rest.match(/^([^\x00-\x7F]+)/);
    if(lead){
      var mean = lead[1].trim();
      var after = rest.slice(lead[1].length).trim();
      push(w, mean);
      if(after) take(after);
      return;
    }
    if(CJK_RE.test(rest)){ push(w, rest); return; }
    push(w, "");
    take(rest);
  }

  function takeCommaLine(raw){
    var segs = raw.split(/[,，;；、]/).map(function(x){ return x.trim(); }).filter(function(x){ return x; });
    if(!segs.length) return;
    var head = segs[0].match(/^([A-Za-z][A-Za-z'\-]*)\s*([\s\S]*)$/);
    var restPure = segs.slice(1).every(function(x){ return !/[A-Za-z]/.test(x); });
    if(head && segs.length > 1 && restPure && !head[2]){
      push(head[1], segs.slice(1).join(" ").trim());
      return;
    }
    segs.forEach(take);
  }

  String(text || "").split(/\r?\n/).forEach(function(line){
    var raw = String(line).replace(/\u3000/g, " ").trim();
    if(!raw) return;
    if(raw.indexOf("\t") >= 0){
      var f = raw.split("\t").filter(function(x){ return String(x).trim(); });
      if(!f.length) return;
      take(f[0]);
      if(f.length > 1){
        var last = out[out.length - 1];
        if(last && !last.meaning) last.meaning = f.slice(1).join(" ").trim();
      }
      return;
    }
    if(/[,，;；、]/.test(raw)){
      takeCommaLine(raw);
      return;
    }
    take(raw);
  });

  return out;
}

/* ---------- 上传词表直接出题：B（给单词选汉语）/ C（给汉语选英文） ---------- */
var MISSING_MEANING_TAG = "缺释义·待补";
var POOL_QUIZ_NOTE = "这道题是从你上传的词表里直接出的，没有句子，只看释义本身。";

function meaningKey(s){ return String(s || "").replace(/[^\u3400-\u9fffA-Za-z]/g, ""); }

/* 两个释义算不算挨得太近：一方包住另一方，或常用汉字重合得多，都不能当干扰项 */
function meaningTooClose(a, b){
  var x = meaningKey(a), y = meaningKey(b);
  if(!x || !y) return true;
  if(x === y || x.indexOf(y) >= 0 || y.indexOf(x) >= 0) return true;
  var seen = {}, hit = 0;
  for(var i = 0; i < x.length; i++){
    var ch = x.charAt(i);
    if(seen[ch]) continue;
    seen[ch] = 1;
    if(y.indexOf(ch) >= 0) hit += 1;
  }
  return hit >= Math.max(2, Math.ceil(Math.min(x.length, y.length) * 0.6));
}

function meaningGap(a, b){ return Math.abs(String(a || "").length - String(b || "").length); }

/* 外形相近：共同前缀 + 共享连续字母块，越像排越前（C 形式的干扰项优先取近似拼写） */
function shapeNear(a, b){
  var x = String(a || "").toLowerCase(), y = String(b || "").toLowerCase();
  var n = 0, L = Math.min(x.length, y.length);
  while(n < L && x.charAt(n) === y.charAt(n)) n += 1;
  return n * 4 + commonChunk(x, y).length * 2 - Math.abs(x.length - y.length);
}

/* 出题候选：本次上传的这一批优先，凑不够再从这个旧词池里补（都要求带释义） */
function poolQuizCandidates(state, self, batch){
  var keys = {};
  (batch || []).forEach(function(e){ if(e) keys[String(e.word).toLowerCase()] = 1; });
  var out = [];
  poolItems(state).forEach(function(e){
    if(!e || !e.word) return;
    if(String(e.word).toLowerCase() === String(self.word).toLowerCase()) return;
    if(!String(e.meaning || "").trim()) return;
    out.push({ entry: e, same: !!keys[String(e.word).toLowerCase()] });
  });
  return out;
}

/* 一屏的题是从哪一批词里出的 */
function poolQuizBatchOf(state, item){
  var keys = (item && item.batch) || [], out = [];
  keys.forEach(function(w){ var e = poolFind(state, w); if(e) out.push(e); });
  return out;
}

/* 对的那一项放第几格由词本身定：同一个词每次打开都落同一格 */
function quizSlot(word, salt){
  var s = String(word || "") + "|" + String(salt || ""), h = 0;
  for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return h % 4;
}

function placeChoices(correctText, wrongTexts, slot){
  var out = wrongTexts.slice(0, 3);
  out.splice(slot % 4, 0, correctText);
  return out;
}

/* 这个位置上摆的是哪个干扰项 */
function wrongAt(wrongTexts, slot, i){ return wrongTexts[i > slot ? i - 1 : i]; }

/* 一个词出成一道题：缺释义、或凑不齐三个像样的干扰项，就返回 null（宁可不排，不硬凑） */
function buildPoolQuiz(state, entry, batch){
  if(!entry) return null;
  var self = entry, m = String(entry.meaning || "").trim();
  if(!m) return null;
  var cands = poolQuizCandidates(state, self, batch);
  var byMeaning = cands.filter(function(x){ return !meaningTooClose(self.meaning, x.entry.meaning); });
  byMeaning.sort(function(a, b){
    if(a.same !== b.same) return a.same ? -1 : 1;
    var d = meaningGap(a.entry.meaning, self.meaning) - meaningGap(b.entry.meaning, self.meaning);
    if(d) return d;
    return String(a.entry.word) < String(b.entry.word) ? -1 : 1;
  });
  var byShape = cands.slice();
  byShape.sort(function(a, b){
    if(a.same !== b.same) return a.same ? -1 : 1;
    var d = shapeNear(b.entry.word, self.word) - shapeNear(a.entry.word, self.word);
    if(d) return d;
    return String(a.entry.word) < String(b.entry.word) ? -1 : 1;
  });
  if(byMeaning.length < 3 || byShape.length < 3) return null;

  var mEntry = byMeaning.slice(0, 3).map(function(x){ return x.entry; });
  var sEntry = byShape.slice(0, 3).map(function(x){ return x.entry; });
  var mDist = mEntry.map(function(e){ return String(e.meaning).trim(); });
  var sDist = sEntry.map(function(e){ return String(e.word); });
  var slotB = quizSlot(entry.word, "B"), slotC = quizSlot(entry.word, "C");

  var bChoices = placeChoices(m, mDist, slotB);
  var cChoices = placeChoices(String(entry.word), sDist, slotC);

  var bNotes = bChoices.map(function(txt, i){
    if(i === slotB) return null;
    var e = wrongAt(mEntry, slotB, i);
    return { span: String(e.word), misread_type: "词表里另有一个词",
             why_wrong: "「" + String(e.meaning).trim() + "」是 " + String(e.word) + " 的意思，跟 " + String(entry.word) + " 不是一回事。" };
  });
  var cNotes = cChoices.map(function(txt, i){
    if(i === slotC) return null;
    var e = wrongAt(sEntry, slotC, i);
    return { span: String(e.meaning).trim(), misread_type: "词表里另有一个词",
             why_wrong: "「" + String(e.meaning).trim() + "」对的是 " + String(e.word) + "，不是 " + String(entry.word) + "。" };
  });

  return {
    stem: String(entry.word),
    pos: "",
    meaning_zh: m,
    answer_note: POOL_QUIZ_NOTE,
    from_pool: true,
    form_word: { choices: bChoices, correct_index: slotB, notes: bNotes },
    form_zh: { choices: cChoices, correct_index: slotC, notes: cNotes }
  };
}

/* 一批词排出来的屏：每个词两道（先给单词选汉语，再给汉语选英文） */
function poolQuizScreens(state, entries){
  var list = entries || [], out = [];
  var batchWords = list.map(function(e){ return String(e.word); });
  list.forEach(function(e){
    var q = buildPoolQuiz(state, e, list);
    if(!q) return;
    var key = String(e.word).toLowerCase();
    out.push({ kind: "pool", mid: "P:" + key + ":B", form: "word", word_id: null,
               sentence_id: null, pool_word: String(e.word), batch: batchWords });
    out.push({ kind: "pool", mid: "P:" + key + ":C", form: "zh", word_id: null,
               sentence_id: null, pool_word: String(e.word), batch: batchWords });
  });
  return out;
}

/* 新题接在「下一局开头」：已经排好的这一局不打断，5 屏一局的节奏还是照旧 */
function nextRoundStart(state){
  var f = flowList(state), i = state.progress.seq || 0;
  return Math.min(f.length, (Math.floor(i / ROUND_SIZE) + 1) * ROUND_SIZE);
}

/* 把后续屏收进 tail，保证 tail 正好从 at 这一屏开始 */
function ensureTailFrom(state, idx){
  var p = state.progress || (state.progress = {});
  var base = baseFlow(state);
  var from = tailFromOf(state);
  if(from == null) from = base.length;
  var at = Math.max(0, Math.min(idx, Math.max(base.length, from)));
  if(at < from){
    p.tail = base.slice(at, from).concat(tailOf(state));
    p.tailFrom = at;
  } else if(at > from){
    p.tail = tailOf(state).slice(at - from);
    p.tailFrom = at;
  } else {
    if(!Array.isArray(p.tail)) p.tail = [];
    p.tailFrom = at;
  }
  return p.tail;
}

function insertScreensAt(state, idx, screens){
  if(!screens || !screens.length) return [];
  var p = state.progress || (state.progress = {});
  var f = flowList(state);
  var at = Math.max(0, Math.min(idx, f.length));
  var keys = screens.map(function(x){ return String(x.mid); });
  var rest = f.filter(function(x){ return keys.indexOf(String(x.mid)) < 0; });
  var before = f.slice(0, at).filter(function(x){ return keys.indexOf(String(x.mid)) < 0; }).length;
  var next = rest.slice(0, before).concat(screens, rest.slice(before));
  var from = tailFromOf(state);
  if(from == null) from = baseFlow(state).length;
  if(at < from) from = at;
  p.tailFrom = from;
  p.tail = next.slice(from);
  return screens;
}

/* 导入一批带释义的词：当场排题接进队列，返回排了多少 */
function insertPoolQuiz(state, entries){
  var list = (entries || []).filter(function(e){ return e && String(e.meaning || "").trim(); });
  var missing = (entries || []).filter(function(e){ return e && !String(e.meaning || "").trim(); }).length;
  var screens = poolQuizScreens(state, list);
  var have = {};
  flowList(state).forEach(function(x){ if(x && x.kind === "pool") have[String(x.mid)] = 1; });
  var fresh = screens.filter(function(x){ return !have[String(x.mid)]; });
  if(fresh.length) insertScreensAt(state, nextRoundStart(state), fresh);
  var words = {};
  fresh.forEach(function(x){ words[String(x.pool_word).toLowerCase()] = 1; });
  return { words: Object.keys(words).length, screens: fresh.length, missing: missing };
}

/* 答偏的那个词，把它自己的那几屏按原顺序再排一遍（从它的第一题重来） */
function redoScreensOf(state, item){
  if(!item) return [];
  /* 只对上传词表排出来的题组重走：设计内 50 屏是同词三句分三局的固定排布，
     插屏会破坏规格，所以设计内的词答偏只记 consecutive_wrong/level，不改排布 */
  if(item.kind !== "pool") return [];
  var e = poolFind(state, item.pool_word);
  return e ? poolQuizScreens(state, [e]) : [];
}

function applyRedo(state, item, idx){
  var src = redoScreensOf(state, item);
  if(!src.length) return 0;
  var p = state.progress || (state.progress = {});
  p.redo_seq = (typeof p.redo_seq === "number" ? p.redo_seq : 0) + 1;
  var tag = "#r" + p.redo_seq;
  var copies = src.map(function(x){
    var c = {};
    for(var k in x){ if(Object.prototype.hasOwnProperty.call(x, k)) c[k] = x[k]; }
    c.mid = String(x.mid) + tag;
    c.redo = p.redo_seq;
    return c;
  });
  var cur = (typeof idx === "number") ? idx : (p.seq || 0);
  var flow = flowList(state);
  var at = Math.max(0, Math.min(cur + 1, flow.length));
  var from = tailFromOf(state);
  if(from == null) from = baseFlow(state).length;
  var keys = {};
  src.forEach(function(x){ keys[String(x.mid)] = 1; });
  var rest = flow.slice(at).filter(function(x){
    var mid = String(x.mid);
    if(keys[mid]) return false;
    return !keys[mid.split("#r")[0]];
  });
  /* 已经走过的那一段原样留在 tail 里：重走屏紧接当前屏，顺序和局边界都不乱 */
  var head = flow.slice(from, at);
  if(keys[String((flow[at] || {}).mid || "")]){ /* 后面的旧屏已去掉，靠 rest 拼 */ }
  var merged = head.concat(copies, rest);
  p.tail = (merged.length > 300) ? merged.slice(0, 300) : merged;
  p.tailFrom = from;
  return copies.length;
}

/* 词自身的账本：level 记连到第几档，consecutive_wrong 记连着偏了几次 */
function markWordState(st, right){
  if(!st) return null;
  if(right){
    st.consecutive_wrong = 0;
    st.consecutive_right = (st.consecutive_right || 0) + 1;
    st.level = Math.min(3, (st.level || 0) + 1);
  } else {
    st.consecutive_wrong = (st.consecutive_wrong || 0) + 1;
    st.consecutive_right = 0;
    st.level = 0;
  }
  st.next_due = addDaysKey(todayKey(), 1);
  return st;
}

/* ================= 锚点账本：句子里真正承载这个词的那一段 ================= */
/* 词干：词尾两三个字母先不较真，insisted / insists 都要能锚回 insist */
function stemOf(word){
  var w = String(word == null ? "" : word).toLowerCase();
  if(w.length > 5) w = w.slice(0, w.length - 2);
  if(w.length > 4) w = w.slice(0, w.length - 1);
  return w;
}

/* 整词先找，找不到再按词干前缀模糊找；找不到就返回 null，绝不硬指一个片段 */
function anchorPiece(text, word){
  var raw = String(text == null ? "" : text);
  var w = String(word == null ? "" : word).trim();
  if(!raw || !w) return null;
  var lw = w.toLowerCase();
  var stem = stemOf(lw);
  var best = null;
  var re = /[A-Za-z][A-Za-z'\-]*/g, m;
  while((m = re.exec(raw)) !== null){
    var tok = m[0], lt = tok.toLowerCase(), score = 0;
    if(lt === lw) score = 100;
    else if(stem.length >= 3 && lt.indexOf(stem) === 0) score = 90;
    else if(lw.length >= 4 && lt.indexOf(lw) === 0) score = 80;
    if(score > 0 && (!best || score > best.score || (score === best.score && m.index < best.start))){
      best = { text: tok, start: m.index, end: m.index + tok.length, score: score };
    }
  }
  return best;
}

function escText(t){
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* 锚点片段套 span：句子显示与讲解例句都走这一个出口 */
function anchorHtml(text, word){
  var raw = String(text == null ? "" : text);
  var p = anchorPiece(raw, word);
  if(!p) return escText(raw);
  return escText(raw.slice(0, p.start)) + '<b class="anchor">' + escText(p.text) + "</b>" + escText(raw.slice(p.end));
}

/* 锚点账本：三张 edges 占位、30 句逐句记账，锚不出来的句子算内容不全 */
function anchorLedger(data){
  var sents = (data && data.sentences) || [];
  var rows = [], hit = 0, miss = [];
  for(var i = 0; i < sents.length; i++){
    var s = sents[i];
    var w = wordOf(data, s.word_id);
    var piece = anchorPiece(s.text, w ? w.spelling : "");
    if(piece) hit++;
    else miss.push(s.id);
    rows.push({ sentence_id: s.id, word_id: s.word_id, word: w ? w.spelling : "",
                piece: piece ? piece.text : null, start: piece ? piece.start : -1,
                score: piece ? piece.score : 0 });
  }
  return { total: rows.length, anchored: hit, missing: miss, rows: rows };
}

function sentsOf(data, wid){
  var list = (data && data.sentences) || [], out = [];
  for(var i = 0; i < list.length; i++){ if(list[i].word_id === wid) out.push(list[i]); }
  out.sort(function(a, b){ return a.id - b.id; });
  return out;
}

function helperOfWord(data, word){
  var list = (data && data.helpers) || [], w = String(word == null ? "" : word).toLowerCase();
  if(!w) return null;
  for(var i = 0; i < list.length; i++){
    if(String(list[i].new_word || "").toLowerCase() === w) return list[i];
  }
  return null;
}

/* 讲解例句：锚不出这个词就返回空，宁可不出例句，也不拿半句话硬凑 */
function exampleHtml(text, word){
  if(!anchorPiece(text, word)) return "";
  return anchorHtml(text, word);
}

/* 方法入口：每一屏「这个词该用什么方法记」，当场从词块账本 / 句子锚点 / 帮手记法里取 */
function methodPlan(state, item){
  if(!state || !item) return { word: "", lines: [], mine: null };
  var data = state.data || {};
  var done = answerOf(state, item.mid);
  var word = "", meaning = "", pos = "", sid = null, wid = null, pe = null;
  if(item.kind === "pool"){
    pe = poolFind(state, item.pool_word);
    if(!pe) return { word: String(item.pool_word || ""), lines: [], mine: null };
    word = String(pe.word || ""); meaning = String(pe.meaning || "");
  } else {
    var w = wordOf(data, item.word_id);
    word = w ? String(w.spelling || "") : "";
    pos = w ? String(w.pos || "") : "";
    wid = item.word_id;
    if(item.form === "sentence"){
      sid = item.sentence_id;
      var op = optionIn(data, sid);
      meaning = op ? String(op.grounded_meaning || "") : "";
    } else {
      var q = wordQuizOf(data, item.word_id);
      meaning = q ? String(q.meaning_zh || "") : "";
      var ss = sentsOf(data, wid);
      sid = ss.length ? ss[0].id : null;
    }
  }

  /* 给汉语挑英文这一屏，任何关于这个词的长相提示都会把答案递出去，答完再给 */
  if(item.form === "zh" && !done){
    return { word: word, meaning: meaning, pos: pos, mine: null,
             lines: [{ k: "plain", t: "这一屏先不给记法：四个词的写法就摆在选项里，凭释义本身直接对，答完再看它落成什么。" }] };
  }

  var lines = [];

  /* ① 长相：跟哪个旧词共享哪一段（账本里有就照账本念） */
  var edges = (data && data.edges) || [];
  var chunkBit = "";
  for(var i = 0; i < edges.length; i++){
    var e = edges[i];
    if(String(e.new_word || "").toLowerCase() !== word.toLowerCase()) continue;
    var cp = e.chunk_pos || {};
    chunkBit = "和旧词 " + e.old_word + " 共享连续 " + String(e.shared_chunk || "").length
      + " 个字母「" + String(e.shared_chunk || "") + "」，落在 " + String(cp.start) + "-" + String(cp.end)
      + "（" + String(cp.at || "") + "）";
    break;
  }
  if(!chunkBit){
    var st = stemOf(word);
    chunkBit = "先拆长相：" + (st && st !== word.toLowerCase() ? st + "（词干）+ 词尾" : word) + "，一段一段过，别整个记。";
  }
  lines.push({ k: "shape", t: "长相 · " + chunkBit });

  /* ② 例句：现成的句子配上锚点，句子就是记法的落点 */
  var sNow = sid ? sentenceOf(data, sid) : null;
  if(sNow && String(sNow.text || "").trim()){
    var pc = anchorPiece(sNow.text, word);
    lines.push({ k: "sentence", t: "记在这一句：" + String(sNow.text || "")
      + (pc ? "（锚点：「" + pc.text + "」）" : "") });
  }

  /* ③ 已有的方法说明：帮手点原文，原样调出来，不另写一段 */
  var hp = sid ? helperFor(data, sid) : null;
  if(!hp && wid != null) hp = helperOfWord(data, word);
  if(hp){
    var htext = (hp.kind === "chunk")
      ? ("旧词 " + hp.old_word + " 和新词共享连续 " + String(hp.chunk || "").length + " 个字母块「"
         + String(hp.chunk || "") + "」：" + String(hp.note || ""))
      : ("旧词 " + hp.old_word + "：" + String(hp.note || ""));
    lines.push({ k: "helper", t: "记法：" + htext });
  }

  /* ④ 落在哪：答完才说，答之前不透 */
  if(done && meaning){
    lines.push({ k: "mean", t: (item.form === "sentence" ? "这句里它落成：" : "这层意思记在：") + meaning });
  }

  return { word: word, meaning: meaning, pos: pos, lines: lines,
           mine: { word: word, meaning: meaning, pos: pos } };
}

/* ================= 内容兜底：缺一块就不出这一屏 ================= */
function screenGap(state, item){
  if(!state || !item) return "这一屏的题面取不到";
  /* 上传词先看词条本身：词不在表里、或者释义还是空的，直接报缺哪一块 */
  if(item.kind === "pool"){
    var peG = poolFind(state, item.pool_word);
    if(!peG) return "题面取不到（这个词不在词表里）";
    if(!String(peG.meaning || "").trim()) return "缺释义";
  }
  var face = faceAt(state, item);
  if(!face) return "题面取不到（缺句子或缺词）";
  if(item.kind !== "pool"){
    var w = wordOf(state.data, item.word_id);
    if(!w || !String(w.spelling || "").trim()) return "缺这个词的写法";
    if(item.form === "sentence"){
      var s = sentenceOf(state.data, item.sentence_id);
      if(!s || !String(s.text || "").trim()) return "缺句子";
      var op = optionIn(state.data, item.sentence_id);
      if(!op || !String(op.grounded_meaning || "").trim()) return "缺这句的落地说法";
      if(!anchorPiece(s.text, w ? w.spelling : "")) return "句子锚不到这个词";
    } else {
      var q = wordQuizOf(state.data, item.word_id);
      if(!q || !String(q.meaning_zh || "").trim()) return "缺释义";
    }
  } else if(!String((face.pool && face.pool.meaning) || "").trim()){
    return "缺释义";
  }
  if(!face.choices || face.choices.length < 2) return "选项不够";
  var seenC = {}, i;
  for(i = 0; i < face.choices.length; i++){
    var c = String(face.choices[i] == null ? "" : face.choices[i]).trim();
    if(!c) return "有空选项";
    if(seenC[c]) return "两个选项写的一样";
    seenC[c] = 1;
  }
  if(typeof face.correct !== "number" || face.correct < 0 || face.correct >= face.choices.length) return "答案项对不上号";
  return "";
}

/* ================= 直背通道：不给句子，只看词和释义；5 种背法各走各的 ================= */
var DRILL_MODES = [
  { id: "M1", name: "看词+看释义", hint: "词和释义摆在一起，先看两遍，把词和意思对上" },
  { id: "M2", name: "只看词 · 回想翻面", hint: "先只给词，自己回想，想好了再翻面对核" },
  { id: "M3", name: "看释义 · 四选一词", hint: "只给释义，从四个词里挑一个对得上的" },
  { id: "M4", name: "看词 · 四选一汉语", hint: "只给词，从四条汉语里挑一条对得上的" },
  { id: "M5", name: "给首字母 · 拼一遍", hint: "只给首字母和释义，把整个词拼出来再显影对照" }
];
var DRILL_MODE_STEPS = { M1: 2, M2: 2, M3: 1, M4: 1, M5: 2 };
var DRILL_MODE_DEFAULT = "M1";
var DRILL_PICK_FIRST = "先在上面挑一项";

function drillModeName(id){
  for(var i = 0; i < DRILL_MODES.length; i++){ if(DRILL_MODES[i].id === id) return DRILL_MODES[i].name; }
  return "";
}
function drillModeHint(id){
  for(var i = 0; i < DRILL_MODES.length; i++){ if(DRILL_MODES[i].id === id) return DRILL_MODES[i].hint; }
  return "";
}
function drillModeIdx(id){
  for(var i = 0; i < DRILL_MODES.length; i++){ if(DRILL_MODES[i].id === id) return i; }
  return -1;
}
function drillModeBlank(){ return { step: 0, done: false, pick: null, typed: "" }; }
function drillModeNewAll(){
  var m = {};
  for(var i = 0; i < DRILL_MODES.length; i++) m[DRILL_MODES[i].id] = drillModeBlank();
  return m;
}
function drillInit(state){
  var p = state && state.progress;
  if(!p) return { word: "", meaning: "", pos: "", mode: DRILL_MODE_DEFAULT, modes: drillModeNewAll(), seen: 0 };
  if(!p.drill || typeof p.drill !== "object") p.drill = { word: "", meaning: "", pos: "", seen: 0 };
  var d = p.drill;
  d.word = String(d.word == null ? "" : d.word);
  d.meaning = String(d.meaning == null ? "" : d.meaning);
  d.pos = String(d.pos == null ? "" : d.pos);
  if(typeof d.seen !== "number" || !isFinite(d.seen) || d.seen < 0) d.seen = 0;
  /* 老存档只有一个总步数，没有分模式进度：补成 5 份各自独立 */
  if(!d.modes || typeof d.modes !== "object" || Array.isArray(d.modes)){
    d.modes = drillModeNewAll();
    /* 老存档只有一个总步数：落到第一种背法上，剩下几种从零开始 */
    if(d.seen > 0){
      var m1 = d.modes[DRILL_MODE_DEFAULT];
      m1.step = Math.min(DRILL_MODE_STEPS[DRILL_MODE_DEFAULT], d.seen);
      m1.done = m1.step >= DRILL_MODE_STEPS[DRILL_MODE_DEFAULT];
    }
  }
  for(var i = 0; i < DRILL_MODES.length; i++){
    var id = DRILL_MODES[i].id, pr = d.modes[id];
    if(!pr || typeof pr !== "object"){
      pr = drillModeBlank();
      /* 老格式的步数落在第一种背法上，剩下几种从零开始 */
      if(id === DRILL_MODE_DEFAULT && d.seen > 0){
        pr.step = Math.min(DRILL_MODE_STEPS[id], d.seen);
        pr.done = pr.step >= DRILL_MODE_STEPS[id];
      }
      d.modes[id] = pr;
    }
    if(typeof pr.step !== "number" || !isFinite(pr.step) || pr.step < 0) pr.step = 0;
    pr.done = !!pr.done;
    if(typeof pr.pick !== "number") pr.pick = null;
    pr.typed = String(pr.typed == null ? "" : pr.typed);
  }
  if(!drillModeName(d.mode)) d.mode = DRILL_MODE_DEFAULT;
  return d;
}

function drillModeOf(state){ return drillInit(state).mode; }

/* 换模式只切当前这一种，别的模式进度不动 */
function drillSetMode(state, id){
  var d = drillInit(state);
  if(drillModeName(id)) d.mode = id;
  return d.mode;
}

function drillProgressOf(state, id){
  var d = drillInit(state);
  var k = drillModeName(id) ? id : d.mode;
  return d.modes[k] || drillModeBlank();
}

function drillModesDone(state){
  var d = drillInit(state), n = 0;
  for(var i = 0; i < DRILL_MODES.length; i++){
    var pr = d.modes[DRILL_MODES[i].id];
    if(pr && pr.done) n++;
  }
  return n;
}

function drillWords(state, d){
  var out = [String(d.word || "")];
  var hp = helperOfWord(state && state.data, d.word);
  if(hp && hp.old_word && String(hp.old_word).toLowerCase() !== String(d.word || "").toLowerCase()){
    out.push(String(hp.old_word));
  }
  return out;
}

function drillSeedOf(text){
  var s = String(text || ""), h = 7;
  for(var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) % 1000003; }
  return h;
}

/* 只有词和释义，四选项就从同一份数据里取；定序按词算死，回头再来还是同一套 */
function drillOptionSet(state, mode, word, meaning){
  var data = (state && state.data) || {};
  var words = data.words || [], quiz = data.word_quiz || {};
  var meanById = {}, i;
  for(i = 0; i < quiz.length; i++){ if(quiz[i]) meanById[quiz[i].word_id] = String(quiz[i].meaning_zh || "").trim(); }
  var cands = [];
  for(i = 0; i < words.length; i++){
    var w = words[i] || {};
    var sp = String(w.spelling || "").trim();
    if(!sp || sp.toLowerCase() === String(word || "").toLowerCase()) continue;
    cands.push({ word: sp, meaning: meanById[w.id] || String(w.common_meaning || "").trim() });
  }
  var seed = drillSeedOf(word || meaning);
  var start = cands.length ? seed % cands.length : 0;
  var correct = (mode === "M4") ? String(meaning || "") : String(word || "");
  var opts = [correct], used = {};
  used[correct] = 1;
  for(i = 0; i < cands.length && opts.length < 4; i++){
    var c = cands[(start + i) % cands.length];
    var v = (mode === "M4") ? String(c.meaning || "") : String(c.word || "");
    if(!v || used[v]) continue;
    used[v] = 1;
    opts.push(v);
  }
  var shift = opts.length ? seed % opts.length : 0;
  var arr = opts.slice(shift).concat(opts.slice(0, shift));
  return { stem: (mode === "M4") ? String(word || "") : String(meaning || ""),
           options: arr, correct: arr.indexOf(correct) };
}

/* 一种背法走到哪一步：5 种都从这份状态里各自取，互不影响 */
function drillStepAt(state){
  var d = drillInit(state);
  var mode = d.mode, pr = d.modes[mode] || drillModeBlank();
  var steps = DRILL_MODE_STEPS[mode] || 1;
  var step = Math.min(Math.max(0, pr.step || 0), steps);
  var done = !!pr.done || step >= steps;
  var out = { word: d.word || "", meaning: d.meaning || "", pos: d.pos || "",
    mode: mode, modeName: drillModeName(mode), modeHint: drillModeHint(mode),
    modeIdx: drillModeIdx(mode) + 1, modes: DRILL_MODES.length,
    modesDone: drillModesDone(state),
    steps: steps, step: step, index: step, pass: 1, passes: 1,
    phase: step, phaseIdx: step + 1, phases: steps, done: done,
    showMeaning: true, needFlip: false, needPick: false,
    pick: pr.pick, typed: pr.typed || "",
    firstLetter: String(d.word || "").slice(0, 1),
    carry: drillWords(state, d), actionText: "" };
  if(mode === "M2"){
    out.needFlip = !done && step === 0;
    out.showMeaning = !out.needFlip;
    out.actionText = done ? "" : (out.needFlip ? "翻面对核" : "对上了，记下这个词");
  } else if(mode === "M3" || mode === "M4"){
    var os = drillOptionSet(state, mode, d.word, d.meaning);
    out.stem = os.stem;
    out.options = os.options;
    out.correct = os.correct;
    out.actionText = done ? "" : (pr.pick == null ? DRILL_PICK_FIRST : "记下了");
    out.needPick = !done && pr.pick == null;
  } else if(mode === "M5"){
    out.actionText = done ? "" : (step === 0 ? "比一比" : "记下了");
  } else {
    out.actionText = done ? "" : (step === 0 ? "看完了，再对一遍" : "这个词记下了");
  }
  return out;
}

/* 往下走一步：选项没挑、拼写没填就不往前走，不空转 */
function drillAdvance(state){
  var d = drillInit(state), st = drillStepAt(state);
  if(st.done) return st;
  var pr = d.modes[st.mode];
  if(!pr) return st;
  if((st.mode === "M3" || st.mode === "M4") && pr.pick == null) return st;
  if(st.mode === "M5" && st.step === 0 && !String(pr.typed || "").trim()) return st;
  pr.step = Math.min(st.steps, st.step + 1);
  if(pr.step >= st.steps) pr.done = true;
  return drillStepAt(state);
}

/* 四选一只是自己核对，挑一次就定住，不判对错也不记分 */
function drillPick(state, idx){
  var d = drillInit(state), st = drillStepAt(state);
  if(st.mode !== "M3" && st.mode !== "M4") return st;
  if(st.done) return st;
  var pr = d.modes[st.mode];
  if(pr && pr.pick == null) pr.pick = idx;
  return drillStepAt(state);
}

function drillTyped(state, text){
  var d = drillInit(state);
  var pr = d.modes[d.mode];
  if(!pr) return drillStepAt(state);
  pr.typed = String(text == null ? "" : text);
  return drillStepAt(state);
}

/* 只把当前这一种背法从头记，其余 4 种进度原样留着 */
function drillReset(state){
  var d = drillInit(state);
  d.modes[d.mode] = drillModeBlank();
  return d;
}

/* ================= 每条功能落在哪一屏、怎么验、带我去 ================= */
function firstSeqWhere(state, fn){
  var f = flowList(state) || [];
  for(var i = 0; i < f.length; i++){
    var face = null;
    try { face = faceAt(state, f[i]); } catch(e){ face = null; }
    try { if(fn(f[i], face)) return i; } catch(e2){}
  }
  return -1;
}

/* 词池里第一个写得全的词：直背能直接拿它开 */
function drillFirstPoolWord(state){
  var items = poolItems(state) || [];
  for(var i = 0; i < items.length; i++){
    var e = items[i] || {};
    if(e.word && String(e.meaning || "").trim()) return { word: e.word, meaning: e.meaning, pos: e.pos };
  }
  return null;
}

function featureGuide(id){
  var g = FEATURE_GUIDE[id];
  if(!g) return null;
  return { id: id, at: String(g.at || ""), how: String(g.how || ""), tip: String(g.tip || "") };
}

function featureTarget(id, state){
  var g = FEATURE_GUIDE[id];
  if(!g) return null;
  var s = state || (typeof S !== "undefined" ? S : null);
  if(typeof g.pick === "function"){
    var t = null;
    try { t = g.pick(s); } catch(e){ t = null; }
    if(t) return t;
  }
  if(g.kind === "session"){
    var f2 = flowList(s);
    var at2 = (s && s.progress && typeof s.progress.seq === "number") ? s.progress.seq : 0;
    if(f2 && f2.length) at2 = Math.max(0, f2.length - 1);
    return { seq: at2, screen: "Q" };
  }
  if(g.kind === "drill") return { screen: "DRILL", kind: "drill" };
  if(g.kind === "export") return { screen: "HOME", kind: "export" };
  if(g.go) return { seq: (typeof g.go.seq === "number" ? g.go.seq : 0), screen: g.go.screen || "Q" };
  return { seq: (s && s.progress && s.progress.seq) || 0, screen: "Q" };
}

/* 「带我去」：能直达的直达，不能直达的回到能验这一条的那一屏 */
function featureGo(id){
  var t = featureTarget(id);
  var g = FEATURE_GUIDE[id];
  if(!t) return false;
  var here = { seq: S.progress.seq, screen: S.progress.screen };
  if(t.kind === "drill"){
    var pw = drillFirstPoolWord(S);
    /* 先记好来路再跳：直背屏一进去顶栏就得有「← 回功能清单」 */
    var prevJumpAt = featureJumpAt;
    featureJumpAt = { seq: S.progress.seq, screen: "DRILL" };
    if(pw && jumpDrill(pw, prevJumpAt || here)) return true;
    featureJumpAt = prevJumpAt;
    if(g && g.tip) $("ioTip").textContent = "词池里还没有写全释义的词，先补一个释义再直背。";
    goPointer({ seq: S.progress.seq, screen: "WORDS" });
    return false;
  }
  if(t.kind === "export"){
    featureJumpAt = null;
    $("ioPanel").hidden = false;
    $("ioText").value = buildExport(S);
    $("ioTip").textContent = (g && g.tip) || "上面这段是当前完整进度，复制走存好即可。";
    render();
    return true;
  }
  if(g && g.tip) $("ioTip").textContent = g.tip;
  var ptr = { seq: (typeof t.seq === "number" ? t.seq : (S.progress.seq || 0)), screen: t.screen || "Q" };
  featureJumpAt = (ptr.screen === "HOME") ? null : { seq: ptr.seq, screen: ptr.screen };
  if(featureJumpAt){ backSeq = ptr.seq; backScreen = ptr.screen; }
  goPointer(ptr);
  return true;
}

/* 数据里那份清单要跟代码里的名单一一对上，少一条、名字改了、没写校验点都算丢功能 */
function featureManifestAudit(data){
  var man = (data && data.feature_manifest) || [];
  var missing = [], extra = [], i, j;
  for(i = 0; i < FEATURES.length; i++){
    var hit = false;
    for(j = 0; j < man.length; j++){
      var e = man[j] || {};
      if(e.id === FEATURES[i].id && String(e.name || "").trim() === FEATURES[i].name
         && String(e.code || "").trim()) hit = true;
    }
    if(!hit) missing.push(FEATURES[i].id + " " + FEATURES[i].name);
  }
  var ids = {};
  for(i = 0; i < FEATURES.length; i++) ids[FEATURES[i].id] = 1;
  for(i = 0; i < man.length; i++){
    var m = man[i] || {};
    if(!ids[m.id]) extra.push(String(m.id || "（无编号）"));
  }
  return { total: FEATURES.length, inData: man.length, missing: missing, extra: extra,
           pass: missing.length === 0 && extra.length === 0 };
}

/* 代码级校验：每条清单都写了一个实现标志，源码里找不到就算这条功能被悄悄丢了 */
function featureAudit(code, manifest){
  var src = String(code || "");
  var man = manifest || [];
  var lost = [], i;
  for(i = 0; i < man.length; i++){
    var e = man[i] || {};
    if(!String(e.code || "").trim()){ lost.push(String(e.id || "") + "（没写校验点）"); continue; }
    if(src.indexOf(String(e.code)) < 0) lost.push(String(e.id || "") + " " + String(e.name || ""));
  }
  return { total: man.length, expect: FEATURES.length, lost: lost,
           pass: lost.length === 0 && man.length === FEATURES.length };
}

/* 错项文案塞进句子里别太长，超过就截一段 */
function quipTrapText(txt){
  var t = String(txt == null ? "" : txt).trim();
  if(t.length > 12) t = t.slice(0, 12) + "…";
  return t;
}

/* 这一屏最有迷惑性的那个错项：跟对的那一项最像的那条；实在挑不出来就取下标最小的错项 */
function trapIndexOf(choices, correctIdx){
  var list = choices || [], right = String(list[correctIdx] == null ? "" : list[correctIdx]);
  var best = -1, bestScore = -1, i;
  for(i = 0; i < list.length; i++){
    if(i === correctIdx) continue;
    var one = String(list[i] == null ? "" : list[i]);
    var score = 0;
    var ch = commonChunk(right, one);
    if(ch) score += String(ch).length;
    if(meaningTooClose(right, one)) score += 10;
    score += meaningGap(right, one);
    if(score > bestScore){ bestScore = score; best = i; }
  }
  if(best < 0){
    for(i = 0; i < list.length; i++){ if(i !== correctIdx){ best = i; break; } }
  }
  return best;
}

/* 挑一句夸人的话：同一套里不跟上一次重，连着第几个只在第 2 个之后才拿来用 */
function quipFor(state, form, choices, correctIdx, combo){
  var set = QUIPS[form] || QUIPS.sentence;
  var p = state && state.progress ? state.progress : {};
  var last = (typeof p.lastQuip === "number") ? p.lastQuip : -1;
  var n = Number(combo) || 0;
  var trap = quipTrapText((choices || [])[trapIndexOf(choices || [], correctIdx)]);
  var pool = [], i;
  for(i = 0; i < set.length; i++){
    if(n < 2 && set[i].indexOf("{n}") >= 0) continue;
    if(i === last) continue;
    pool.push(i);
  }
  if(!pool.length){ for(i = 0; i < set.length; i++) pool.push(i); }
  var at = pool[Math.floor(Math.random() * pool.length)];
  var line = String(set[at] || "");
  line = line.split("{trap}").join(trap).split("{n}").join(String(n < 2 ? 1 : n));
  if(state && state.progress) state.progress.lastQuip = at;
  return line;
}

/* ---------------- 第二段：次数回响 / 差在哪 / 挂个旧词 / 按词列 core_state ---------------- */

/* 一屏到底是哪个词：句子题、单词题、汉语题都归到同一个词上 */
function tokenOfItem(item){
  if(!item) return "";
  if(item.kind === "pool") return poolToken(item.pool_word);
  return dataToken(item.word_id);
}

/* 这个屏队列里出现过的词，按第一次出现的顺序排好（同一个词只算一次） */
function tokensOfFlow(state, flow){
  var list = [], i;
  var src = flow || flowList(state) || [];
  for(i = 0; i < src.length; i++){
    var t = tokenOfItem(src[i]);
    if(t && list.indexOf(t) < 0) list.push(t);
  }
  return list;
}

/* 每个词累计认下来几次 */
function hitsOf(state, token){
  var t = String(token == null ? "" : token);
  var p = (state && state.progress) || {};
  var h = (p.hits && typeof p.hits === "object" && !Array.isArray(p.hits)) ? p.hits : {};
  var n = Number(h[t]);
  return (isFinite(n) && n > 0) ? Math.floor(n) : 0;
}

function bumpHit(state, token){
  var t = String(token == null ? "" : token);
  if(!t || !state || !state.progress) return 0;
  var p = state.progress;
  if(!p.hits || typeof p.hits !== "object" || Array.isArray(p.hits)) p.hits = {};
  var n = hitsOf(state, t) + 1;
  p.hits[t] = n;
  return n;
}

/* 第二次起不重复那句泛夸，直接说清这是第几次 */
function hitLine(n){
  var k = Math.floor(Number(n) || 0);
  if(k < 2) return "";
  return "这个词第 " + k + " 次认对了。";
}

/* 一句情绪价值：不评判、不催、也不过度安慰 */
var KINDLY = [
  "这一幕踩空了，跟这个词你认不认识是两件事，往下走就是了。",
  "刚才那条岔路看着最像，你能把它指出来，这一屏就没白走。",
