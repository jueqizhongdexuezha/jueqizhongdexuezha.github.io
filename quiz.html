  "卡在一句上很正常，词是这么一点点长出来的。",
  "你已经在拆这层的区别了，慢一点不算停。",
  "这一屏就到这儿，手不用停，往下走。"
];

function kindlyFor(state){
  var last = (state && state.progress && typeof state.progress.lastKindly === "number") ? state.progress.lastKindly : -1;
  var pool = [], i;
  for(i = 0; i < KINDLY.length; i++){ if(i !== last) pool.push(i); }
  if(!pool.length) for(i = 0; i < KINDLY.length; i++) pool.push(i);
  var at = pool[Math.floor(Math.random() * pool.length)];
  if(state && state.progress) state.progress.lastKindly = at;
  return String(KINDLY[at] || "");
}

/* 跟它差在哪：把点下去的这一项和这一屏真正要的那一项的落点差说白。
   正文直接用数据里那句 why_wrong 原话（那才是绑着英文片段讲清错在哪的），不拿「重心带偏了」这类空话顶上去 */
function gapTextOf(note, rightChoice, wrongChoice){
  var right = String(rightChoice == null ? "" : rightChoice);
  var wrong = String(wrongChoice == null ? "" : wrongChoice);
  var out = "这一屏要的是「" + right + "」这一层；「" + wrong + "」听着近，落点不在这一层。";
  var why = (note && note.why_wrong != null) ? String(note.why_wrong).trim() : "";
  if(why) out += why;
  return out;
}

/* 对应英文片段单独一句：英文原样那一截摆成一行，不和中文正文混在一起 */
function gapSpanOf(note){
  var span = (note && note.span != null) ? String(note.span).trim() : "";
  return span ? ("对应英文片段：" + span) : "";
}

/* 挂个旧词：这一屏能牵回来的旧词，连两边共享的那截字母一起给人看 */
function oldLinkOf(state, item){
  if(!state || !item) return null;
  var h = null, i;
  if(item.sentence_id != null) h = helperFor(state.data, item.sentence_id);
  if(!h || !h.old_word || h.kind === "none"){
    h = null;
    var list = (item.kind === "pool" || item.word_id == null) ? [] : sentencesIn(state.data, item.word_id);
    for(i = 0; i < list.length; i++){
      var one = helperFor(state.data, list[i].id);
      if(one && one.old_word && one.kind !== "none"){ h = one; break; }
    }
  }
  if(!h || !h.old_word) return null;
  var here = tokenWordOf(state, tokenOfItem(item));
  /* 共享字母块读数据里那一栏（字段名就是 chunk，绝大多数为空） */
  var chunk = String(h.chunk == null ? "" : h.chunk).trim();
  if(!chunk && here) chunk = commonChunk(String(h.old_word), String(here));
  /* 只剩一个字母的不算共享：宁可不提，也不拿一个字母凑数 */
  if(chunk.length < 2) chunk = "";
  return { word: String(h.old_word), chunk: chunk, note: String(h.note || "") };
}

/* 一个词在收尾屏上那一行：词名 + 它的 core_state 原句；没有原句就只写词名 */
function coreRowOf(state, token){
  var t = String(token == null ? "" : token);
  var word = tokenWordOf(state, t);
  if(!word) return null;
  var core = "";
  if(t.indexOf("w:") === 0){
    var w = wordOf(state.data, Number(t.slice(2)));
    if(w) core = String(w.core_state || "");
  }
  return { token: t, word: String(word), core: core };
}

function coreRowsOf(state, tokens){
  var out = [], i, src = tokens || [];
  for(i = 0; i < src.length; i++){
    var r = coreRowOf(state, src[i]);
    if(r) out.push(r);
  }
  return out;
}

/* ---------------- 选词页的那份账 ---------------- */
/* 记号：w:3 是预置词，p:canvas 是词表里来的词 */
function dataToken(wid){ return "w:" + String(wid); }
function poolToken(word){ return "p:" + String(word == null ? "" : word).trim().toLowerCase(); }

function tokenWordOf(state, token){
  var t = String(token || "");
  if(t.indexOf("w:") === 0){
    var w = wordOf(state.data, Number(t.slice(2)));
    return w ? String(w.spelling || "") : "";
  }
  if(t.indexOf("p:") === 0){
    var e = poolFind(state, t.slice(2));
    return e ? String(e.word || "") : "";
  }
  return "";
}

function tokenMeaningOf(state, token){
  var t = String(token || "");
  if(t.indexOf("w:") === 0){
    var w = wordOf(state.data, Number(t.slice(2)));
    return w ? String(w.common_meaning || "") : "";
  }
  if(t.indexOf("p:") === 0){
    var e = poolFind(state, t.slice(2));
    return e ? String(e.meaning || "") : "";
  }
  return "";
}

/* 这个记号能不能出句子题：预置词要句子和选项都在，词表里的词没有句子 */
function tokenCanSentence(state, token){
  var t = String(token || "");
  if(t.indexOf("w:") !== 0) return false;
  var wid = Number(t.slice(2));
  if(!sentsOf(state.data, wid).length) return false;
  return !!wordQuizOf(state.data, wid);
}

/* 状态标签：新 / 待确认 / 可用 / 需回炉 */
function tagOfToken(state, token){
  var t = String(token || "");
  if(t.indexOf("p:") === 0){
    var e = poolFind(state, t.slice(2));
    if(!e) return "新";
    return POOL_STATE_TEXT[e.state] || "新";
  }
  var st = stateRecord(state, Number(t.slice(2)));
  if(!st) return "新";
  if((st.consecutive_wrong || 0) > 0) return "需回炉";
  if((st.consecutive_right || 0) >= 2) return "可用";
  if((st.level || 0) >= 3) return "可用";
  if(!(st.consecutive_right || 0)) return "新";
  return "待确认";
}

/* 这个词背过没有：有过答的记录就算背过；从没露过面才进建议位 */
function tokenTouched(state, token){
  var st = stateRecord(state, Number(String(token || "").replace("w:", "")));
  var t = String(token || "");
  if(t.indexOf("p:") !== 0) return !!(st && ((st.level || 0) > 0 || (st.consecutive_right || 0) > 0 || (st.consecutive_wrong || 0) > 0));
  var e = poolFind(state, t.slice(2));
  return !!(e && ((e.stage || 0) > 0 || e.state === "mastered" || e.state === "upgrading" || e.state === "relearn"));
}

function tokenInfo(state, token){
  return { token: String(token || ""), word: tokenWordOf(state, token),
           meaning: tokenMeaningOf(state, token), tag: tagOfToken(state, token),
           canSentence: tokenCanSentence(state, token) };
}

/* 三摊词：建议（回炉优先 + 没背过的，最多 5 个）、预置词、词表里加进来的词 */
function pickSections(state){
  var words = (state && state.data && state.data.words) || [], i;
  var preset = [], imported = [], byToken = {};
  for(i = 0; i < words.length; i++){
    var w = words[i];
    if(!w || w.id == null) continue;
    var tok = dataToken(w.id);
    if(!sentsOf(state.data, w.id).length || !wordQuizOf(state.data, w.id)) continue;
    var one = tokenInfo(state, tok);
    one.kinds = "三种题都出";
    preset.push(one);
    byToken[tok] = one;
  }
  var poolList = poolItems(state) || [];
  for(i = 0; i < poolList.length; i++){
    var e = poolList[i];
    if(!e || !String(e.word || "").trim()) continue;
    var pt = poolToken(e.word);
    if(byToken[pt]) continue;
    var two = tokenInfo(state, pt);
    two.kinds = "只出词义题，没有句子";
    imported.push(two);
    byToken[pt] = two;
  }
  /* 建议位：先放需回炉的，再放从没背过的预置词，最多 5 个 */
  var sug = [], see = {}, rl = poolRelearnList(state) || [];
  for(i = 0; i < rl.length && sug.length < ROUND_SIZE; i++){
    var rt = poolToken(rl[i].word);
    if(byToken[rt] && !see[rt]){ sug.push(rt); see[rt] = 1; }
  }
  for(i = 0; i < preset.length && sug.length < ROUND_SIZE; i++){
    if(see[preset[i].token]) continue;
    if(tokenTouched(state, preset[i].token)) continue;
    sug.push(preset[i].token); see[preset[i].token] = 1;
  }
  return { suggest: sug, suggestItems: sug.map(function(t){ return byToken[t]; }).filter(function(x){ return !!x; }),
           preset: preset, imported: imported, all: preset.concat(imported) };
}

function defaultPickSel(state){
  return (pickSections(state).suggest || []).slice(0, ROUND_SIZE);
}

function pickSelOf(state){
  var p = state.progress || (state.progress = {});
  if(!Array.isArray(p.pickSel)){
    p.pickSel = defaultPickSel(state);
  }
  var seen = {}, out = [];
  p.pickSel.forEach(function(t){
    var k = String(t || "").trim();
    if(!k || seen[k]) return;
    if(!tokenWordOf(state, k)) return;
    seen[k] = 1; out.push(k);
  });
  p.pickSel = out;
  return out;
}

/* 勾了几个就报几局：不足 5 个就是一局，多出来的一局一局接着打 */
function pickSuggest(n){
  var cnt = Number(n) || 0;
  var rounds = cnt ? Math.ceil(cnt / ROUND_SIZE) : 0;
  var lastRound = cnt ? (cnt - rounds * ROUND_SIZE + ROUND_SIZE) : 0;
  var text;
  if(!cnt) text = "还没勾，先挑几个。";
  else if(cnt <= ROUND_SIZE) text = "已选 " + cnt + " 个 · 一局打完";
  else if(rounds === 2) text = "已选 " + cnt + " 个 · 分 2 局打完（第 2 局 " + lastRound + " 个）";
  else text = "已选 " + cnt + " 个 · 一局 " + ROUND_SIZE + " 个，建议分 " + rounds + " 局打完（最后一局 " + lastRound + " 个）";
  return { count: cnt, rounds: rounds, lastRound: lastRound, text: text,
           oneRun: cnt > ROUND_SIZE,
           mainLabel: cnt <= ROUND_SIZE ? "开始这一局" : ("打第 1 局（共 " + rounds + " 局）") };
}

/* ---------------- 一局一局打的那份账 ---------------- */
function sessOf(state){
  var ss = state && state.progress ? state.progress.session : null;
  if(!ss || !ss.flow || !ss.flow.length) return null;
  return ss;
}

function sentRoundMap(state){
  var p = state.progress || (state.progress = {});
  if(!p.sentRound || typeof p.sentRound !== "object") p.sentRound = {};
  return p.sentRound;
}

function sentRoundOf(state, token){
  var m = sentRoundMap(state), k = String(token || "");
  var v = Number(m[k]);
  return (v > 0) ? Math.floor(v) : 0;
}

/* 同样的词同样的局号，排出来的顺序是一样的；换了局就换一批位置 */
function shuffleKey(token, roundNo){
  var s = String(token || "") + "#" + String(roundNo || 1), h = 0;
  for(var i = 0; i < s.length; i++) h = (h * 131 + s.charCodeAt(i)) % 100003;
  return h;
}

/* 一局的形状：5 个词时三种形式都露脸（3 句 1 词 1 汉），且不连着三屏同形式 */
function sessionPattern(n){
  if(n >= 5) return ["sentence", "word", "sentence", "zh", "sentence"];
  if(n === 4) return ["sentence", "word", "sentence", "zh"];
  if(n === 3) return ["sentence", "word", "zh"];
  if(n === 2) return ["sentence", "word"];
  return ["sentence"];
}

/* 一屏一个词：词给这个记号，形式由这一局的排布决定 */
function sessionItemFor(state, token, form, roundNo){
  var t = String(token || ""), p = state.progress;
  var base = "R" + String(roundNo) + "|";
  if(t.indexOf("p:") === 0){
    var e = poolFind(state, t.slice(2));
    if(!e) return null;
    var pf = (form === "zh") ? "zh" : "word";
    return { kind: "pool", form: pf, word_id: null, sentence_id: null,
             pool_word: String(e.word), mid: base + pf + "|" + t };
  }
  var wid = Number(t.slice(2));
  if(!wordOf(state.data, wid)) return null;
  if(form === "sentence"){
    var sents = sentsOf(state.data, wid);
    if(!sents.length || !wordQuizOf(state.data, wid)) return null;
    var k = sentRoundOf(state, t) % sents.length;
    var sid = sents[k].id;
    if(!optionIn(state.data, sid)) return null;
    return { kind: "word", form: "sentence", word_id: wid, sentence_id: sid,
             pool_word: null, mid: base + "s|" + String(sid) };
  }
  if(!wordQuizOf(state.data, wid)) return null;
  return { kind: "word", form: form, word_id: wid, sentence_id: null,
           pool_word: null, mid: base + form + "|" + String(wid) };
}

/* 这一局的 5 屏：先把这个词按局号打散，再决定谁出句子题 */
function buildSessionFlowBatch(state, tokens, roundNo){
  var list = (tokens || []).slice(0, ROUND_SIZE), i;
  var bag = [], byTok = {};
  for(i = 0; i < list.length; i++){
    var tk = String(list[i] || ""), wd = tokenWordOf(state, tk);
    if(!wd || byTok[tk]) continue;
    byTok[tk] = 1;
    bag.push({ t: tk, k: shuffleKey(tk, roundNo), at: i });
  }
  bag.sort(function(a, b){ return (a.k - b.k) || (a.at - b.at); });
  var order = bag.map(function(x){ return x.t; });
  var n = order.length;
  var forms = sessionPattern(n);
  /* 句子屏留在原来的位置上（不挤成一串），只挑「句子还没用过」的词来坐这几个位 */
  var sentSlots = [], canSent = [];
  for(i = 0; i < n; i++){
    if(forms[i] === "sentence") sentSlots.push(i);
    if(tokenCanSentence(state, order[i])) canSent.push(i);
  }
  canSent.sort(function(a, b){
    return (sentRoundOf(state, order[a]) - sentRoundOf(state, order[b])) || (a - b);
  });
  /* 能出句子的词不够，多出来的句子位退成词义题 */
  while(sentSlots.length > canSent.length){ forms[sentSlots.pop()] = "word"; }
  /* 把挑中的词挪到句子位上，剩下的词按原顺序填别的位，三种形式照样混排 */
  if(sentSlots.length){
    var chosen = canSent.slice(0, sentSlots.length), restAt = [], rowOrder = order.slice(), reordered = [];
    for(i = 0; i < n; i++){ if(chosen.indexOf(i) < 0) restAt.push(i); }
    var next1 = 0, next2 = 0;
    for(i = 0; i < n; i++){
      if(sentSlots.indexOf(i) >= 0) reordered.push(rowOrder[chosen[next1++]]);
      else reordered.push(rowOrder[restAt[next2++]]);
    }
    order = reordered;
  }
  /* 一局里所有词表来的词摆在同一批里，词义题互相当惑项用 */
  var poolNames = [];
  for(i = 0; i < n; i++){
    if(order[i].indexOf("p:") === 0){
      var nm = tokenWordOf(state, order[i]);
      if(nm) poolNames.push(nm);
    }
  }
  var flow = [], skipped = [];
  for(i = 0; i < n; i++){
    var it = sessionItemFor(state, order[i], forms[i], roundNo);
    if(!it){ skipped.push(tokenWordOf(state, order[i])); continue; }
    if(it.kind === "pool"){ it.batch = poolNames.slice(); }
    it.seq = flow.length + 1;
    flow.push(it);
  }
  return { flow: flow, skipped: skipped };
}

/* 当前这一局该排出来的屏（外面查一局的形状都走这里） */
function buildSessionFlow(state){
  var ss = sessOf(state);
  if(!ss) return null;
  var built = buildSessionFlowBatch(state, sessionBatchTokens(state, ss.roundNo), ss.roundNo);
  return { roundNo: ss.roundNo, totalRounds: ss.totalRounds,
           flow: built.flow, skipped: built.skipped,
           words: sessionBatchTokens(state, ss.roundNo) };
}

/* 第 roundNo 局要用的那几个词：回炉词优先，剩下的按勾选顺序补 */
function sessionBatchTokens(state, roundNo){
  var ss = state.progress.session;
  if(!ss) return [];
  var words = ss.words || [];
  var from = (roundNo - 1) * ROUND_SIZE;
  var out = [], i;
  var redo = (ss.redo || []).slice();
  for(i = 0; i < redo.length && out.length < ROUND_SIZE; i++){
    if(words.indexOf(redo[i]) >= 0 && out.indexOf(redo[i]) < 0) out.push(redo[i]);
  }
  for(i = from; i < words.length && out.length < ROUND_SIZE; i++){
    if(out.indexOf(words[i]) < 0) out.push(words[i]);
  }
  for(i = 0; i < words.length && out.length < ROUND_SIZE; i++){
    if(out.indexOf(words[i]) < 0) out.push(words[i]);
  }
  return out;
}

function fillSessionRound(state, roundNo){
  var p = state.progress, ss = p.session;
  var built = buildSessionFlowBatch(state, sessionBatchTokens(state, roundNo), roundNo);
  if(ss){
    ss.roundNo = roundNo;
    ss.flow = built.flow;
    ss.seq = 0;
    ss.redo = [];
    p.session = ss;
  }
  p.seq = 0;
  p.combo = 0;
  /* 这一局的屏是重新摆开的：同号那一局之前留下的作答记录一并抹掉，
     不然一进屏就是「已答」状态，点下去不响应、只能看上一回的结果。
     按局号前缀清（这一局可能把句子换成另一句，屏的 mid 跟着变） */
  var ansMap = answersMap(state), roundTag = "R" + String(roundNo) + "|", k1;
  for(k1 in ansMap){
    if(Object.prototype.hasOwnProperty.call(ansMap, k1) && String(k1).indexOf(roundTag) === 0) delete ansMap[k1];
  }
  /* 这一局谁真出了句子题就记一笔：同一个词下一局再来，换成它的另一句 */
  var used = sentRoundMap(state), k2;
  for(k2 = 0; k2 < built.flow.length; k2++){
    var one = built.flow[k2];
    if(!one || one.kind !== "word" || one.form !== "sentence" || one.word_id == null) continue;
    var tk2 = dataToken(one.word_id);
    used[tk2] = (Number(used[tk2]) || 0) + 1;
  }
  return built;
}

/* 开局：勾的词按 5 个一段切开，一局一局打；mode=all 就是一口气把勾的全打完 */
function startSession(state, tokens, mode){
  var all = [], i;
  var src = (tokens && tokens.length) ? tokens : pickSelOf(state);
  for(i = 0; i < src.length; i++){
    var tk = String(src[i] || ""), wd = tokenWordOf(state, tk);
    if(!wd) continue;
    if(all.indexOf(tk) < 0) all.push(tk);
  }
  if(!all.length) return { ok: false, reason: "没勾词", rounds: 0, screens: 0 };
  var totalRounds = Math.max(1, Math.ceil(all.length / ROUND_SIZE));
  var p = state.progress;
  p.session = { words: all, roundNo: 1, totalRounds: totalRounds, flow: [], seq: 0,
                mode: (mode === "all" ? "all" : "one"), redo: [] };
  p.screen = "Q";
  p.sessNote = "";
  var built = fillSessionRound(state, 1);
  return { ok: built.flow.length > 0, rounds: totalRounds, screens: built.flow.length,
           words: all.length, skipped: built.skipped };
}

/* 本局打完点「下一局」：下一段词换一批 5 个 */
function advanceSessionRound(state){
  var ss = state.progress.session;
  if(!ss) return null;
  var next = (ss.roundNo || 1) + 1;
  if(next > (ss.totalRounds || 1)){ endSession(state, "done"); return null; }
  return fillSessionRound(state, next);
}

/* 一局打完还留着的提示：sessNote / session 都清掉，人选词页重新挑 */
function endSession(state, note){
  var p = state.progress;
  p.session = null;
  p.screen = "PICK";
  p.seq = 0;
  p.combo = 0;
  p.sessNote = String(note || "done");
}

/* 旧存档里的局：形状补齐，屏位置对不上就回到这一局开头 */
function normalizeSession(state){
  var p = state && state.progress;
  if(!p) return;
  var ss = p.session;
  if(!ss || typeof ss !== "object"){ p.session = null; return; }
  if(!Array.isArray(ss.words) || !ss.words.length){ p.session = null; return; }
  ss.words = ss.words.map(function(t){ return String(t || ""); }).filter(function(t){ return !!t; });
  if(!Array.isArray(ss.flow)) ss.flow = [];
  ss.flow = ss.flow.filter(function(x){ return !!x && !!x.mid; });
  if(typeof ss.roundNo !== "number" || ss.roundNo < 1) ss.roundNo = 1;
  if(typeof ss.totalRounds !== "number" || ss.totalRounds < 1) ss.totalRounds = Math.max(1, Math.ceil(ss.words.length / ROUND_SIZE));
  if(!Array.isArray(ss.redo)) ss.redo = [];
  ss.mode = (ss.mode === "all") ? "all" : "one";
  if(!ss.flow.length){
    var built = buildSessionFlowBatch(state, sessionBatchTokens(state), ss.roundNo);
    ss.flow = built.flow;
    ss.seq = 0;
  }
  var q = (typeof ss.seq === "number" && ss.seq >= 0) ? Math.floor(ss.seq) : 0;
  if(q > ss.flow.length - 1) q = ss.flow.length - 1;
  ss.seq = q;
  p.session = ss;
  if(!p.sentRound || typeof p.sentRound !== "object") p.sentRound = {};
  if(typeof p.lastQuip !== "number") p.lastQuip = -1;
}

/* 答偏之后这一屏重排：池里的词就接在本局末尾再过一遍 */
function sessionRedo(state, token){
  var ss = sessOf(state);
  if(!ss) return 0;
  var t = String(token || "");
  if(ss.words.indexOf(t) < 0) return 0;
  for(var i = 0; i < ss.flow.length; i++){
    if(String(ss.flow[i].mid).indexOf("|" + t) >= 0 && !ss.flow[i].redo) return 0;
  }
  var cut = (ss.roundNo - 1) * ROUND_SIZE;
  var it = { kind: "pool", form: "word", word_id: null, sentence_id: null,
             pool_word: tokenWordOf(state, t), redo: 1, seq: ss.flow.length + 1,
             mid: "RX" + String(ss.roundNo) + "|" + t };
  if(!it.pool_word) return 0;
  var names = [];
  for(var j = 0; j < ss.words.length; j++){ if(ss.words[j].indexOf("p:") === 0) names.push(tokenWordOf(state, ss.words[j])); }
  it.batch = names;
  ss.flow.push(it);
  return 1;
}

/* 代码级校验的取源：把页面脚本取出来、把 DATA 那一段剥掉，剩下的才是真代码。
   不剥 DATA 的话，清单里写的实现标志会被数据自己命中，校验等于空跑。 */
function scriptSource(){
  var out = "";
  var ss = document.getElementsByTagName("script");
  for(var i = 0; i < ss.length; i++){
    out += String(ss[i].textContent || "") + "\n";
  }
  var a = out.indexOf("var DATA = ");
  if(a >= 0){
    var b = out.indexOf("\n};", a);
    if(b > a) out = out.slice(0, a) + out.slice(b + 2);
  }
  return out;
}

try {

function defaultState(){

    data: JSON.parse(JSON.stringify(DATA)),
    progress: { seq: 0, screen: "PICK", answers: {}, words: {},
                tail: [], tailFrom: null, redo_seq: 0,
                drill: { word: "", meaning: "", pos: "", seen: 0 },
                /* 一局一局打的那份账；没有局的时候是 null */
                session: null,
                /* 选词页勾了哪些词，默认先勾 5 个 */
                pickSel: null,
                /* 上一次夸人的那句话的位次，用来保证不连着出同一句 */
                lastQuip: -1,
                /* 每个词上一回出的是第几句，同一个词再遇到就换一句 */
                sentRound: {},
                /* 连着答中的次数 */
                combo: 0,
                /* 每个词累计认下来几次：只做次数回响，不参与档位、不参与排题 */
                hits: {},

}

function buildExport(state){ return JSON.stringify(state, null, 2); }

function sentencesIn(data, wordId){
  return (data.sentences || [])
    .filter(function(s){ return s.word_id === wordId; })
    .sort(function(a, b){ return a.id - b.id; });
}

function optionIn(data, sentenceId){
  var list = data.options || [];
  for(var i = 0; i < list.length; i++){ if(list[i].sentence_id === sentenceId) return list[i]; }
  return null;
}

function normalizeProgress(state){
  if(!state || typeof state !== "object") return state;
  if(!state.progress || typeof state.progress !== "object"){
    state.progress = { seq: 0, screen: "PICK", answers: {}, words: {} };
  }
  var p = state.progress;
  /* 一局一局的进度先规整，下面算流程要用到它 */
  normalizeSession(state);
  /* 后接的那批屏先规整，再算整份流程 */
  if(!Array.isArray(p.tail)) p.tail = [];
  p.tail = p.tail.filter(function(x){ return x && x.mid && x.form; });
  if(!p.tail.length){ p.tail = []; p.tailFrom = null; }
  if(typeof p.tailFrom !== "number" || p.tailFrom < 0 || p.tailFrom > 100000) p.tailFrom = null;
  if(typeof p.redo_seq !== "number" || p.redo_seq < 0) p.redo_seq = 0;
  var f = flowList(state);
  if(SCREENS.indexOf(p.screen) < 0) p.screen = sessOf(state) ? "Q" : "PICK";
  /* 没有这一局的时候，勾选状态先按默认 5 个铺好 */
  if(!Array.isArray(p.pickSel)) p.pickSel = defaultPickSel(state);
  p.pickSel = p.pickSel.map(function(t){ return String(t || ""); }).filter(function(t){ return !!t; });
  if(typeof p.lastQuip !== "number") p.lastQuip = -1;
  if(!p.sentRound || typeof p.sentRound !== "object" || Array.isArray(p.sentRound)) p.sentRound = {};
  if(typeof p.combo !== "number" || p.combo < 0) p.combo = 0;
  if(typeof p.sessNote !== "string") p.sessNote = "";
  /* 每个词的次数账：坏值一律清掉，只留正整数 */
  if(!p.hits || typeof p.hits !== "object" || Array.isArray(p.hits)) p.hits = {};
  (function(){
    var k;
    for(k in p.hits){
      if(!Object.prototype.hasOwnProperty.call(p.hits, k)) continue;
      var v = Number(p.hits[k]);
      if(!isFinite(v) || v <= 0) delete p.hits[k];
      else p.hits[k] = Math.floor(v);
    }
  })();
  /* 勾选状态留下的记号必须现在还能对上词，对不上的摘掉 */
  if(Array.isArray(p.pickSel)){
    p.pickSel = p.pickSel.map(function(t){ return String(t || ""); })
      .filter(function(t){ return !!t && !!tokenWordOf(state, t); });
  }
  var seq = (typeof p.seq === "number" && p.seq >= 0) ? Math.floor(p.seq) : 0;
  if(f.length && seq > f.length - 1) seq = f.length - 1;
  if(!f.length) seq = 0;
  p.seq = seq;
  if(!p.answers || typeof p.answers !== "object") p.answers = {};
  /* 直背通道的进度：跟做题各走各的，互不顶掉 */
  if(!p.drill || typeof p.drill !== "object") p.drill = { word: "", meaning: "", pos: "", seen: 0 };
  if(typeof p.drill.seen !== "number" || !isFinite(p.drill.seen) || p.drill.seen < 0) p.drill.seen = 0;
  p.drill.word = String(p.drill.word == null ? "" : p.drill.word);
  p.drill.meaning = String(p.drill.meaning == null ? "" : p.drill.meaning);
  p.drill.pos = String(p.drill.pos == null ? "" : p.drill.pos);
  if(!p.words || typeof p.words !== "object") p.words = {};
  return state;
}

/* 内容一律以代码里的 DATA 为准：本地存储只留进度和词池 */
function codeData(){ return JSON.parse(JSON.stringify(DATA)); }
function isPlainObject(o){ return !!o && typeof o === "object" && !Array.isArray(o); }

/* 旧版把整份 data 也写进了本地存储，正是它顶掉了新版 DATA：
   这里只把进度和词池接过来，data 段直接丢弃，按代码里的 DATA 重建 */
function migrateStoredState(raw){
  var o = raw;
  if(typeof raw === "string"){
    try { o = JSON.parse(raw); } catch(e){ return null; }
  }
  if(!isPlainObject(o)) return null;
  var prog = isPlainObject(o.progress) ? o.progress
           : (isPlainObject(o.state) && isPlainObject(o.state.progress) ? o.state.progress : null);
  var pool = isPlainObject(o.pool) ? o.pool
           : (isPlainObject(o.state) && isPlainObject(o.state.pool) ? o.state.pool : null);
  /* 整份导出就是把进度直接摊在根上的老格式 */
  if(!prog) prog = {};
  var st = { data: codeData(), progress: JSON.parse(JSON.stringify(prog)), pool: { items: [] } };
  if(pool && Array.isArray(pool.items) && pool.items.length){
    st.pool.items = pool.items.slice();
  }
  return st;
}

/* 本地存储/导入都走这里：进度原样接上，内容换回代码里的 DATA */
function restoreState(raw){
  var st = migrateStoredState(raw);
  if(!st) return null;
  return normalizePool(normalizeProgress(st));
}

function parseImport(text){
  var o = JSON.parse(text);
  if(!o || typeof o !== "object") throw new Error("shape");
  if(!isPlainObject(o.progress) && !isPlainObject(o.state)) throw new Error("shape");
  /* 新版导出里只有进度和词池，没有 data 也认：内容照样按代码里的 DATA 重建 */
  var st = migrateStoredState(o);
  if(!st) throw new Error("shape");
  return restoreState(o);
}

/* 落盘只写进度和词池：内容永远从代码里的 DATA 取，不再把 data 写回本地 */

function escapeHtml(t){
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function markWord(text, word){
  var html = escapeHtml(text);
  var w = String(word || "");
  if(!w) return html;
  var re = new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\w*", "ig");
  return html.replace(re, function(m){ return "<b>" + m + "</b>"; });
}

      b.addEventListener("click", function(){
        drillSetMode(S, m.id);
        save(); render();
      });
      mbar.appendChild(b);
    })(DRILL_MODES[mi]);
  }
  stage.appendChild(mbar);
  stage.appendChild(el("div", "dmodehint",
    "现在是「" + st.modeName + "」：" + st.modeHint + "。5 种背法进度各存一份，换着背也不会互相顶掉，一律不计分。"));

  if(!st.word){
    stage.appendChild(el("div", "headline", "还没挑词"));
    stage.appendChild(el("div", "ask", "从词表或帮手区里每个词后面的「直背」点进来，挑一个要硬背的。"));
    var b0 = el("button", "primary", "去词表挑词");
    b0.addEventListener("click", function(){ goPointer({ seq: S.progress.seq, screen: "WORDS" }); });
    stage.appendChild(b0);
    return;
  }

  if(st.done){
    stage.appendChild(el("div", "headline", st.word + " · 「" + st.modeName + "」走过一遍"));
    stage.appendChild(el("div", "ask",
      "5 种背法已经走过 " + st.modesDone + " 种。换一种接着来，各走各的，全程不计分。"));
    var again = el("button", "", "这一种再走一遍");
    again.addEventListener("click", function(){ drillReset(S); save(); render(); });
    var nxt = el("button", "", "换下一种背法");
    nxt.addEventListener("click", function(){
      drillSetMode(S, DRILL_MODES[st.modeIdx % DRILL_MODES.length].id);
      save(); render();
    });
    var bk = el("button", "primary", "回去接着做题");
    bk.addEventListener("click", function(){ goBackFromDrill(); });
    stage.appendChild(again);
    stage.appendChild(nxt);
    stage.appendChild(bk);
    return;
  }

  stage.appendChild(el("div", "drillstep",
    "「" + st.modeName + "」第 " + st.phaseIdx + " 步 / 共 " + st.phases + " 步 · 5 种背法走过 " + st.modesDone + " 种"));

  /* 给首字母的背法先不露整词，其它几种照常给词 */
  var row = el("div", "drillrow");
  if(st.mode === "M5" && st.step === 0){
    row.appendChild(el("div", "wordbig", st.firstLetter + " · · ·"));
    row.appendChild(el("div", "drillhint", "首字母给你了，剩下的自己拼"));
  } else {
    row.appendChild(el("div", "wordbig", st.word));
    row.appendChild(el("div", "drillhint", "硬背 · 不给句子"));
  }
  stage.appendChild(row);
  if(st.pos) stage.appendChild(el("div", "wordpos", st.pos));

  if(st.mode === "M3" || st.mode === "M4"){
    if(st.mode === "M3") stage.appendChild(el("div", "meaningbox", st.stem));
    stage.appendChild(el("div", "ask",
      st.mode === "M3" ? "这四个词里，哪个对上这层意思？" : "这个词在这四条汉语里对上哪一条？"));
    var opts = el("div", "dopts");
    for(var oi = 0; oi < st.options.length; oi++){
      (function(idx, txt){
        var on = (st.pick === idx);
        var ob = el("button", on ? "dopt on" : "dopt", txt);
        ob.addEventListener("click", function(){ drillPick(S, idx); save(); render(); });
        opts.appendChild(ob);
      })(oi, st.options[oi]);
    }
    stage.appendChild(opts);
    if(st.pick != null){
      stage.appendChild(el("div", "drillreveal",
        "你挑的是「" + st.options[st.pick] + "」；这个词写成 " + st.word + "，意思是 " + st.meaning + "。念两遍就记下了。"));
    }
  } else if(st.mode === "M5"){
    stage.appendChild(el("div", "drillmean", st.meaning));
    if(st.step === 0){
      var inp = el("input", "drillinput");
      inp.value = st.typed || "";
      inp.addEventListener("input", function(){ drillTyped(S, inp.value); });
      stage.appendChild(el("div", "ask", "把整个词拼出来，拼完点「比一比」当场显影对照。"));
      stage.appendChild(inp);
    } else {
      stage.appendChild(el("div", "drillreveal",
        "你打的是「" + (st.typed || "（空着）") + "」；这个词写成 " + st.word + "。" + st.meaning));
    }
  } else {
    stage.appendChild(el("div", st.showMeaning ? "drillmean" : "drillmean hold",
      st.showMeaning ? st.meaning : "先不看释义，自己在心里过一遍"));
  }

  var carryList = (st.carry || []).filter(function(x){
    return x && String(x).trim() && String(x).toLowerCase() !== String(st.word).toLowerCase();
  });
  if(carryList.length){
    stage.appendChild(el("div", "drillhint", "顺带记：它和旧词「" + carryList[0] + "」共享一段字母，来回念两遍更牢"));
  }
  if(st.needPick) stage.appendChild(el("div", "drillhint", "先在上面挑一项，再往下走。"));

  var nx = el("button", "primary", st.actionText);
  nx.addEventListener("click", function(){ drillAdvance(S); save(); render(); });
  stage.appendChild(nx);
  var qu = el("button", "", "先回去做题");
  qu.addEventListener("click", function(){ goBackFromDrill(); });
  stage.appendChild(qu);
}

/* 讲解例句取自数据：句子形式用本句，词形式用这个词的第一句；没有就当没有 */
function exampleOf(face){
  if(!face) return "";
  if(face.form === "sentence" && face.sentence) return String(face.sentence.text || "");
  if(face.word && face.word.id != null){
    var list = sentsOf(S.data, face.word.id);
    return list.length ? String(list[0].text || "") : "";
  }
  return "";
}

var screenT0 = 0;

function goPointer(ptr){
  S.progress.seq = ptr.seq;
  S.progress.screen = ptr.screen;
  save();
  render();
}

/* 帮手按钮上的角标：今天有可带回的旧词才亮 */
function paintBadge(){
  var btn = $("btnHome");
  var due = poolStats(S).due;
  btn.textContent = "帮手区";
  if(due > 0){
    btn.className = "on";
    var b = el("span", "badge", String(due));
    btn.appendChild(b);
  } else {
    btn.className = "";
  }
}

/* 答完题按钮出现时，把人带到能看见它的位置，并留出底部横条/工具栏的地儿：
   不这么带一下，按钮就贴着视口底边出现，全面屏上会被那条横条压住一截 */
function revealBottom(btn){
  if(!btn) return;
  var run = function(){
    try{
      var r = btn.getBoundingClientRect();
      var vh = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
      var pad = 32;
      if(!vh) return;
      if(r.bottom > vh - pad){
        var d = r.bottom - (vh - pad);
        try{ window.scrollBy({ top: d, left: 0, behavior: "smooth" }); }
        catch(e){ window.scrollBy(0, d); }
      }
    }catch(e){}
  };
  if(window.requestAnimationFrame) window.requestAnimationFrame(run);
  else setTimeout(run, 0);
}

/* ================= 渲染 ================= */
function render(keepY){
  var stage = $("stage");
  stage.innerHTML = "";
  normalizeProgress(S);
  normalizePool(S);
  $("wordIndex").textContent = barText(S);
  var pst = poolStats(S);
  $("poolLine").textContent = "旧词池 " + pst.total + " 个 · 今天要带回 " + pst.due + " 个";
  paintBadge();
  /* 备份入口只摆在帮手区底部：别的屏不占地方，顶上那一排也不放这些 */
  var bRow = $("backupRow");
  if(bRow){
    if(S.progress.screen === "HOME") bRow.hidden = false;
    else { bRow.hidden = true; $("ioPanel").hidden = true; }
  }
  if(S.progress.screen === "PICK") renderPick(stage);
  else if(S.progress.screen === "HOME") renderHome(stage);
  else if(S.progress.screen === "WORDS") renderWords(stage);
  else if(S.progress.screen === "ROUND") renderRound(stage);
  else if(S.progress.screen === "HELPER") renderEnd(stage);
  else if(S.progress.screen === "DRILL") renderDrill(stage);
  else renderQuestion(stage);
  screenT0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  var fb = $("btnFeatureBack");
  if(fb) fb.hidden = !(featureJumpAt && S.progress.screen === featureJumpAt.screen && S.progress.screen !== "HOME");
  /* 换屏一律回顶部；只有「就地勾词」这类操作传 keepY 把原来的滚动位置放回去 */
  window.scrollTo(0, (typeof keepY === "number" && keepY > 0) ? keepY : 0);
}

/* 选偏时逐个说清：这一项偏在哪、对上的是英文里哪个片段 */
function noteList(choices, notes, correctIdx, skipIdx){
  var box = el("div", "notebox");
  for(var i = 0; i < choices.length; i++){
    if(i === correctIdx) continue;
    if(typeof skipIdx === "number" && i === skipIdx) continue;
    var n = notes && notes[i];
    var row = el("div", "noterow");
    row.appendChild(el("div", "ntext", "「" + choices[i] + "」"));
    if(n){
      row.appendChild(el("div", "nwhy", "偏在：" + n.why_wrong));
      row.appendChild(el("div", "nspan", "对应英文：" + n.span));
    } else {
      row.appendChild(el("div", "nwhy", "这一项不进这句的意思。"));
    }
    box.appendChild(row);
  }
  return box;
}

/* 一局小结与整轮收尾都按词把 core_state 原句列出来：看着自己走过了哪些意思 */
function appendCoreList(stage, tokens, title){
  var rows = coreRowsOf(S, tokens);
  if(!rows.length) return;
  var box = el("div", "corelist");
  box.appendChild(el("div", "kicker2", title || "按词对一遍，走过这些意思"));
  for(var i = 0; i < rows.length; i++){
    var row = el("div", "corerow");
    row.appendChild(el("div", "coreword", rows[i].word));
    if(rows[i].core) row.appendChild(el("div", "corestate", rows[i].core));
    box.appendChild(row);
  }
  stage.appendChild(box);
}

var gapSkips = 0;

function renderQuestion(stage){
  var item = screenAt(S);
  if(!item){ goPointer({ seq: S.progress.seq, screen: "HELPER" }); return; }
  var face = faceAt(S, item);
  var done = answerOf(S, item.mid);

  stage.appendChild(el("div", "kicker", juggleText(S)));

  var choices = [], correctIdx = 0, askText = "", cardTitle = "", notes = [];
  /* 答中时讲解是折起来的：这一屏展开过没有，只活到下一次重渲染 */
  var foldOpen = false;

  /* 兜底：缺选项 / 缺释义 / 缺句子 / 句里锚不出这个词，这一屏就不出，绝不空着硬凑 */
  var gap = screenGap(S, item);
  if(gap || !face || !face.choices || !face.choices.length){
    gapSkips += 1;
    $("ioTip").textContent = "这一屏的内容不全（" + (gap || "题面取不到") + "），先跳到下一屏。";
    if(gapSkips > 60){ gapSkips = 0; goPointer({ seq: S.progress.seq, screen: "HELPER" }); return; }
    goPointer(nextPointer(S));
    return;
  }
  gapSkips = 0;

  if(face.form === "sentence"){
    var s = face.sentence;
    stage.appendChild(el("div", "kicker2", "这句 " + s.word_count + " 词"));
    var line = el("div", "sentence");
    /* 锚点：句里真正承载这个词的那一段高亮，insisted / insists 也能锚回 insist */
    line.innerHTML = anchorHtml(s.text, face.word ? face.word.spelling : "");
    stage.appendChild(line);
    askText = "这句里它落成哪个意思？";
    choices = face.choices.slice();
    correctIdx = face.correct;
    notes = face.notes;
    cardTitle = "这句里它落成：" + face.option.grounded_meaning;
  } else if(face.form === "word"){
    stage.appendChild(el("div", "wordbig", face.quiz.stem));
    stage.appendChild(el("div", "wordpos", (face.word && face.word.pos) ? face.word.pos : ""));
    askText = "这个词本身是哪个意思？";
    choices = face.choices.slice();
    correctIdx = face.correct;
    notes = face.notes;
    cardTitle = "它的意思是：" + face.quiz.meaning_zh;
  } else {
    stage.appendChild(el("div", "kicker2", "只看意思，从四个词里挑一个能对上的"));
    stage.appendChild(el("div", "meaningbox", face.quiz.meaning_zh));
    askText = "这四个词里，哪个对上这层意思？";
    choices = face.choices.slice();
    correctIdx = face.correct;
    notes = face.notes;
    cardTitle = "对上的是：" + face.quiz.stem + "（" + face.quiz.meaning_zh + "）";
  }

  stage.appendChild(el("div", "ask", askText));

  /* 方法入口：每一屏都能一键调出「这个词该用什么方法记」，内容是当场从账本里取的，不是写死一段字 */
  var mplan = methodPlan(S, item);
  var mbtn = el("button", "methodbtn", "我有个办法 · 看记法");
  var mbox = el("div", "methodbox");
  mbox.hidden = true;
  if(mplan.lines && mplan.lines.length){
    for(var mi = 0; mi < mplan.lines.length; mi++){
      mbox.appendChild(el("div", "mline", mplan.lines[mi].t));
    }
  } else {
    mbox.appendChild(el("div", "mline", "这一屏没有现成的记法，按词块自己拆一遍。"));
  }
  if(mplan.mine && String(mplan.mine.meaning || "").trim()){
    var djump = el("button", "drilljump", "这个词我就是要硬背，别给我编故事");
    djump.addEventListener("click", function(){ jumpDrill(mplan.mine, { seq: S.progress.seq, screen: "Q" }); });
    mbox.appendChild(djump);
  }
  /* 点开要有看得见的变化：按钮文字切换、上面出一行提示、下面展开记法 */
  var mhint = el("div", "mhint", "点开就能看：下面这块就是这一屏的记法，看完点「收起记法」收起来。");
  mhint.hidden = true;
  mbtn.addEventListener("click", function(){
    var open = mbox.hidden;
    mbox.hidden = !open;
    mhint.hidden = !open;
    mbtn.textContent = open ? "收起记法" : "我有个办法 · 看记法";
    mbtn.className = open ? "methodbtn on" : "methodbtn";
  });
  stage.appendChild(mbtn);
  stage.appendChild(mhint);
  stage.appendChild(mbox);

  /* 诱饵：这句能带回旧词时挂一个看得见的标签，点开只说是哪个旧词，不透新词意思 */
  var bait = (face.form === "sentence") ? baitFor(S, item.sentence_id) : null;
  var hbox = null;
  if(bait){
    var tag = el("button", "bait", "这句有个旧词能带回 · 点开看看");
    var bbox = el("div", "baitbox");
    bbox.hidden = true;
    bbox.appendChild(el("div", "baitword", "旧词：" + bait.help.old_word));
    bbox.appendChild(el("div", "baitmeta", POOL_STATE_TEXT[bait.entry.state] + " · 第 " + ((bait.entry.stage || 0) + 1) + " 档"));
    tag.addEventListener("click", function(){ bbox.hidden = !bbox.hidden; });
    stage.appendChild(tag);
    stage.appendChild(bbox);
  }

  /* 回显之后给一行帮手提示：这句里用得上哪个旧词、怎么用上的（答完才出，不提前透） */
  if(done && done.helper){
    hbox = el("div", "helperline");
    hbox.hidden = false;
    hbox.appendChild(el("div", "hl-tag", "帮手"));
    var htext = el("div", "hl-text");
    htext.innerHTML = helperLineHtml(done.helper);
    hbox.appendChild(htext);
  }

  var wrap = el("div", "choices");
  var fb = el("div", "feedback", "");
  var card = el("div", "anscard");
  var nextBtn = el("button", "primary", nextLabel(S));
  fb.hidden = true; card.hidden = true; nextBtn.hidden = true;

  choices.forEach(function(txt, i){
    var b = el("button", "choice", txt);
    if(done) b.disabled = true;
    b.addEventListener("click", function(){
      if(answerOf(S, item.mid)) return;
      var ms = Math.round(((typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now()) - screenT0);
      var right = (i === correctIdx);
      var guess = isGuess(ms, right);
      /* 这句能带回的旧词先照下来，回显时用（判完档位会往前推，之后就不再算「今天要带回」） */
      var baitNow = (face.form === "sentence") ? baitFor(S, item.sentence_id) : null;
      answersMap(S)[item.mid] = { chosen: i, correct: right, ms: ms, suspected_guess: guess,
        helper: baitNow ? baitNow.help : null };
      var st = stateRecord(S, item.word_id);
      if(st && guess){
        st.suspected_guess = (st.suspected_guess || 0) + 1;
        st.guess_sentences = (st.guess_sentences || []).concat([item.sentence_id || item.mid]);
      }
      /* 这个词自己的账本：连着偏了几次、连到第几档，写进 states */
      if(item.kind === "pool") markWordState(poolFind(S, item.pool_word), right);
      else markWordState(st || stateRecord(S, item.word_id), right);
      if(face.form === "sentence"){
        var bait = baitFor(S, item.sentence_id);
        if(bait) applyHelperOutcome(S, bait.help.old_word, right);
      }
      if(item.kind === "pool") applyHelperOutcome(S, item.pool_word, right);
      /* 连着答中的次数：只用来让夸人的话别一直一个调子 */
      S.progress.combo = right ? ((S.progress.combo || 0) + 1) : 0;
      /* 这个词一共认下来几次：只用来做那句次数回响，不参与档位、不参与排题 */
      if(right) bumpHit(S, tokenOfItem(item));
      /* 答偏：这个词从它的第一题重新来过，排在下一屏 */
      if(!right) applyRedo(S, item, S.progress.seq || 0);
      save();
      render();
    });
    wrap.appendChild(b);
  });
  stage.appendChild(wrap);

  if(done){
    for(var i = 0; i < wrap.children.length; i++) wrap.children[i].disabled = true;
    if(wrap.children[correctIdx]) wrap.children[correctIdx].className = "choice good";
    if(done.chosen !== correctIdx && wrap.children[done.chosen]) wrap.children[done.chosen].className = "choice info";
    if(done.correct){
      /* 答中：长解释整块先收起，只留一句夸人的话。这句话按题型从池子里挑，不跟上一次重 */
      if(!done.quip) done.quip = quipFor(S, face.form, choices, correctIdx, S.progress.combo || 1);
      fb.className = "feedback quipline";
      fb.textContent = done.quip;
      fb.hidden = false;
      /* 同一个词第二回认下来，就先说清这是第几次，不再重复那句泛夸 */
      var nthLine = hitLine(hitsOf(S, tokenOfItem(item)));
      if(nthLine) card.appendChild(el("div", "hitline", nthLine));
      /* 答中那一行意思就够；逐个错因一律折进去，想看得自己点开 */
      card.appendChild(el("div", "mean", cardTitle));
      if(face.form !== "sentence" && face.quiz.answer_note){
        card.appendChild(el("div", "submean", face.quiz.answer_note));
      }
      var whyBox = null;
      var fillWhy = function(){
        if(whyBox) return;
        var exH = exampleHtml(exampleOf(face), face.word ? face.word.spelling : (face.pool ? face.pool.word : ""));
        whyBox = el("div", "notebox");
        if(exH){
          var exR = el("div", "exline");
          exR.innerHTML = "例句：" + exH;
          whyBox.appendChild(exR);
        }
        whyBox.appendChild(noteList(choices, notes, correctIdx));
        card.appendChild(whyBox);
      };
      var foldBtn = el("button", "foldbtn" + (foldOpen ? " on" : ""), foldOpen ? "收起讲解" : "想看看为什么");
      card.appendChild(foldBtn);
      if(foldOpen) fillWhy();
      foldBtn.addEventListener("click", function(){
        foldOpen = !foldOpen;
        fillWhy();
        whyBox.hidden = !foldOpen;
        foldBtn.textContent = foldOpen ? "收起讲解" : "想看看为什么";
        foldBtn.className = "foldbtn" + (foldOpen ? " on" : "");
      });
      card.hidden = false;
      nextBtn.hidden = false;
      revealBottom(nextBtn);
    } else {
      fb.className = "feedback";
      fb.textContent = "这句是另一个意思，看下：";
      fb.hidden = false;
      /* 这一屏要的落点先放大看清楚，别的都往后放 */
      card.appendChild(el("div", "mean meanbig", cardTitle));
      if(face.form !== "sentence" && face.quiz.answer_note){
        card.appendChild(el("div", "submean", face.quiz.answer_note));
      }
      /* 讲解里的例句一律带锚点 span；锚不出这个词就不挂例句，绝不拿半句硬凑 */
      var exHtml = exampleHtml(exampleOf(face), face.word ? face.word.spelling : (face.pool ? face.pool.word : ""));
      if(exHtml){
        var exRow = el("div", "exline");
        exRow.innerHTML = "例句：" + exHtml;
        card.appendChild(exRow);
      }
      /* 只讲点下去的那一项：跟这一屏要的那项差在哪儿，讲清就够 */
      var chosenAt = (typeof done.chosen === "number") ? done.chosen : 0;
      var gapNote = notes ? notes[chosenAt] : null;
      var gapBox = el("div", "whybox2");
      gapBox.appendChild(el("div", "wlab", "跟它差在哪"));
      gapBox.appendChild(el("div", "wtxt", gapTextOf(gapNote, choices[correctIdx], choices[chosenAt])));
      /* 英文那一截单独一行，看得见它到底挂在哪 */
      var gapSpan = gapSpanOf(gapNote);
      if(gapSpan) gapBox.appendChild(el("div", "wspan", gapSpan));
      card.appendChild(gapBox);
      /* 挂个旧词：旧词 + 现成那句解释（主说明），共享的那截字母有两字以上才提 */
      var oldBox = el("div", "oldbox");
      oldBox.appendChild(el("div", "oldlab", "挂个旧词"));
      var oldLink = oldLinkOf(S, item);
      if(oldLink){
        var oldTxt = "「" + oldLink.word + "」把它拽过来一起看。";
        if(oldLink.note) oldTxt += oldLink.note;
        if(oldLink.chunk) oldTxt += "两边还带着「" + oldLink.chunk + "」这一截字母。";
        oldBox.appendChild(el("div", "oldtxt", oldTxt));
      } else {
        oldBox.appendChild(el("div", "oldtxt", "这一屏没有现成的旧词可挂，按上面那处差别记这一回就够。"));
      }
      card.appendChild(oldBox);
      /* 一句情绪价值：不评判、不催，也不过度安慰 */
      card.appendChild(el("div", "kindly", kindlyFor(S)));
      /* 别的几项折起来：想看得自己点开，不在一屏里堆满 */
      if(choices.length > 2){
        var othersBox = el("div", "notebox");
        othersBox.appendChild(noteList(choices, notes, correctIdx, chosenAt));
        othersBox.hidden = true;
        var othersBtn = el("button", "othersbtn", "别的选项差在哪（" + (choices.length - 2) + " 项）");
        othersBtn.addEventListener("click", function(){
          othersBox.hidden = !othersBox.hidden;
          othersBtn.textContent = othersBox.hidden ? ("别的选项差在哪（" + (choices.length - 2) + " 项）") : "把别的选项收起来";
        });
        card.appendChild(othersBtn);
        card.appendChild(othersBox);
      }
      card.hidden = false;
      nextBtn.hidden = false;
      revealBottom(nextBtn);
    }
  }

  nextBtn.addEventListener("click", function(){ goPointer(nextPointer(S)); });
  stage.appendChild(fb);
  stage.appendChild(card);
  if(hbox) stage.appendChild(hbox);
  stage.appendChild(nextBtn);
}

/* 本局小结：一局 5 屏走完的换气屏，不做任何检验 */
function renderRound(stage){
  var ss = sessOf(S);
  var i = S.progress.seq || 0;
  if(ss){
    var words = [], wi;
    for(wi = 0; wi < ss.flow.length; wi++){
      var nm = tokenWordOf(S, ss.flow[wi].kind === "pool" ? poolToken(ss.flow[wi].pool_word) : dataToken(ss.flow[wi].word_id));
      if(nm && words.indexOf(nm) < 0) words.push(nm);
    }
    stage.appendChild(el("div", "kicker", "第 " + ss.roundNo + "/" + ss.totalRounds + " 局"));
    stage.appendChild(el("div", "headline", "这局 " + words.length + " 个词走完了"));
    if(words.length) stage.appendChild(el("div", "picksum", "这一局：" + words.join(" · ")));
    /* 这一局的词按 core_state 原句过一遍，收个尾 */
    appendCoreList(stage, tokensOfFlow(S, ss.flow), "这局走过这些意思");

    var last = (ss.roundNo >= ss.totalRounds);
    if(last){
      stage.appendChild(el("div", "ask", "勾的词都打完了，回选词页可以接着挑别的。"));
      /* 整轮走完：一次弄完的才需要把整趟的词再对一遍（一局就打完的不重复列） */
      if(ss.totalRounds > 1) appendCoreList(stage, ss.words.slice(), "整轮走完，按词对一遍");
    } else {
      var nx = sessionBatchTokens(S, ss.roundNo + 1), names = [];
      for(wi = 0; wi < nx.length; wi++){
        var one = tokenWordOf(S, nx[wi]);
        if(one) names.push(one);
      }
      stage.appendChild(el("div", "ask", "站起来松松肩、看一眼窗外。"));
      if(names.length) stage.appendChild(el("div", "picksum", "下一局从这 " + names.length + " 个词开始：" + names.join(" · ")));
      if(ss.mode === "all") stage.appendChild(el("div", "pickhint", "这一趟选的是一次弄完，接着打就行。"));
    }

    var label = last ? "换几个词（回选词页）" : ("下一局（第 " + (ss.roundNo + 1) + " 局 / 共 " + ss.totalRounds + " 局）");
    var btn = el("button", "primary", label);
    btn.addEventListener("click", function(){
      if(last){ endSession(S, "done"); save(); goPointer({ seq: 0, screen: "PICK" }); return; }
      var built = advanceSessionRound(S);
      save();
      if(built && built.flow.length){ goPointer({ seq: 0, screen: "Q" }); return; }
      goPointer({ seq: 0, screen: "PICK" });
    });
    stage.appendChild(btn);

    var leave = el("button", "", "先离开，回选词页");
    leave.addEventListener("click", function(){ endSession(S, "left"); save(); goPointer({ seq: 0, screen: "PICK" }); });
    stage.appendChild(leave);

    var dots = el("div", "dots");
    for(var r = 1; r <= ss.totalRounds; r++){
      dots.appendChild(el("span", r === ss.roundNo ? "dot on" : "dot", ""));
    }
    stage.appendChild(dots);
    return;
  }

  /* 没有选词出来的局（老路子走到这一屏）：照旧按 5 屏一局提示 */
  var rn = roundAtIndex(i), total = roundCount(S);
  stage.appendChild(el("div", "kicker", "第 " + rn + " 局 · " + ROUND_SIZE + " 屏走完"));
  stage.appendChild(el("div", "headline", "这局先到这儿"));
  stage.appendChild(el("div", "ask", rn < total
    ? "站起来松松肩、看一眼窗外，回来接着第 " + (rn + 1) + " 局。"
    : total + " 局都过完了，今天就到这儿。"));
  /* 老路走到这一屏也一样：这一局的词按 core_state 原句过一遍 */
  var rStart = (rn - 1) * ROUND_SIZE, rEnd = Math.min(rStart + ROUND_SIZE, flowList(S).length);
  appendCoreList(stage, tokensOfFlow(S, flowList(S).slice(rStart, rEnd)), "这一局的词，按意思过一遍");
  var b2 = el("button", "primary", rn < total ? ("接着第 " + (rn + 1) + " 局") : "看看这一趟的帮手区");
  b2.addEventListener("click", function(){
    if(rn < total) goPointer(afterRoundPointer(S));
    else goPointer({ seq: S.progress.seq, screen: "HELPER" });
  });
  stage.appendChild(b2);
  var dots2 = el("div", "dots");
  for(var r2 = 1; r2 <= total; r2++) dots2.appendChild(el("span", r2 === rn ? "dot on" : "dot", ""));
  stage.appendChild(dots2);
}

/* 收尾屏 */
/* 后加的题那份账在纯函数段（laterAdded），渲染这一层只按账出按钮 */

function renderEnd(stage){
  var wTotal = DATA.words.length, sTotal = DATA.sentences.length;
  stage.appendChild(el("div", "kicker", roundCount(S) + " 局走完了"));
  stage.appendChild(el("div", "headline", wTotal + " 个词、" + sTotal + " 句、" + (DATA.word_quiz || []).length + " 个单词题，混着过了一遍"));
  /* 整轮走完：按词把 core_state 原句列出来，这是这一趟走过的东西 */
  appendCoreList(stage, tokensOfFlow(S), "按词对一遍，这一趟走过这些意思");
  stage.appendChild(el("div", "ask", "想再看一遍，就从第一屏重来。"));
  var again = el("button", "primary", "再走一遍");
  again.addEventListener("click", function(){
    S.progress.answers = {};
    goPointer({ seq: 0, screen: "Q" });
  });
  stage.appendChild(again);
  /* 后加的题还没做完（含跳着看到收尾屏的情形），收尾屏给一个直接接着做的出口 */
  var rest = laterAdded(S);
  if(rest.length > 0){
    var more = el("button", "", "接着做后加的题，" + rest.length + " 屏");
    more.addEventListener("click", function(){
      goPointer({ seq: rest[0], screen: "Q" });
    });
    stage.appendChild(more);
  }
}

/* ================= 选词页：先挑词，再开局 ================= */
/* 这一页只管挑：能背的词都列出来，默认勾好 5 个，勾几个都行；超过 5 个就按 5 个一局分开打 */
var pickRowRefs = [];
var pickSyncFn = null;

function pickRow(stage, box, info){
  var on = pickSelOf(S).indexOf(info.token) >= 0;
  var row = el("button", on ? "pickrow on" : "pickrow");
  var tick = el("span", "pickbox", on ? "好" : "");
  row.appendChild(tick);
  var mid = el("div", "pickmid");
  mid.appendChild(el("div", "pickword", info.word));
  mid.appendChild(el("div", "pickmean", info.meaning || "缺释义"));
  mid.appendChild(el("div", "pickkind", info.kinds || ""));
  row.appendChild(mid);
  row.appendChild(el("span", "picktag tag-" + (info.tag || "新"), info.tag || "新"));
  row.addEventListener("click", function(){
    var p = S.progress;
    var sel = pickSelOf(S).slice();
    var at = sel.indexOf(info.token);
    if(at >= 0) sel.splice(at, 1); else sel.push(info.token);
    p.pickSel = sel;
    p.sessNote = "";
    save();
    /* 只刷这一行和底部摘要：整页重渲染会把滚动位置顶回最上面，勾一个跳一次很难用 */
    var nowOn = pickSelOf(S).indexOf(info.token) >= 0;
    row.className = nowOn ? "pickrow on" : "pickrow";
    tick.textContent = nowOn ? "好" : "";
    if(typeof pickSyncFn === "function") pickSyncFn();
  });
  pickRowRefs.push({ tok: info.token, row: row, tick: tick });
  box.appendChild(row);
}

function renderPick(stage){
  var p = S.progress;
  var sel = pickSelOf(S);
  var sec = pickSections(S);
  var sug = pickSuggest(sel.length);
  var resume = sessOf(S);
  var i;
  pickRowRefs.length = 0;

  stage.appendChild(el("div", "kicker", "选词"));
  if(resume){
    var left = 0;
    for(i = 0; i < resume.flow.length; i++){ if(!answerOf(S, resume.flow[i].mid)) left++; }
    stage.appendChild(el("div", "pickhint", "手上还有一局没打完（第 " + resume.roundNo + "/" + resume.totalRounds
      + " 局，还剩 " + left + " 屏），要接着打就点下面。"));
    var rb = el("button", "primary", "接着打没打完的这一局");
    rb.addEventListener("click", function(){
      var f = flowList(S);
      var at = (typeof S.progress.seq === "number") ? S.progress.seq : 0;
      if(at > f.length - 1) at = 0;
      goPointer({ seq: at, screen: "Q" });
    });
    stage.appendChild(rb);
  } else if(p.sessNote === "done"){
    stage.appendChild(el("div", "pickhint", "上一局打完了。勾选还留着，想再打同一批就直接开始，想换就改动一下。"));
  }

  stage.appendChild(el("div", "headline", "这一局背哪几个词？"));
  stage.appendChild(el("div", "ask", "下面列出来的都能背。一局固定 5 个词、5 屏，一屏过一个词，打完回这一页。"));

  function group(title, items, note){
    if(!items.length) return;
    stage.appendChild(el("div", "picksec", title));
    if(note) stage.appendChild(el("div", "picknote", note));
    var box = el("div", "picklist");
    for(var k = 0; k < items.length; k++){ if(items[k]) pickRow(stage, box, items[k]); }
    stage.appendChild(box);
  }

  if(sec.suggestItems.length){
    group("建议先背这 " + sec.suggestItems.length + " 个（要回炉的、还没露过面的）", sec.suggestItems,
      "默认就勾着这几个，不想背哪个点一下取消。");
  }
  group("预置词（" + sec.preset.length + " 个）", sec.preset, "");
  group("词表里加进来的词（" + sec.imported.length + " 个）", sec.imported,
    "这些词没有句子，只能出词义和汉语两种题。");

  if(!sec.all.length){
    stage.appendChild(el("div", "pickhint", "现在还没有能背的词，先去词表里加一批。"));
  }

  var sumEl = el("div", "picksum", sug.text);
  stage.appendChild(sumEl);

  /* 批量勾选也走就地刷新：勾完还停在原来那一行，不把人送回页顶 */
  function syncPickRows(){
    var cur = pickSelOf(S);
    for(var r = 0; r < pickRowRefs.length; r++){
      var it2 = pickRowRefs[r];
      var isOn = cur.indexOf(it2.tok) >= 0;
      it2.row.className = isOn ? "pickrow on" : "pickrow";
      if(it2.tick) it2.tick.textContent = isOn ? "好" : "";
    }
  }
  function syncPickFooter(){
    var cur = pickSelOf(S);
    var sg2 = pickSuggest(cur.length);
    sumEl.textContent = sg2.text;
    go.textContent = cur.length ? (sg2.mainLabel + "（已选 " + cur.length + " 个）") : "先勾几个词";
    go.disabled = !cur.length;
    if(typeof syncAllBtn === "function") syncAllBtn();
  }

  var line = el("div", "pickline");
  var bSug = el("button", "pickbtn", "回到建议的 5 个");
  bSug.addEventListener("click", function(){ p.pickSel = defaultPickSel(S); p.sessNote = ""; save(); syncPickRows(); syncPickFooter(); });
  var bAll = el("button", "pickbtn", "全选");
  bAll.addEventListener("click", function(){
    p.pickSel = pickSections(S).all.map(function(x){ return x.token; });
    p.sessNote = ""; save(); syncPickRows(); syncPickFooter();
  });
  var bNone = el("button", "pickbtn", "全不选");
  bNone.addEventListener("click", function(){ p.pickSel = []; p.sessNote = ""; save(); syncPickRows(); syncPickFooter(); });
  line.appendChild(bSug); line.appendChild(bAll); line.appendChild(bNone);
  stage.appendChild(line);

  function begin(mode){
    var started = startSession(S, pickSelOf(S), mode);
    if(!started.ok){
      $("ioTip").textContent = "这几个词这会儿排不出题来，换几个再试。";
      render();
      return;
    }
    if(started.skipped && started.skipped.length){
      $("ioTip").textContent = "有几个词这会儿排不出题，先跳过了：" + started.skipped.join("、");
    } else {
      $("ioTip").textContent = "";
    }
    save();
    goPointer({ seq: 0, screen: "Q" });
  }

  var go = el("button", "primary", sel.length ? (sug.mainLabel + "（已选 " + sel.length + " 个）") : "先勾几个词");
  go.disabled = !sel.length;
  go.addEventListener("click", function(){ if(pickSelOf(S).length) begin("one"); });
  stage.appendChild(go);

  /* 「一次弄完」只在勾超过一局时露头：先建好藏着，就地勾词时切显隐就行 */
  var allBtn = el("button", "");
  allBtn.hidden = true;
  allBtn.addEventListener("click", function(){ if(!allBtn.hidden) begin("all"); });
  stage.appendChild(allBtn);
  function syncAllBtn(){
    var n = pickSelOf(S).length;
    if(n > ROUND_SIZE){
      allBtn.textContent = "一次弄完（" + n + " 个词，" + pickSuggest(n).rounds + " 局连着打）";
      allBtn.hidden = false;
    } else {
      allBtn.hidden = true;
    }
  }
  syncAllBtn();
  pickSyncFn = function(){ syncPickRows(); syncPickFooter(); };

  /* 词表和帮手区还是原来的入口，选词页上留一个门，不让人回不去 */
  var line2 = el("div", "pickline");
  var wb = el("button", "pickbtn", "看词表");
  wb.addEventListener("click", function(){ backScreen = "PICK"; backSeq = 0; goPointer({ seq: S.progress.seq, screen: "WORDS" }); });
  var hb = el("button", "pickbtn", "去帮手区");
  hb.addEventListener("click", function(){ backScreen = "PICK"; backSeq = 0; goPointer({ seq: S.progress.seq, screen: "HOME" }); });
  line2.appendChild(wb); line2.appendChild(hb);
  stage.appendChild(line2);
}

function helperLineHtml(h){
  if(!h || h.kind === "none") return "";
  var word = "<b>" + escapeHtml(h.old_word) + "</b>";
  if(h.kind === "chunk"){
    return "旧词 " + word + " 和新词共享连续 " + String(h.chunk).length + " 个字母块「<b>"
      + escapeHtml(h.chunk) + "</b>」：" + escapeHtml(h.note);
  }
  return "旧词 " + word + "：" + escapeHtml(h.note);
}

    rbtn.addEventListener("click", function(){

  if(fau.lost.length){
    fl.appendChild(el("div", "frow", "丢：" + fau.lost.join("、")));
  }

  back.addEventListener("click", function(){ backToStudy(); });
  stage.appendChild(back);

  var tools = el("div", "rowline");
  var toWords = el("button", "", "我的词表");
  toWords.addEventListener("click", function(){
    goPointer({ seq: S.progress.seq, screen: "WORDS" });
  });
  var toJson = el("button", "", "导出词表JSON");
  toJson.addEventListener("click", function(){
    $("ioPanel").hidden = false;
    $("ioText").value = JSON.stringify({ kind: "vocab_pool", exported: todayKey(), items: poolItems(S) }, null, 2);
    $("ioTip").textContent = "上面这段是旧词池的完整内容，复制走存好即可。";
  });
  tools.appendChild(toWords);
  tools.appendChild(toJson);
  stage.appendChild(tools);
}

function renderWordRows(container){
  if(!pendingWords.length){
    container.appendChild(el("div", "ask", "解析出来的词会列在这里，一行一个，自己挑「我会」还是「我在学」。"));
  } else {
    pendingWords.forEach(function(p){
      var r = el("div", "wordrow");
      r.appendChild(el("div", "ww", p.word));
      r.appendChild(el("div", "wm", p.meaning || MISSING_MEANING_TAG));
      var seg = el("div", "seg");
      [["mastered", "我会"], ["upgrading", "我在学"]].forEach(function(pair){
        var b = el("button", p.pick === pair[0] ? "pick" : "", pair[1]);
        b.addEventListener("click", function(){
          pendingWords.forEach(function(x){ if(x === p) x.pick = pair[0]; });
          render();
        });
        seg.appendChild(b);
      });
      r.appendChild(seg);
      var dseg = el("div", "dseg");
      var dbtn = el("button", "drillbtn", "直背");
      dbtn.addEventListener("click", function(){ jumpDrill({ word: p.word, meaning: p.meaning }, { seq: backSeq, screen: backScreen }); });
      dseg.appendChild(dbtn);
      r.appendChild(dseg);
      container.appendChild(r);
    });
  }

  /* 已经存进旧词池的词也在这张列表里一列：每个词后面都挂「硬背」，不必等它被排成题 */
  var stored = poolItems(S);
  if(stored.length){
    container.appendChild(el("div", "kicker", "存在词表里的 " + stored.length + " 个词 · 每个都能直接硬背"));
    stored.slice(0, 200).forEach(function(e){
      var r2 = el("div", "poolwordrow");
      r2.appendChild(el("div", "ww", e.word));
      r2.appendChild(el("div", "wm", String(e.meaning || "").trim() ? e.meaning : MISSING_MEANING_TAG));
      r2.appendChild(el("div", "ps " + e.state, POOL_STATE_TEXT[e.state] + " · 第" + ((e.stage || 0) + 1) + "档"));
      var d2 = el("div", "dseg");
      var b2 = el("button", "drillbtn", "硬背");
      b2.addEventListener("click", function(){ jumpDrill({ word: e.word, meaning: e.meaning }, { seq: S.progress.seq, screen: "WORDS" }); });
      d2.appendChild(b2);
      r2.appendChild(d2);
      container.appendChild(r2);
    });
    if(stored.length > 200){
      container.appendChild(el("div", "ask", "这里只列前 200 个，剩下的按「今天要带回」在帮手区里排。"));
    }
  }
}

function renderWords(stage){
  stage.appendChild(el("div", "kicker", "词表"));
  stage.appendChild(el("div", "headline", "把自己的词表放进来"));
  stage.appendChild(el("div", "ask",
    "一行一个词，也可以逗号、空格、制表符分开；写成「单词 中文释义」会把释义一起记下来。解析只在这台机器上做，不联网、不上传。"));
  stage.appendChild(el("div", "ask",
    "带释义的词存进来就能马上做题：给单词选汉语、给汉语选英文各一道，四个选项从同一批词的释义和拼写里挑，存完就排进下一局；"
    + "没带释义的先标着「缺释义·待补」，补上释义再排。整句题要有句子数据，所以上传的词只出这两种。"));

  var box = el("div", "wlbox");
  var ta = el("textarea", "wlText");
  ta.value = wlRaw;
  ta.addEventListener("input", function(){ wlRaw = ta.value; });
  box.appendChild(ta);
  stage.appendChild(box);
  wlTextarea = ta;

  var pick = document.createElement("input");
  pick.type = "file";
  pick.accept = ".txt,.csv,text/plain";
  var hiddenBox = el("div", "filebox");
  hiddenBox.hidden = true;
  hiddenBox.appendChild(pick);
  stage.appendChild(hiddenBox);

  var tip = el("div", "ask", "");
  var row1 = el("div", "rowline");
  var fileBtn = el("button", "", "选用本地文件");
  fileBtn.addEventListener("click", function(){ pick.click(); });
  pick.addEventListener("change", function(){
    var f = pick.files && pick.files[0];
    if(!f) return;
    if(typeof FileReader === "undefined"){
      tip.textContent = "这个环境读不了本地文件，先把词打开复制，粘进上面的框里。";
      return;
    }
    var fr = new FileReader();
    fr.onload = function(){
      wlRaw = String(fr.result == null ? "" : fr.result);
      pendingWords = parseWordList(wlRaw).map(function(o){
        return { word: o.word, meaning: o.meaning, pick: "upgrading" };
      });
      render();
    };
    fr.onerror = function(){ tip.textContent = "这个文件没读进来，先把它打开复制，粘进上面的框里。"; };
    fr.readAsText(f, "UTF-8");
  });

  var parseBtn = el("button", "", "解析一下");
  parseBtn.addEventListener("click", function(){
    if(wlTextarea) wlRaw = wlTextarea.value;
    pendingWords = parseWordList(wlRaw).map(function(o){
      return { word: o.word, meaning: o.meaning, pick: "upgrading" };
    });
    render();
  });
  row1.appendChild(fileBtn);
  row1.appendChild(parseBtn);
  stage.appendChild(row1);
  stage.appendChild(tip);

  if(pendingWords.length){
    stage.appendChild(el("div", "kicker", "解析到 " + pendingWords.length + " 个词 · 自己挑一边"));
    var bulk = el("div", "rowline");
    var allKnow = el("button", "", "全标「我会」");
    allKnow.addEventListener("click", function(){
      pendingWords.forEach(function(x){ x.pick = "mastered"; });
      render();
    });
    var allLearn = el("button", "", "全标「我在学」");
    allLearn.addEventListener("click", function(){
      pendingWords.forEach(function(x){ x.pick = "upgrading"; });
      render();
    });
    bulk.appendChild(allKnow);
    bulk.appendChild(allLearn);
    stage.appendChild(bulk);

    var saveRow = el("div", "rowline");
    var saveBtn = el("button", "main", "存进旧词池");
    saveBtn.addEventListener("click", function(){
      var add = 0, base = poolItems(S).length, batch = [];
      pendingWords.forEach(function(p, i){
        if(!poolFind(S, p.word)){
          var off = staggerOffset(base + i);
          poolAdd(S, p.word, p.meaning, p.pick, addDaysKey(todayKey(), off), stageForOffset(off));
          add += 1;
        } else {
          poolAdd(S, p.word, p.meaning, p.pick, addDaysKey(todayKey(), 0), 0);
        }
        var one = poolFind(S, p.word);
        if(one && String(one.meaning || "").trim()) batch.push(one);
      });
      normalizePool(S);
      /* 带释义的词当场排题，接在下一局开头，立刻进 5 屏一局与三形式混排的队列 */
      var made = insertPoolQuiz(S, batch);
      save();
      pendingWords = [];
      wlRaw = "";
      $("ioTip").textContent = "词表已存进旧词池，新加 " + add + " 个；其中 " + made.words + " 个带释义的词排了 "
        + made.screens + " 道题（给单词选汉语、给汉语选英文各一道），接在下一局开头；"
        + made.missing + " 个标「缺释义·待补」，补上释义再排。";
      goPointer({ seq: S.progress.seq, screen: "HOME" });
    });
    saveRow.appendChild(saveBtn);
    stage.appendChild(saveRow);
  }

  /* 我的词表：解析出来的词 + 已存进池的词，一行一个，每行都有「硬背」入口 */
  stage.appendChild(el("div", "kicker", "我的词表 · 每个词都能直接硬背"));
  var list = el("div", "wordlist");
  renderWordRows(list);
  stage.appendChild(list);

  var backRow = el("div", "rowline");
  var back = el("button", "", "回帮手区");
  back.addEventListener("click", function(){
    goPointer({ seq: S.progress.seq, screen: "HOME" });
  });
  backRow.appendChild(back);
  stage.appendChild(backRow);
}

$("btnFeatureBack").addEventListener("click", function(){
  var at = featureJumpAt;
  featureJumpAt = null;
  goPointer({ seq: (at ? at.seq : S.progress.seq), screen: "HOME" });
  var box = $("featureBox");
  if(box && box.scrollIntoView) box.scrollIntoView({ block: "start" });
});

$("btnHome").addEventListener("click", function(){
  var sc = S.progress.screen;
  if(sc === "DRILL"){ goBackFromDrill(); return; }
  if(sc === "HOME"){ goPointer({ seq: backSeq, screen: backScreen }); return; }
  backSeq = S.progress.seq;
  backScreen = sc;
  goPointer({ seq: S.progress.seq, screen: "HOME" });
});

/* ================= 导出 / 导入 ================= */
/* 备份进度：帮手区底部点一下，整段进度出现在下面的框里，复制走存好 */
$("btnBackup").addEventListener("click", function(){
  $("backupRow").hidden = false;
  $("ioPanel").hidden = false;
  $("ioText").value = buildExport(S);
  $("ioTip").textContent = "上面这一段就是当前的进度，复制走存好，换台机器或是明天再粘回来都行。";
});
/* 从备份接着做：把存着的那一段粘回框里，点「读入这段备份」 */
$("btnRestore").addEventListener("click", function(){
  $("backupRow").hidden = false;
  $("ioPanel").hidden = false;
  $("ioText").value = "";
  $("ioTip").textContent = "把之前备份的那一整段粘进框里，再点「读入这段备份」，进度就接回来了。";
});
$("ioCopy").addEventListener("click", function(){
  var box = $("ioText");
  box.focus();
  box.select();
  var done = false;
  try { done = document.execCommand && document.execCommand("copy"); } catch(e){ done = false; }
  $("ioTip").textContent = done ? "这一段已经复制好了，找个地方存起来。" : "框里这一段已经全选，按 Ctrl+C 复制走就行。";
});
$("ioClose").addEventListener("click", function(){ $("ioPanel").hidden = true; });
$("ioDoImport").addEventListener("click", function(){
  try {
    var o = JSON.parse($("ioText").value);
    if(o && o.kind === "vocab_pool" && Array.isArray(o.items)){
      S.pool = { items: [] };
      o.items.forEach(function(e, i){
        if(!e || !e.word) return;
        var off = staggerOffset(i);
        var n = poolAdd(S, e.word, e.meaning, e.state, e.next_due, e.stage);
        if(n){
          n.stage = (typeof e.stage === "number") ? e.stage : stageForOffset(off);
          n.next_due = e.next_due || addDaysKey(todayKey(), off);
          n.right = (typeof e.right === "number") ? e.right : 0;
          n.miss = (typeof e.miss === "number") ? e.miss : 0;
          n.from = e.from || "import";
          n.await_confirm = e.await_confirm || "";
        }
      });
      normalizePool(S);
      save();
      $("ioTip").textContent = "词表已读入，旧词池现在有 " + poolItems(S).length + " 个词。";
      render();
      return;
    }
    S = parseImport($("ioText").value);
    save();
    $("ioTip").textContent = "已经接上了，接着备份时那一步往下走。";
    render();
  } catch(e){
    $("ioTip").textContent = "这段内容读不进来，确认是完整导出的 JSON。";
  }
});
$("ioClear").addEventListener("click", function(){
  S = defaultState();
  save();
  $("ioText").value = "";
  $("ioTip").textContent = "进度已清空，回到第 1 局第 1 屏。";
  render();
});

/* 自测与排查用出口：清单校验、锚点账本、每屏内容闸都从真实代码里取一次 */
window.__VOCAB__ = {
  manifest: function(){ return featureManifestAudit(S.data); },
  audit: function(){ return featureAudit(scriptSource(), S.data.feature_manifest || []); },
  ledger: function(){ return anchorLedger(S.data); },
  gapAt: function(seq){ return screenGap(S, flowList(S)[seq]); },
  methodOf: function(seq){ return methodPlan(S, flowList(S)[seq]); },
  drillNow: function(){ return drillStepAt(S); },
  drillModes: function(){
    var out = [];
    for(var i = 0; i < DRILL_MODES.length; i++) out.push(DRILL_MODES[i].id + " " + DRILL_MODES[i].name);
    return out;
  },
  drillModeOf: function(){ return drillModeOf(S); },
  drillSetMode: function(id){ drillSetMode(S, id); save(); render(); },
  drillDoneCount: function(){ return drillModesDone(S); },
  featureGuide: function(id){ return featureGuide(id); },
  featureTarget: function(id){ return featureTarget(id); },
  featureGo: function(id){ return featureGo(id); },
  /* 第二段出口：次数回响、答偏那三块、按词列 core_state */
  tokenOfSeq: function(seq){ var it = flowList(S)[seq]; return tokenOfItem(it); },
  hitsOf: function(token){ return hitsOf(S, token); },
  bumpHit: function(token){ var n = bumpHit(S, token); save(); render(); return n; },
  hitLine: function(token){ return hitLine(hitsOf(S, token)); },
  kindlyPool: function(){ return KINDLY.slice(); },
  gapTextAt: function(seq){
    var it = flowList(S)[seq]; if(!it) return "";
    var fc = faceAt(S, it); if(!fc || !fc.choices) return "";
    var op = optionIn(S.data, it.sentence_id == null ? -1 : it.sentence_id);
    var notes = (op && op.notes) || [];
    var at = (fc.correct_index == null ? 0 : fc.correct_index);
    var other = (at === 0 ? 1 : 0);
    return gapTextOf(notes[other], fc.choices[at], fc.choices[other]);
  },
  oldLinkAt: function(seq){ return oldLinkOf(S, flowList(S)[seq]); },
  coreRows: function(tokens){ return coreRowsOf(S, tokens || tokensOfFlow(S)); },
  backupVisible: function(){ return !$("backupRow").hidden; },
  hasTopExport: function(){ return !!$("btnExport"); },
  hasBackupBtns: function(){ return !!$("btnBackup") && !!$("btnRestore"); },
  restoreState: function(raw){ return restoreState(raw); },
  savedPayload: function(){ try { return localStorage.getItem(STORAGE_KEY); } catch(e){ return null; } },
  bar: function(){ return barText(S); },
  /* 自测要在真渲染层验某一屏时，先问这屏是什么、答过没有，再跳过去 */
  kindAt: function(seq){
    var it = flowList(S)[seq];
    return it ? String(it.kind || "") + "/" + String(it.form || "") : "";
  },
  doneAt: function(seq){
    var it = flowList(S)[seq];
    return !!it && !!answerOf(S, it.mid);
  },
  /* 自测要按真值点对时，先问这屏该点第几条、选项分别是什么，避免按固定下标点 */
  keyAt: function(seq){
    var it = flowList(S)[seq];
    if(!it) return null;
    var f = faceAt(S, it);
    if(!f || !f.choices || !f.choices.length) return null;
    return { form: f.form, choices: f.choices.slice(), correct: f.correct };
  },
  /* 第一段：选词页勾了哪些、这一局的形状、夸词池，都从真代码里取 */
  picks: function(){
    var sel = pickSelOf(S), sug = pickSuggest(sel.length);
    return { sel: sel.slice(), rounds: sug.rounds, lastRound: sug.lastRound,
             text: sug.text, mainLabel: sug.mainLabel,
             all: pickSections(S).all.map(function(x){
               return { token: x.token, word: x.word, meaning: x.meaning || "",
                        canSentence: !!x.canSentence, kinds: x.kinds || "" };
             }) };
  },
  sess: function(){
    var ss = sessOf(S);
    if(!ss) return null;
    var forms = [], i;
    for(i = 0; i < ss.flow.length; i++) forms.push(String(ss.flow[i].form || ""));
    return { roundNo: ss.roundNo, totalRounds: ss.totalRounds, mode: String(ss.mode || ""),
             words: (ss.words || []).slice(), screens: ss.flow.length, forms: forms,
             batch: sessionBatchTokens(S, ss.roundNo), redo: (ss.redo || []).slice() };
  },
  quips: function(){ return JSON.parse(JSON.stringify(QUIPS)); },
  toPick: function(){ endSession(S, "left"); save(); render(); },
  jump: function(seq){ goPointer({ seq: seq, screen: "Q" }); },
  laterSeqs: function(){ return laterAdded(S); },
  flowLen: function(){ return flowList(S).length; },
  screen: function(){ return String(S.progress.screen || "Q"); },
  seq: function(){ return S.progress.seq || 0; },
  poolWords: function(){
    return poolItems(S).map(function(e){
      return { word: e.word, meaning: e.meaning, state: e.state, stage: e.stage || 0 };
    });
  },
  /* 这一屏的旧词标签指向哪个旧词、什么档位；没有标签返回 null */
  baitAt: function(seq){
    var it = flowList(S)[seq];
    if(!it || it.sentence_id == null) return null;
    var b = baitFor(S, it.sentence_id);
    if(!b) return null;
    return { word: b.entry.word, meaning: b.entry.meaning, state: b.entry.state, stage: b.entry.stage || 0 };
  },
  /* D3 出口：这一屏换没换旧词、换的是哪个、落在第几格 */
  d3At: function(seq){
    var it = flowList(S)[seq];
    if(!it) return null;
    var f = faceAt(S, it);
    if(!f) return null;
    var d = f.d3 || { replaced: false, old_word: "", slot: -1, reason: "非句子题" };
    return { replaced: !!d.replaced, old_word: d.old_word || "", slot: typeof d.slot === "number" ? d.slot : -1,
             reason: d.reason || "", choices: (f.choices || []).slice(), correct: f.correct };
  },
  d3Audit: function(){ return d3Audit(S); },
  d3InSentence: function(text, word){ return d3InSentence(text, word); },
  d3CleanMeaning: function(raw){ return d3CleanMeaning(raw); },
  d3Stem: function(w){ return d3Stem(w); }
};

var bootManifest = featureManifestAudit(S.data);
var bootAudit = featureAudit(scriptSource(), S.data.feature_manifest || []);
if(!bootManifest.pass){
  $("ioTip").textContent = "已确认功能清单对不上：" + bootManifest.missing.join("、");
} else if(!bootAudit.pass){
  $("ioTip").textContent = "已确认功能在代码里对不上：" + bootAudit.lost.join("、");
}

render();
})();

</script>
